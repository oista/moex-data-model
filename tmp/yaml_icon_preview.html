<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YAML source-file icon preview</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background:
      linear-gradient(45deg, #eceae6 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(-45deg, #eceae6 25%, transparent 25%) 0 8px / 16px 16px,
      #f6f5f3;
    color: #222;
    padding: 28px;
  }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #555; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 20px; margin: 18px 0; }
  .label { width: 160px; font-size: 13px; }
  .panel {
    background: #fff;
    border: 1px solid #ddd9d2;
    border-radius: 10px;
    padding: 16px 20px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .nav-kind {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    text-align: center;
    overflow: visible;
    box-sizing: border-box;
  }
  .nav-kind.nav-kind-yaml {
    width: 20px;
    min-width: 20px;
    height: 16px;
    border: 0;
    background: transparent;
    color: #e24a1a;
  }
  .nav-kind.nav-kind-yaml .nav-kind-yaml-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .nav-kind.nav-kind-yaml .nav-kind-yaml-shape path,
  .nav-kind.nav-kind-yaml .nav-kind-yaml-shape rect {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.15;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .nav-kind.nav-kind-yaml .nav-kind-yaml-label {
    position: relative;
    z-index: 1;
    display: block;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    color: inherit;
    transform: translateY(0.5px);
  }
  .nav-kind.nav-kind-folder {
    width: 20px;
    min-width: 20px;
    height: 16px;
    padding: 3px 0 0;
    border: 0;
    background: transparent;
    color: #8a8680;
  }
  .nav-kind.nav-kind-folder .nav-kind-folder-shape {
    position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
  }
  .nav-kind.nav-kind-folder .nav-kind-folder-shape path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.15;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .nav-kind.nav-kind-letter {
    width: 16px;
    min-width: 16px;
    height: 16px;
    font-size: 10px;
    font-weight: 700;
    border: 1px solid #c8c4bc;
    border-radius: 3px;
    color: #6b7280;
  }
  .big .nav-kind.nav-kind-yaml {
    width: 160px;
    min-width: 160px;
    height: 128px;
  }
  .big .nav-kind-yaml-label {
    font-size: 28px;
    font-weight: 700;
    transform: none;
  }
  .nav { background: #fff; border: 1px solid #ddd9d2; border-radius: 8px; padding: 8px 12px; width: 280px; }
  .nav-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 4px 0;
  }
</style>
</head>
<body>
<h1>YAML source-file icon</h1>
<p>Тонкий контур 1.15 как у папок. Один цвет #e24a1a, без заливки.</p>

<div class="row big">
  <div class="label">крупно</div>
  <div class="panel">
    <span class="nav-kind nav-kind-yaml" aria-hidden="true">
      <svg class="nav-kind-yaml-shape" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7.1 3.4h7.2L18.6 8v11.2a2.1 2.1 0 0 1-2.1 2.1H7.1A2.1 2.1 0 0 1 5 19.2V5.5A2.1 2.1 0 0 1 7.1 3.4z"/>
        <path d="M14.3 3.4V8h4.3"/>
        <path d="M8 7.4h5.4M8 9.3h4.2M8 11.2h3.4"/>
        <rect x="3.2" y="12.15" width="17.6" height="5.1" rx="2.55"/>
        <path d="M8.8 19.35h6.4M10 21h4"/>
      </svg>
      <span class="nav-kind-yaml-label">yaml</span>
    </span>
  </div>
</div>

<div class="row">
  <div class="label">размер nav (20×16)</div>
  <div class="panel">
    <span class="nav-kind nav-kind-yaml" aria-hidden="true">
      <svg class="nav-kind-yaml-shape" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7.1 3.4h7.2L18.6 8v11.2a2.1 2.1 0 0 1-2.1 2.1H7.1A2.1 2.1 0 0 1 5 19.2V5.5A2.1 2.1 0 0 1 7.1 3.4z"/>
        <path d="M14.3 3.4V8h4.3"/>
        <path d="M8 7.4h5.4M8 9.3h4.2M8 11.2h3.4"/>
        <rect x="3.2" y="12.15" width="17.6" height="5.1" rx="2.55"/>
        <path d="M8.8 19.35h6.4M10 21h4"/>
      </svg>
      <span class="nav-kind-yaml-label">yaml</span>
    </span>
    <span class="nav-kind nav-kind-folder">
      <svg class="nav-kind-folder-shape" viewBox="0 0 24 20"><path d="M4.45 3.4h7.35L14 6.5h5.55A3.05 3.05 0 0 1 22.6 9.55v4.8A3.05 3.05 0 0 1 19.55 17.4H4.45A3.05 3.05 0 0 1 1.4 14.35V6.45A3.05 3.05 0 0 1 4.45 3.4z"/></svg>
    </span>
    <span class="nav-kind nav-kind-letter">C</span>
    <span class="nav-kind nav-kind-letter">G</span>
  </div>
</div>

<div class="row">
  <div class="label">в дереве</div>
  <div class="nav">
    <div class="nav-row" style="color:#888">Спецификация</div>
    <div class="nav-row">
      <span class="nav-kind nav-kind-yaml" aria-hidden="true">
        <svg class="nav-kind-yaml-shape" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7.1 3.4h7.2L18.6 8v11.2a2.1 2.1 0 0 1-2.1 2.1H7.1A2.1 2.1 0 0 1 5 19.2V5.5A2.1 2.1 0 0 1 7.1 3.4z"/>
          <path d="M14.3 3.4V8h4.3"/>
          <path d="M8 7.4h5.4M8 9.3h4.2M8 11.2h3.4"/>
          <rect x="3.2" y="12.15" width="17.6" height="5.1" rx="2.55"/>
          <path d="M8.8 19.35h6.4M10 21h4"/>
        </svg>
        <span class="nav-kind-yaml-label">yaml</span>
      </span>
      Конверт спецификации
    </div>
    <div class="nav-row">
      <span class="nav-kind nav-kind-yaml" aria-hidden="true">
        <svg class="nav-kind-yaml-shape" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7.1 3.4h7.2L18.6 8v11.2a2.1 2.1 0 0 1-2.1 2.1H7.1A2.1 2.1 0 0 1 5 19.2V5.5A2.1 2.1 0 0 1 7.1 3.4z"/>
          <path d="M14.3 3.4V8h4.3"/>
          <path d="M8 7.4h5.4M8 9.3h4.2M8 11.2h3.4"/>
          <rect x="3.2" y="12.15" width="17.6" height="5.1" rx="2.55"/>
          <path d="M8.8 19.35h6.4M10 21h4"/>
        </svg>
        <span class="nav-kind-yaml-label">yaml</span>
      </span>
      moex-core.yaml
    </div>
  </div>
</div>
</body>
</html>
