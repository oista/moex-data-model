<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YAML icon scaled</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f6f5f3; color: #222; padding: 28px; }
  .row { display: flex; align-items: center; gap: 16px; margin: 18px 0; }
  .label { width: 140px; font-size: 13px; color: #555; }
  .panel { background: #fff; border: 1px solid #ddd9d2; border-radius: 10px; padding: 16px 20px; display: inline-flex; align-items: center; gap: 12px; }
  .nav-kind { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .nav-kind.nav-kind-yaml { width: 14px; min-width: 14px; height: 16px; background: transparent; }
  .nav-kind.nav-kind-yaml .nav-kind-yaml-shape { display: block; width: 14px; height: 16px; }
  .big .nav-kind.nav-kind-yaml { width: 140px; min-width: 140px; height: 156px; }
  .big .nav-kind-yaml-shape { width: 140px; height: 156px; }
  .nav-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .letter { width: 16px; height: 16px; border: 1px solid #c8c4bc; border-radius: 3px; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #6b7280; }
</style>
</head>
<body>
<h1>yaml source_file — слот 14×16</h1>
<div class="row big">
  <div class="label">крупно</div>
  <div class="panel">
    <span class="nav-kind nav-kind-yaml">
      <svg class="nav-kind-yaml-shape" viewBox="0 0 80 89" fill="none">
        <g stroke="#ff6641" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.8 35.4V18.2A8.2 8.2 0 0 1 23 10h27.6L66.2 23.6v11.8"/>
          <path d="M50.6 10v13.6h15.6"/>
          <path d="M24.2 21.6h24.8M24.2 28.8h20.2M24.2 36h13.6"/>
          <rect x="6.6" y="37.2" width="66.8" height="23.4" rx="8.4"/>
          <path d="M14.8 60.6v10.6A8.2 8.2 0 0 0 23 79.4h34.2A8.2 8.2 0 0 0 65.4 71.2V60.6"/>
          <path d="M26.8 66.4h26.4M31.2 73.6h17.6"/>
        </g>
        <text x="40" y="53.4" text-anchor="middle" fill="#ff6641" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">yaml</text>
      </svg>
    </span>
  </div>
</div>
<div class="row">
  <div class="label">nav 14×16</div>
  <div class="panel">
    <span class="nav-kind nav-kind-yaml">
      <svg class="nav-kind-yaml-shape" viewBox="0 0 80 89" fill="none">
        <g stroke="#ff6641" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.8 35.4V18.2A8.2 8.2 0 0 1 23 10h27.6L66.2 23.6v11.8"/>
          <path d="M50.6 10v13.6h15.6"/>
          <path d="M24.2 21.6h24.8M24.2 28.8h20.2M24.2 36h13.6"/>
          <rect x="6.6" y="37.2" width="66.8" height="23.4" rx="8.4"/>
          <path d="M14.8 60.6v10.6A8.2 8.2 0 0 0 23 79.4h34.2A8.2 8.2 0 0 0 65.4 71.2V60.6"/>
          <path d="M26.8 66.4h26.4M31.2 73.6h17.6"/>
        </g>
        <text x="40" y="53.4" text-anchor="middle" fill="#ff6641" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">yaml</text>
      </svg>
    </span>
    <span class="letter">C</span>
    <span class="letter">G</span>
  </div>
</div>
<div class="row">
  <div class="label">в дереве</div>
  <div class="panel" style="flex-direction:column;align-items:flex-start;width:280px">
    <div class="nav-row" style="color:#888">Спецификация</div>
    <div class="nav-row">
      <span class="nav-kind nav-kind-yaml">
        <svg class="nav-kind-yaml-shape" viewBox="0 0 80 89" fill="none">
          <g stroke="#ff6641" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.8 35.4V18.2A8.2 8.2 0 0 1 23 10h27.6L66.2 23.6v11.8"/>
            <path d="M50.6 10v13.6h15.6"/>
            <path d="M24.2 21.6h24.8M24.2 28.8h20.2M24.2 36h13.6"/>
            <rect x="6.6" y="37.2" width="66.8" height="23.4" rx="8.4"/>
            <path d="M14.8 60.6v10.6A8.2 8.2 0 0 0 23 79.4h34.2A8.2 8.2 0 0 0 65.4 71.2V60.6"/>
            <path d="M26.8 66.4h26.4M31.2 73.6h17.6"/>
          </g>
          <text x="40" y="53.4" text-anchor="middle" fill="#ff6641" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">yaml</text>
        </svg>
      </span>
      Конверт спецификации
    </div>
  </div>
</div>
</body>
</html>
