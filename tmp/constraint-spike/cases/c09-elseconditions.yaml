id: https://spike.example/schema
name: spike
prefixes:
  ex: https://spike.example/
  linkml: https://w3id.org/linkml/
default_prefix: ex
default_range: string
imports:
- linkml:types
classes:
  T:
    attributes:
      kind:
        range: string
      a:
        range: string
      b:
        range: string
      n1:
        range: integer
      n2:
        range: integer
      flag:
        range: boolean
    rules:
    - preconditions:
        slot_conditions:
          kind:
            equals_string: X
      postconditions:
        slot_conditions:
          a:
            value_presence: PRESENT
      elseconditions:
        slot_conditions:
          b:
            value_presence: PRESENT
