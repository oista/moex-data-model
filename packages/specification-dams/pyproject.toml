[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-specification-dams"
version = "0.1.0"
description = "DAMS specification module: semantic rules, graph view, conformance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "moex-modeling-kernel",
    "moex-standard-linkml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "moex-modeling-kernel[dev]",
    "moex-standard-linkml[dev]",
]

[project.scripts]
moex-dams-assess = "moex_dams.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
