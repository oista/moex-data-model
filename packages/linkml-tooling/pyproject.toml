[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-linkml-tooling"
version = "0.1.0"
description = "Optional LinkML Map + schema-automator adapters behind modeling-kernel ports (Stage 7)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moex-modeling-kernel",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
map = [
    "linkml-map==0.5.4",
    "linkml-runtime>=1.7,<2.0",
]
automator = [
    "schema-automator==0.5.7",
    "linkml-runtime>=1.7,<2.0",
    "SQLAlchemy>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "moex-modeling-kernel[dev]",
    "moex-linkml-tooling[map,automator]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
