[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-publication"
version = "0.1.0"
description = "Publication read models projected from the modeling vertical slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "moex-modeling-kernel",
    "moex-specification-dams",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "moex-modeling-kernel[dev]",
    "moex-specification-dams[dev]",
]

[project.scripts]
moex-publication = "moex_publication.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
