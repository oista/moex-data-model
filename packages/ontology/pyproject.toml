[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-ontology"
version = "0.1.0"
description = "Compatibility shim: FIBO export CLI over moex-standard-owl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moex-standard-owl",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "moex-standard-owl[dev]"]

[project.scripts]
fibo-export = "moex_standard_owl.fibo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
