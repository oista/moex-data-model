# FIBO glossary publication (preview sample only — not the full mart).
# Update packages/ontology/publications/fibo_glossary.preview.csv manually via PR.
module_id: moex:module:fibo
kind: publication_module
version: "1"
order: 200
icon: "📚"
title: FIBO Glossary
description: Preview of FIBO class definitions for glossary mapping (committed sample; release content / Impl)
sections:
  - id: explorer
    title: Class explorer
    description: Domains and asserted subClassOf tree (preview) with full class cards
    type: explorer
    source:
      format: csv
      path: publications/fibo_glossary.preview.csv
    key_column: local_name
    tags:
      - fibo
      - preview
      - ontology

  - id: glossary
    title: Glossary (preview)
    description: Sample terms from FND/BE/FBC/SEC/DER with curated RU labels. Full export is gitignored under output/.
    type: glossary
    source:
      format: csv
      path: publications/fibo_glossary.preview.csv
    key_column: local_name
    columns:
      - local_name
      - label
      - label_ru
      - definition
      - definition_ru
      - parent_local_name
      - source_domain
      - iri
    filterable:
      - source_domain
    tags:
      - fibo
      - preview

  - id: hierarchy
    title: Class hierarchy (preview)
    description: Asserted rdfs:subClassOf among terms present in the preview sample (parent_local_name).
    type: tree
    source:
      format: csv
      path: publications/fibo_glossary.preview.csv
    key_column: local_name
    tags:
      - fibo
      - preview
      - hierarchy
