[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-standard-linkml"
version = "0.1.0"
description = "LinkML provider: ER-dictionary ingest to DAMS ModelPackage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "linkml>=1.7,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
moex-linkml = "moex_standard_linkml.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
