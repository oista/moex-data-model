# Canonical ER-dictionary ingest profile for DAMS ModelPackage bootstrap.
# Remap sheet/column names to match a concrete workbook without changing code.

name: er-dictionary
solution_ref: eam:solution/PILOT
solution_slug: pilot
id_prefix: dams
package_name: pilot_solution_model
package_title: Pilot solution model
package_description: Ingested from ER dictionary spreadsheet
model_version: "0.1.0"
api_version: dams.moex/v0.1

conforms_to:
  specification_id: moex-dams
  specification_version: "0.1"
  specification_revision: "0.1.0"

sheets:
  conceptual:
    sheet: Conceptual
    required: false
    columns:
      name: name
      title: title
      description: description
  entities:
    sheet: Entities
    required: true
    columns:
      name: name
      title: title
      description: description
      conceptual_ref: conceptual_ref
  attributes:
    sheet: Attributes
    required: true
    columns:
      entity: entity
      name: name
      title: title
      description: description
      type: type
      required: required
      pk: pk
  relationships:
    sheet: Relationships
    required: false
    columns:
      name: name
      source: source
      target: target
      source_role: source_role
      target_role: target_role
      source_card: source_card
      target_card: target_card
      identifying: identifying
  physical_objects:
    sheet: PhysicalObjects
    required: false
    columns:
      name: name
      title: title
      description: description
      object_kind: object_kind
      qualified_name: qualified_name
      technology: technology
      system_ref: system_ref
      direction: direction
      native_schema_ref: native_schema_ref
  physical_fields:
    sheet: PhysicalFields
    required: false
    columns:
      object: object
      name: name
      description: description
      native_name: native_name
      native_type: native_type
      required: required
      schema_path: schema_path
  mappings:
    sheet: Mappings
    required: false
    columns:
      name: name
      source: source
      target: target
      mapping_type: mapping_type
      mapping_cardinality: mapping_cardinality

defaults:
  lifecycle_status: draft
  solution_data_role: producer
  domain_ref: eam:domain/PILOT
  namespace: https://data.moex.com/models/pilot/
  entity_type: core
  data_class: master_data
  business_importance: medium
  context_name: PilotContext
  context_title: Pilot domain context
  context_description: Auto-generated domain context for ingested logical entities

type_map:
  VARCHAR: string
  NVARCHAR: string
  CHAR: string
  TEXT: string
  STRING: string
  NUMBER: integer
  INTEGER: integer
  INT: integer
  BIGINT: integer
  DECIMAL: decimal
  NUMERIC: decimal
  FLOAT: decimal
  DOUBLE: decimal
  BOOLEAN: boolean
  BOOL: boolean
  DATE: date
  DATETIME: datetime
  TIMESTAMP: datetime
  TIME: time
  BINARY: binary
  BLOB: binary
  URI: uri
  UUID: identifier
  IDENTIFIER: identifier
  PK: identifier
