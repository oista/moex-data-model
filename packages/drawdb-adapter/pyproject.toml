[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-drawdb-adapter"
version = "0.1.0"
description = "DBML parse / ModelPatch / drawDB projection bridge (ADR-005/006)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "moex-specification-dams",
    "moex-modeling-kernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "PyYAML>=6.0,<7.0",
    "moex-specification-dams[dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
