[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-standard-owl"
version = "0.1.0"
description = "OWL/RDF provider: parsing, FIBO export, OAK/RDFLib adapters for MOEX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0,<8.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0",
    "moex-modeling-kernel",
]

[project.optional-dependencies]
oak = ["oaklib>=0.6,<1.0"]
dev = ["pytest>=8.0,<9.0", "moex-standard-owl[oak]"]

[project.scripts]
fibo-export = "moex_standard_owl.fibo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
