module_id: moex:module:dams
kind: publication_module
version: "1"
order: 100
icon: "📐"
title: MOEX standart
description: "MOEX DAMS 0.1 reference specification (LinkML) — publication projection of the schema body"
sections:
  - id: overview
    title: Overview
    description: Package README
    type: markdown-doc
    source:
      format: markdown
      path: README.md

  - id: explorer
    title: Specification explorer
    description: Schema packages and classes of the DAMS reference specification (TSpecBody projection)
    type: explorer
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: classes
    groupby: schema

  - id: classes
    title: All classes
    description: Flat class table (secondary; primary nav is Specification explorer)
    type: entity-table
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: classes
    columns:
      - name
      - description
      - is_a
      - abstract
      - mixins
    filterable:
      - is_a
      - abstract
    sort:
      by: name
      order: asc
    default_collapsed: true

  - id: slots
    title: All slots
    description: Flat slot table (secondary)
    type: entity-table
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: slots
    columns:
      - name
      - description
      - range
      - required
      - multivalued
    filterable:
      - range
      - required
    default_collapsed: true

  - id: enums
    title: All enumerations
    description: Flat enum table (secondary)
    type: enum-table
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: enums
    columns:
      - name
      - description
    default_collapsed: true
