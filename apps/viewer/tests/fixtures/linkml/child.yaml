id: https://example.org/child
name: child_schema
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
imports:
  - linkml:types
default_prefix: ex

classes:
  ChildClass:
    is_a: RootClass
    description: Child of RootClass
    slots:
      - child_slot

slots:
  child_slot:
    range: string
    description: Local slot on ChildClass
