[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-publication-viewer"
version = "0.1.0"
description = "Static HTML publication viewer for MOEX data model artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "Jinja2==3.1.6",
    "Markdown==3.10.3",
    "linkml-runtime==1.11.1",
    "ruamel.yaml==0.18.10",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
moex-viewer = "moex_publication_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
