[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-publication-viewer"
version = "0.1.0"
description = "Static HTML publication viewer for MOEX data model artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "Jinja2>=3.1,<4.0",
    "Markdown>=3.5,<4.0",
    "linkml-runtime>=1.7,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
moex-viewer = "moex_publication_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
