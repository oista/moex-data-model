element_id: dams:model/trading/1.0.0
name: trading_solution_model
title: Модель данных торгового решения
description: >
  Черновой пример модели одного ИТ-решения (dams-data-model / solution).
  Local Client conceptual entity is transitional; canonical Party concepts
  live in moex-enterprise-conceptual-model. TradingClient realizes LegalEntity.
lifecycle_status: draft
api_version: dams.moex/v0.1
model_version: 1.0.0
implementation_scope: solution
conceptual_implementation_ref: moex:implementation:moex-enterprise-conceptual-model:0.1
solution_ref: eam:solution/TRADING
data_owner_ref: org:role/CLIENT_DATA_OWNER
ownership_inheritance_rule: >-
  Ответственность за данные наследуется от ИТ-решения eam:solution/TRADING
  при отсутствии локального override на сущности.
conceptual_entities:
  - element_id: dams:concept/Client
    name: Client
    title: Клиент
    description: >
      Переходное локальное понятие решения. Canonical SoT —
      dams:concept/LegalEntity в enterprise conceptual model.
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: high
domain_contexts:
  - element_id: dams:context/trading
    name: TradingContext
    title: Торговый контекст
    description: Контекст торговых операций.
    lifecycle_status: active
    domain_ref: eam:domain/MARKETS
    solution_ref: eam:solution/TRADING
    namespace: https://data.moex.com/models/trading/
logical_entities:
  - element_id: dams:logical/trading/Client
    name: TradingClient
    title: Клиент торгового решения
    description: Локальное логическое представление клиента в торговом решении.
    lifecycle_status: active
    context_ref: dams:context/trading
    conceptual_entity_refs:
      - dams:concept/Client
      - dams:concept/LegalEntity
    solution_ref: eam:solution/TRADING
    solution_data_role: producer
    entity_type: core
    data_class: master_data
    business_importance: high
    data_owner_ref: org:role/CLIENT_DATA_OWNER
    governance_classification: confidential
    conceptual_alignment_status: aligned
    alignment_rationale: >
      Локальная проекция LegalEntity для торгового контура; сохраняет ссылку
      на корпоративное понятие и локальный Client.
    identity_rule: >
      Клиент торгового решения идентифицируется корпоративным идентификатором
      клиента в контуре торговли.
    business_key_kind: external
    sensitivity_term_refs:
      - catalog:classification/PDN
    attributes:
      - element_id: dams:logical/trading/Client/clientId
        name: client_id
        title: Идентификатор клиента
        description: Уникальный идентификатор клиента в корпоративном контуре.
        lifecycle_status: active
        owner_entity_ref: dams:logical/trading/Client
        logical_type: identifier
        required: true
        multivalued: false
        governance_classification: confidential
        mapping_coverage_status: mapped
      - element_id: dams:logical/trading/Client/fullName
        name: full_name
        title: Полное наименование
        description: Полное имя физического лица или наименование организации.
        lifecycle_status: active
        owner_entity_ref: dams:logical/trading/Client
        logical_type: string
        required: true
        multivalued: false
        governance_classification: restricted
        mapping_coverage_status: planned
        mapping_rationale: >
          Физическое поле полного наименования будет добавлено в схему события
          в следующей ревизии топика.
        sensitivity_term_refs:
          - catalog:classification/PDN
    key_attribute_refs:
      - dams:logical/trading/Client/clientId
physical_objects:
  - element_id: dams:physical/trading/client-topic
    name: client_changed_topic
    title: Поток изменений клиентов
    description: Kafka topic с событиями изменения клиента.
    lifecycle_status: active
    solution_ref: eam:solution/TRADING
    system_ref: eam:system/TRADING_CORE
    object_kind: topic
    qualified_name: trading.client.changed.v1
    technology: Apache Kafka
    native_schema_ref: https://schemas.moex.com/trading/client-changed/1.0.0
    direction: outbound
    mapping_coverage_status: mapped
    physical_fields:
      - element_id: dams:physical/trading/client-topic/client_id
        name: client_id
        description: Физическое поле идентификатора клиента.
        lifecycle_status: active
        physical_object_ref: dams:physical/trading/client-topic
        native_name: client_id
        native_type: string
        required: true
        schema_path: /payload/client_id
        mapping_coverage_status: mapped
mappings:
  - element_id: dams:mapping/trading/client-realizes-legal-entity
    name: realizes_TradingClient_LegalEntity
    description: >
      Solution TradingClient realizes enterprise conceptual LegalEntity (ADR-021).
    lifecycle_status: active
    source_refs:
      - dams:logical/trading/Client
    target_refs:
      - dams:concept/LegalEntity
    mapping_type: realizes
    mapping_cardinality: one_to_one
    approval_status: proposed
  - element_id: dams:mapping/trading/client-entity-physical
    name: map_client_entity_to_topic
    description: Entity-level mapping TradingClient ↔ client_changed topic.
    lifecycle_status: active
    source_refs:
      - dams:physical/trading/client-topic
    target_refs:
      - dams:logical/trading/Client
    mapping_type: entity_physical
    mapping_cardinality: one_to_one
  - element_id: dams:mapping/trading/client-id
    name: map_client_id
    description: Соответствие логического идентификатора физическому полю события (mapsTo).
    lifecycle_status: active
    source_refs:
      - dams:logical/trading/Client/clientId
    target_refs:
      - dams:physical/trading/client-topic/client_id
    mapping_type: field_mapping
    mapping_cardinality: one_to_one
    approval_status: approved
