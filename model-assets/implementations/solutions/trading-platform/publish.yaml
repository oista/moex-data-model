module_id: moex:module:trading-solution
kind: publication_module
version: "1"
order: 300
icon: "🧩"
title: Trading solution (demo)
profile: implementation
description: Example solution model instance for publication viewer demos
implementation_profile: dams-data-model
dams_model_level: solution
conformance_status: draft-conformant
# Declares coverage of DAMS publication contract (ADR-019 / ADR-021).
implements:
  - specification_ref: moex-dams@0.1
    profile_ref: dams-solution
    conformance_target: draft
sections:
  - id: package
    title: Package
    kind: overview
    type: key-value
    satisfies:
      - dams:overview
      - implementation:overview
    source:
      format: yaml
      path: trading-solution-model.yaml

  # Conceptual SoT lives in moex-enterprise-conceptual-model
  # (conceptual_implementation_ref / ADR-029). This section projects
  # LogicalEntity → ConceptualEntity links, not local ConceptualEntity copies.

  - id: logical
    title: Logical entities
    kind: classes
    type: entity-table
    instance_of: LogicalEntity
    satisfies:
      - dams:classes
      - dams:logical-entities
      - dams:logical-attributes
      - dams:relationships
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: logical_entities
    key_column: element_id
    columns:
      - name
      - title
      - description
      - solution_data_role
      - governance_classification
    filterable:
      - solution_data_role
      - governance_classification

  - id: conceptual
    title: Conceptual entities links
    kind: classes
    type: entity-table
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: conceptual_entity_links
    key_column: element_id
    columns:
      - logical_title
      - logical_entity_ref
      - conceptual_entity_ref
      - conceptual_alignment_status
      - alignment_rationale
    filterable:
      - conceptual_alignment_status

  - id: logical-erd
    title: Logical ER diagram
    kind: classes
    type: mermaid-diagram
    source:
      format: markdown
      path: publications/logical.erd.md

  - id: physical
    title: Physical objects
    kind: bindings
    type: entity-table
    instance_of: PhysicalObject
    satisfies:
      - dams:physical-objects
      - dams:physical-fields
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: physical_objects
    key_column: element_id
    columns:
      - name
      - title
      - description
      - object_kind
      - technology
    filterable:
      - object_kind

  - id: physical-erd
    title: Physical ER diagram
    kind: bindings
    type: mermaid-diagram
    source:
      format: markdown
      path: publications/physical.erd.md

  # Projected from packages/publication (vertical slice: assess → graph → JSON)
  - id: slice-summary
    title: Vertical slice summary
    description: Conformance + graph projection from moex-publication export-slice
    kind: conformance
    type: key-value
    satisfies:
      - dams:conformance
      - implementation:conformance
      - dams:declared-binding
    source:
      format: json
      path: publications/vertical_slice.json
      select: summary

  - id: slice-nodes
    title: Slice graph nodes
    kind: bindings
    type: entity-table
    satisfies:
      - dams:physical-mappings
    source:
      format: json
      path: publications/vertical_slice.json
      select: nodes
    key_column: id
    columns:
      - kind
      - name
      - title
      - description
    filterable:
      - kind

  - id: slice-relations
    title: Slice universe relations
    kind: data-flows
    type: entity-table
    source:
      format: json
      path: publications/vertical_slice.json
      select: relations
    key_column: id
    columns:
      - kind
      - source
      - target
    filterable:
      - kind

  - id: model-assessment
    title: Оценка соответствия требованиям модели
    kind: model-assessment
    type: entity-table
    satisfies:
      - dams:model-assessment
    source:
      format: json
      path: publications/vertical_slice.json
      select: model_assessment
    key_column: id
    columns:
      - status
      - requirement_code
      - severity
      - subject
      - finding
      - remediation
    filterable:
      - status
      - severity
      - requirement_code

  - id: documentation
    title: Documentation
    kind: documentation
    type: markdown-doc
    source:
      format: yaml
      path: docs/toc.yaml

  - id: artifact-model-body
    title: Тело модели
    description: Authored ModelPackage body for this solution (TImplBody).
    kind: source
    type: source-file
    source:
      format: yaml
      path: trading-solution-model.yaml

  - id: artifact-envelope
    title: Конверт реализации
    description: SpecificationImplementation envelope (conforms_to, body_ref, provenance).
    kind: source
    type: source-file
    source:
      format: yaml
      path: implementation.yaml
