module_id: moex:module:trading-solution
kind: publication_module
version: "1"
order: 300
icon: "🧩"
title: Trading solution (demo)
profile: implementation
description: Example solution model instance for publication viewer demos
# Declares coverage of DAMS publication contract (ADR-019).
# conformance_profile: dams-logical-and-physical
implements:
  - specification_ref: moex-dams@0.1
    profile_ref: dams-logical-and-physical
    conformance_target: draft
sections:
  - id: package
    title: Package
    kind: overview
    type: key-value
    satisfies:
      - dams:overview
      - implementation:overview
    source:
      format: yaml
      path: trading-solution-model.yaml

  - id: conceptual
    title: Conceptual entities
    kind: classes
    type: entity-table
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: conceptual_entities
    key_column: element_id
    columns:
      - name
      - title
      - description
      - entity_type
      - data_class
    filterable:
      - entity_type
      - data_class

  - id: logical
    title: Logical entities
    kind: classes
    type: entity-table
    satisfies:
      - dams:classes
      - dams:logical-entities
      - dams:logical-attributes
      - dams:relationships
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: logical_entities
    key_column: element_id
    columns:
      - name
      - title
      - description
      - solution_data_role
      - governance_classification
    filterable:
      - solution_data_role
      - governance_classification

  - id: physical
    title: Physical objects
    kind: bindings
    type: entity-table
    satisfies:
      - dams:physical-objects
      - dams:physical-fields
    source:
      format: yaml
      path: trading-solution-model.yaml
      select: physical_objects
    key_column: element_id
    columns:
      - name
      - title
      - description
      - object_kind
      - technology
    filterable:
      - object_kind

  # Projected from packages/publication (vertical slice: assess → graph → JSON)
  - id: slice-summary
    title: Vertical slice summary
    description: Conformance + graph projection from moex-publication export-slice
    kind: conformance
    type: key-value
    satisfies:
      - dams:conformance
      - implementation:conformance
      - dams:declared-binding
    source:
      format: json
      path: publications/vertical_slice.json
      select: summary

  - id: slice-nodes
    title: Slice graph nodes
    kind: bindings
    type: entity-table
    satisfies:
      - dams:physical-mappings
    source:
      format: json
      path: publications/vertical_slice.json
      select: nodes
    key_column: id
    columns:
      - kind
      - name
      - title
      - description
    filterable:
      - kind

  - id: slice-relations
    title: Slice universe relations
    kind: data-flows
    type: entity-table
    source:
      format: json
      path: publications/vertical_slice.json
      select: relations
    key_column: id
    columns:
      - kind
      - source
      - target
    filterable:
      - kind
