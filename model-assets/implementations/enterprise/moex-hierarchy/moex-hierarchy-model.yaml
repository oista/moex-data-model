element_id: dams:model/hierarchy/0.1.0
api_version: dams.moex/v0.1
model_version: 0.1.0
implementation_scope: enterprise
name: moex.hierarchy
title: moex.hierarchy
description: Derived hierarchy projection across DAMS implementations (entities and relationships only;
  no attributes / physical).
conceptual_entities:
- element_id: dams:concept/AccountingSystem
  name: AccountingSystem
  title: АБС
  description: Автоматизированная банковская / учётная система (АБС).
- element_id: dams:concept/Act
  name: Act
  title: Акт
  description: Акт (документальный факт). В ER-черновике — тонкая заглушка без атрибутов; концепт без
    PK/FK-колонок (ADR-029).
- element_id: dams:concept/Asset
  name: Asset
  title: Актив
  description: Базовый актив / underlying в торговом и риск-контексте.
- element_id: dams:concept/Benchmark
  name: Benchmark
  title: Бенчмарк
  description: Бенчмарк / эталонный индикатор в торговом контуре.
- element_id: dams:concept/Budget
  name: Budget
  title: Бюджет
  description: Бюджет, связанный с проектом.
- element_id: dams:concept/Currency
  name: Currency
  title: Валюта
  description: Валюта номинала / расчётов (из FK на счетах пользователя).
- element_id: dams:concept/SalesFunnel
  name: SalesFunnel
  title: Воронка продаж
  description: Воронка продаж / CRM-воронка. Атрибуты черновика (дата рождения) игнорируются — только
    концепт.
- element_id: dams:concept/AssetGroup
  name: AssetGroup
  title: Группа активов
  description: Группировка активов для классификации / риск-параметров.
- element_id: dams:concept/CorporateGroup
  name: CorporateGroup
  title: Группа компаний
  description: Группа компаний / холдинговая структура для членства LegalEntity.
- element_id: dams:concept/Department
  name: Department
  title: Департамент
  description: Организационное подразделение; может относиться к группе компаний.
- element_id: dams:concept/Deposit
  name: Deposit
  title: Депозит
  description: Депозит; в черновике связан со счётом.
- element_id: dams:concept/ContractAmendment
  name: ContractAmendment
  title: Дополнительное соглашение
  description: Доп. соглашение к договору (Agreement); может быть связано с сотрудником.
- element_id: dams:concept/Admission
  name: Admission
  title: Допуск к торгам
  description: Решение/факт допуска LegalEntity к площадке или секции с lifecycle-статусом. MOEX-local
    extension concept (no-mapping к FIBO по умолчанию).
- element_id: dams:concept/Income
  name: Income
  title: Доход
  description: Доходная статья / факт дохода по ЦФО и группе компаний.
- element_id: dams:concept/UnifiedLimit
  name: UnifiedLimit
  title: Единый лимит
  description: Единый лимит участника по расчётному коду / рынку.
- element_id: dams:concept/Task
  name: Task
  title: Задача
  description: Задача проекта.
- element_id: dams:concept/Order
  name: Order
  title: Заявка
  description: Заявка ТКС на инструмент от участника торгов.
- element_id: dams:concept/OrganizationIdentifier
  name: OrganizationIdentifier
  title: Идентификатор организации
  description: Идентификатор организации (LEI, ИНН, ОГРН, внутренний код участника и др.). Значения типов
    — MOEX-local controlled vocabulary, не FIBO terms.
- element_id: dams:concept/Instrument
  name: Instrument
  title: Инструмент
  description: Торговый инструмент, основанный на активе и связанный с эмитентом.
- element_id: dams:concept/InformationSystem
  name: InformationSystem
  title: Инфо-система
  description: Информационная система / приложение корпоративного контура.
- element_id: dams:concept/CalendarDay
  name: CalendarDay
  title: Календарный день
  description: День торгового календаря.
- element_id: dams:concept/Client
  name: Client
  title: Клиент
  description: Клиент биржевого/торгового контура со своим идентификатором. Может относиться к Person
    и/или LegalEntity (XOR на логическом уровне; обе связи концептуально необязательны — не AND depends_on).
- element_id: dams:concept/Counterparty
  name: Counterparty
  title: Контрагент
  description: Роль LegalEntity как контрагента по договорам и платежам. Reified role, не подкласс LegalEntity.
- element_id: dams:concept/CorporateAction
  name: CorporateAction
  title: Корпоративное событие
  description: Корпоративное событие по инструменту / эмитенту.
- element_id: dams:concept/Curve
  name: Curve
  title: Кривая
  description: Кривая (доходности / ставок и т.п.).
- element_id: dams:concept/CouponPayment
  name: CouponPayment
  title: Купонная выплата
  description: Купонная выплата по инструменту; может относиться к корпоративному событию.
- element_id: dams:concept/SubledgerAccount
  name: SubledgerAccount
  title: Лицевой счёт
  description: Лицевой счёт (субсчёт) при счёте АБС.
- element_id: dams:concept/TradingLogin
  name: TradingLogin
  title: Логин ТКС
  description: Логин участника торгов; связан с типом подключения.
- element_id: dams:concept/MarketingCampaign
  name: MarketingCampaign
  title: Маркетинговая кампания
  description: Маркетинговая кампания.
- element_id: dams:concept/RoleAssignment
  name: RoleAssignment
  title: Назначение роли
  description: Ассоциация роли и пользователя (Состав ролей).
- element_id: dams:concept/Collateral
  name: Collateral
  title: Обеспечение участника
  description: Обеспечение участника торгов активами на рынке.
- element_id: dams:concept/Organization
  name: Organization
  title: Организация
  description: Организация как бизнес-актор (включая юридические лица и иные организационные формы в корпоративном
    контексте МОЕХ).
- element_id: dams:concept/OpenPosition
  name: OpenPosition
  title: Открытая позиция
  description: Открытая позиция участника по инструменту.
- element_id: dams:concept/Payment
  name: Payment
  title: Платёж
  description: Платёж по продукту с участием клиента и/или контрагента.
- element_id: dams:concept/SupportingDocument
  name: SupportingDocument
  title: Подтверждающий документ
  description: Документ/запись, подтверждающая допуск, действие или соглашение.
- element_id: dams:concept/User
  name: User
  title: Пользователь
  description: Учётная запись пользователя приложений (IAM). Связь с инфо-системами отложена.
- element_id: dams:concept/Portfolio
  name: Portfolio
  title: Портфель
  description: Портфель активов, связанный со счётом АБС.
- element_id: dams:concept/JournalEntry
  name: JournalEntry
  title: Проводка
  description: Бухгалтерская / учётная проводка по счёту АБС.
- element_id: dams:concept/MarketMakingProgram
  name: MarketMakingProgram
  title: Программа маркет-мейкинга
  description: Программа маркет-мейкинга (ММ).
- element_id: dams:concept/Sale
  name: Sale
  title: Продажа
  description: Факт продажи продукта клиенту.
- element_id: dams:concept/Product
  name: Product
  title: Продукт
  description: Коммерческий продукт биржи / группы, связанный с услугой и тарифом.
- element_id: dams:concept/Project
  name: Project
  title: Проект
  description: Проект / инициатива (управление работами и бюджетом).
- element_id: dams:concept/AssetPool
  name: AssetPool
  title: Пул активов
  description: Пул активов (состав через AssetPoolMembership).
- element_id: dams:concept/Expense
  name: Expense
  title: Расход
  description: Расходная статья / факт расхода по ЦФО и группе компаний.
- element_id: dams:concept/SettlementCode
  name: SettlementCode
  title: Расчётный код
  description: Расчётный код участника торгов. Специализация AccountRelationship (parent_concept_ref),
    characteristic of TradingParticipation.
  parent_concept_ref: dams:concept/AccountRelationship
- element_id: dams:concept/RegistrationAction
  name: RegistrationAction
  title: Регистрационное действие
  description: Действие, меняющее lifecycle организации или допуска (registration, suspension, termination,
    …). MOEX-local extension concept.
- element_id: dams:concept/TradingMode
  name: TradingMode
  title: Режим торгов
  description: Режим торгов (не TradingSection и не TradingVenue). Определяет правила исполнения заявок
    и сделок.
- element_id: dams:concept/Rating
  name: Rating
  title: Рейтинг
  description: Рейтинг юридического лица.
- element_id: dams:concept/AssetRiskParameter
  name: AssetRiskParameter
  title: Риск-параметр актива
  description: Риск-параметр / характеристика актива на дату.
- element_id: dams:concept/Role
  name: Role
  title: Роль
  description: Роль доступа / полномочия в прикладных системах (без привязки к инфо-системе в этой волне).
- element_id: dams:concept/Trade
  name: Trade
  title: Сделка
  description: Сделка ТКС — самостоятельная транзакционная сущность (primary), несмотря на FK на участника/инструмент
    в ER-черновике.
- element_id: dams:concept/LoginEvent
  name: LoginEvent
  title: Событие логина
  description: Событие логина ТКС; зависит от TradingLogin.
- element_id: dams:concept/Agreement
  name: Agreement
  title: Соглашение
  description: Договор или соглашение, регулирующее участие / допуск.
- element_id: dams:concept/AssetPoolMembership
  name: AssetPoolMembership
  title: Состав пула активов
  description: Ассоциация актива и пула активов (M:N).
- element_id: dams:concept/Employee
  name: Employee
  title: Сотрудник
  description: Роль Person как сотрудника (reified). Не подкласс Person. Связан со штатной единицей.
- element_id: dams:concept/LedgerAccount
  name: LedgerAccount
  title: Счёт АБС
  description: Счёт в АБС / главной книге.
- element_id: dams:concept/UserLedgerLink
  name: UserLedgerLink
  title: Счёт пользователя
  description: Связь пользователя приложений со счётом АБС (associative).
- element_id: dams:concept/AccountRelationship
  name: AccountRelationship
  title: Счётное отношение
  description: Учётное/счётное отношение организации или участия (trading, clearing, settlement и др.).
    MOEX-local extension concept.
- element_id: dams:concept/Tariff
  name: Tariff
  title: Тариф
  description: Тариф / прайс для продукта или услуги.
- element_id: dams:concept/ConnectionType
  name: ConnectionType
  title: Тип подключения
  description: Тип подключения / логина к торговой системе.
- element_id: dams:concept/TradingVenue
  name: TradingVenue
  title: Торговая площадка
  description: Торговая площадка / рынок, к которому относится допуск. Принадлежит торговой системе (TradingSystem);
    не путать с режимом торгов (TradingMode) и секцией (TradingSection).
- element_id: dams:concept/TradingSection
  name: TradingSection
  title: Торговая секция
  description: Торговая секция / сегмент площадки (MOEX-local extension concept).
- element_id: dams:concept/TradingSession
  name: TradingSession
  title: Торговая сессия
  description: Сессия торгов на площадке / системе в календарный день.
- element_id: dams:concept/TradingSystem
  name: TradingSystem
  title: Торговая система
  description: Торговая система / ТКС, на которой ведутся рынки и сессии.
- element_id: dams:concept/TradingCalendar
  name: TradingCalendar
  title: Торговый календарь
  description: Календарь торговых дней / сессий.
- element_id: dams:concept/TradingAccount
  name: TradingAccount
  title: Торговый счёт
  description: Торговый счёт ТКС при расчётном коде. Специализация AccountRelationship.
  parent_concept_ref: dams:concept/AccountRelationship
- element_id: dams:concept/TradingTerminal
  name: TradingTerminal
  title: Торговый терминал
  description: Торговый терминал. В ER-черновике поля похожи на сделку — в КМД только концепт и опциональные
    связи.
- element_id: dams:concept/Obligation
  name: Obligation
  title: Требования и обязательства
  description: Требования и обязательства участника по активу / расчётному коду.
- element_id: dams:concept/EmploymentContract
  name: EmploymentContract
  title: Трудовой договор
  description: Трудовой договор сотрудника. Специализация Agreement (parent_concept_ref).
  parent_concept_ref: dams:concept/Agreement
- element_id: dams:concept/TimeEntry
  name: TimeEntry
  title: Трудозатрата
  description: Учёт трудозатрат сотрудника по задаче (associative).
- element_id: dams:concept/Service
  name: Service
  title: Услуга
  description: Услуга, оказываемая в рамках коммерческого каталога.
- element_id: dams:concept/CampaignMembership
  name: CampaignMembership
  title: Участие в кампании
  description: Ассоциация маркетинговой кампании и пользователя (Состав компаний в drawio).
- element_id: dams:concept/MarketMakingParticipation
  name: MarketMakingParticipation
  title: Участие в программе ММ
  description: Ассоциация участия в торгах и программы маркет-мейкинга.
- element_id: dams:concept/TradingParticipation
  name: TradingParticipation
  title: Участие в торгах
  description: 'Reified отношение: LegalEntity участвует в торгах на площадке/секции с собственным статусом,
    допуском, договором, счетами и документами. Не моделируется как подкласс LegalEntity (одна организация
    — много участий).'
- element_id: dams:concept/ClientAccount
  name: ClientAccount
  title: Учётная запись клиента
  description: 'Учётная запись клиента, через которую участие в торгах связывается с Client (drawio: Учетные
    записи клиентов).'
- element_id: dams:concept/Person
  name: Person
  title: Физическое лицо
  description: Физическое лицо как бизнес-актор (sibling Organization; общий Party отложен). Не подкласс
    Organization.
- element_id: dams:concept/FinancialReport
  name: FinancialReport
  title: Финансовая отчётность
  description: Финансовая отчётность юридического лица.
- element_id: dams:concept/CostCenter
  name: CostCenter
  title: ЦФО
  description: Центр финансовой ответственности.
- element_id: dams:concept/ClearingPositionDetail
  name: ClearingPositionDetail
  title: ЧПД
  description: 'ЧПД (черновик: счётоподобная сущность). Тонкий концепт; опциональная связь со счётом АБС.'
- element_id: dams:concept/StaffPosition
  name: StaffPosition
  title: Штатная единица
  description: Позиция штатного расписания в департаменте.
- element_id: dams:concept/Issuer
  name: Issuer
  title: Эмитент
  description: Роль LegalEntity как эмитента инструментов. Reified role, не подкласс LegalEntity (одна
    организация — много эмиссионных контекстов).
- element_id: dams:concept/LegalEntity
  name: LegalEntity
  title: Юридическое лицо
  description: Юридическое лицо / формальная организация, субъект прав и обязанностей в регуляторном и
    биржевом контексте.
  parent_concept_ref: dams:concept/Organization
  external_class_refs:
  - external_class_ref_id: dams:extref/LegalEntity/fibo-LegalPerson
    target_ref: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/LegalPerson
    match_kind: close
    source_kind: ontology
