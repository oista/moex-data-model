classes:
  MOEXModelRepository:
    name: MOEXModelRepository
    description: Корневой контейнер для проверки набора моделей, ссылочных проекций
      справочников, потоков и контрактных bindings.
    from_schema: https://data.moex.com/dams/v0.1
    slots:
    - repository_id
    - registry_entries
    - model_packages
    - data_flows
    - data_model_bindings
    - metrics
    - dimensions
    - classification_assignments
    - policy_bindings
    tree_root: true
  RegistryEntry:
    name: RegistryEntry
    description: Локальная ссылочная проекция записи внешней мастер-системы; не является
      мастер-копией справочника.
    from_schema: https://data.moex.com/dams/registries/v0.1
    abstract: true
    slots:
    - registry_id
    - registry_name
    - registry_description
    - master_system
    - source_uri
    - registry_status
  ITSystem:
    name: ITSystem
    description: ИТ-система; мастер данных — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  ITSolution:
    name: ITSolution
    description: ИТ-решение, объединяющее одну или несколько ИТ-систем; мастер данных
      — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
    slots:
    - member_system_refs
    - platform_ref
  ITPlatform:
    name: ITPlatform
    description: ИТ-платформа; мастер данных — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  BusinessDomain:
    name: BusinessDomain
    description: Бизнес-домен или предметная область; мастер определяется архитектурным
      governance
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
    slots:
    - parent_domain_ref
  GlossaryTerm:
    name: GlossaryTerm
    description: Термин корпоративного бизнес-глоссария.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  OrganizationUnit:
    name: OrganizationUnit
    description: Организационное подразделение.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  Role:
    name: Role
    description: Управляемая роль владельца, стюарда, потребителя или согласующего.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  DataClassificationTerm:
    name: DataClassificationTerm
    description: Специальная категория чувствительности или регулирования, например
      ПДн или инсайдерская информация.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  Policy:
    name: Policy
    description: Политика доступа, хранения, качества или архитектурный инвариант.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  BusinessProcess:
    name: BusinessProcess
    description: Ссылка на бизнес-процесс или его шаг в BPMN-репозитории.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  DataContractReference:
    name: DataContractReference
    description: Ссылка на дата-контракт в корпоративном дата-каталоге.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  IntegrationReference:
    name: IntegrationReference
    description: Ссылка на интеграцию в Clinkr.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  IdentifiedElement:
    name: IdentifiedElement
    description: 'Элемент с глобальным идентификатором element_id. Не смешивать с
      EmbeddedElement (local_key). ADR-044.

      '
    from_schema: https://data.moex.com/dams/base/v0.1
    abstract: true
    slots:
    - element_id
  NamedElement:
    name: NamedElement
    description: Именование элемента модели (name, title, aliases). ADR-044.
    from_schema: https://data.moex.com/dams/base/v0.1
    mixin: true
    slots:
    - name
    - title
    - aliases
  DescribedElement:
    name: DescribedElement
    description: 'Текстовое описание элемента. Глобально не обязательно; обязательность
      задаётся slot_usage на конкретных классах (ADR-044 / ADR-025).

      '
    from_schema: https://data.moex.com/dams/base/v0.1
    mixin: true
    slots:
    - description
  HasSemanticAnnotations:
    name: HasSemanticAnnotations
    description: Семантические аннотации (glossary_term_refs, tags). ADR-044.
    from_schema: https://data.moex.com/dams/base/v0.1
    mixin: true
    slots:
    - glossary_term_refs
    - tags
  HasValidity:
    name: HasValidity
    description: Период действия элемента (valid_from, valid_to). ADR-044.
    from_schema: https://data.moex.com/dams/base/v0.1
    mixin: true
    slots:
    - valid_from
    - valid_to
  ClassificationAssignment:
    name: ClassificationAssignment
    description: Версионируемое назначение категории классификации элементу модели
      с основанием и периодом действия.
    from_schema: https://data.moex.com/dams/governance/v0.1
    slots:
    - assignment_id
    - classified_element_ref
    - classification_term_ref
    - governance_classification
    - classification_source
    - classification_rationale
    - valid_from
    - valid_to
    - approval_status
  PolicyBinding:
    name: PolicyBinding
    description: Применение управляемой политики к элементу модели.
    from_schema: https://data.moex.com/dams/governance/v0.1
    slots:
    - policy_binding_id
    - policy_target_ref
    - policy_ref
    - valid_from
    - valid_to
    - approval_status
  HasLifecycle:
    name: HasLifecycle
    description: 'Mixin жизненного цикла: статус, период действия и ссылка на заменяющий
      элемент.'
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    mixins:
    - HasValidity
    slots:
    - lifecycle_status
    - deprecated_by_ref
  HasOwnership:
    name: HasOwnership
    description: 'Mixin владения: data owner, data steward и организационное подразделение.
      Отсутствие слота означает наследование эффективного значения по containment
      cascade (ADR-023); заданное значение — локальный override.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - data_owner_ref
    - data_steward_ref
    - owning_unit_ref
    - ownership_inheritance_rule
  HasBusinessClassification:
    name: HasBusinessClassification
    description: Классификация роли и бизнес-значимости логической сущности.
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - entity_type
    - data_class
    - business_importance
  HasGovernanceClassification:
    name: HasGovernanceClassification
    description: 'Базовая и специальная классификация чувствительности данных. governance_classification
      участвует в containment cascade (ADR-023): пустой слот наследуется от родителя,
      заданный — override.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - governance_classification
    - security_classification
    - sensitivity_term_refs
    - classification_source
    - classification_rationale
  HasPolicyBindings:
    name: HasPolicyBindings
    description: 'Mixin привязки управляемых политик к элементу модели. policy_refs
      участвует в containment cascade (ADR-023): отсутствие ключа — наследование;
      присутствующий список (в т.ч. пустой) — полная замена.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - policy_refs
  HasProvenance:
    name: HasProvenance
    description: 'Mixin происхождения и согласования: исходный артефакт, evidence,
      статус и согласующий.'
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - source_artifact_ref
    - evidence_refs
    - approval_status
    - approved_by_ref
    - approved_at
  HasDefinition:
    name: HasDefinition
    description: 'Mixin эталонного определения (ADR-025 / ADR-044). Слот description
      индуцируется через DescribedElement; exact_mappings указывает skos:definition
      (slot_uri не меняется — предикат dams:description). Отсутствие description при
      наличии definition_source_ref означает наследование; заданный description —
      own (опционально adapted from source). scoped_definitions — контекстные определения
      (v1: уровень ITSystem), не заменяющие эталон вне scope.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    mixins:
    - DescribedElement
    slots:
    - definition_source_ref
    - definition_rationale
    - scoped_definitions
    slot_usage:
      description:
        name: description
        description: 'Reference definition (skos:definition via exact_mappings; RDF
          predicate remains dams:description per ADR-044). Absent means inherit via
          definition_source_ref (ontology class or GlossaryTerm) per ADR-025. Prefer
          definition cascade over copying text from related ConceptualProperty / LogicalAttribute.

          '
        exact_mappings:
        - skos:definition
        required: false
  ScopedDefinition:
    name: ScopedDefinition
    description: 'Контекстное определение элемента модели (ADR-025 / ISO 11179 Context).
      Не является отдельным термином глоссария и не заменяет эталонное определение
      вне указанного scope.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixins:
    - HasProvenance
    slots:
    - scoped_definition_id
    - scope_kind
    - scope_ref
    - text
    - relation_to_reference
    - rationale
  ModelElement:
    name: ModelElement
    description: 'Абстрактный корень именованных элементов модели: IdentifiedElement
      + NamedElement + DescribedElement + HasLifecycle + HasSemanticAnnotations (ADR-044).

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: IdentifiedElement
    abstract: true
    mixins:
    - NamedElement
    - DescribedElement
    - HasLifecycle
    - HasSemanticAnnotations
  ModelPackage:
    name: ModelPackage
    description: 'Версионируемый артефакт модели данных: либо корпоративная conceptual
      модель (enterprise), либо модель конкретного ИТ-решения (solution). Package-level
      DAMS layer is dams_model_level on the SpecImpl envelope (ADR-021); implementation_scope
      here mirrors that body-level semantics.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    slots:
    - api_version
    - model_version
    - implementation_scope
    - conceptual_implementation_ref
    - solution_ref
    - domain_refs
    - imports_refs
    - conceptual_entities
    - domain_contexts
    - logical_entities
    - relationships
    - relation_terms
    - data_carriers
    - access_points
    - data_containers
    - execution_assets
    - mappings
    - conceptual_properties
    - conceptual_domains
    - value_domains
    - data_types
    - native_type_bindings
    - data_structures
    - messages
    slot_usage:
      description:
        name: description
        required: true
  DomainContext:
    name: DomainContext
    description: Ограниченный логический контекст с собственной терминологией и областью
      ответственности.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    slots:
    - domain_ref
    - solution_ref
    - namespace
    - business_process_refs
    slot_usage:
      description:
        name: description
        required: true
  ConceptualEntity:
    name: ConceptualEntity
    description: Корпоративное бизнес-понятие верхнего уровня, независимое от конкретной
      реализации.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasBusinessClassification
    - HasDefinition
    slots:
    - parent_concept_ref
    - key_attribute_refs
    - entity_tier
    - dependency_kind
    - depends_on_refs
    - genesis_kind
    - external_class_refs
  ConceptualProperty:
    name: ConceptualProperty
    description: 'Значимое концептуальное свойство сущности КМД. Создаётся только
      при наличии significance_basis; не обязательно для каждого LogicalAttribute.

      '
    comments:
    - 'ISO/IEC 11179 Property (close). Облегчённый концептуальный слой — только для
      значимых атрибутов (вариант B, ADR-034). IRI ISO 11179 не используются.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    close_mappings:
    - rdf:Property
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasDefinition
    - HasProvenance
    - HasPolicyBindings
    slots:
    - property_owner_entity_ref
    - significance_basis
    - significance_rationale
    - property_kind
    - conceptual_domain_ref
    - is_identifying
    - genesis_kind
    slot_usage:
      genesis_kind:
        name: genesis_kind
        required: true
    class_uri: dams:ConceptualProperty
    unique_keys:
      conceptual_property_key:
        unique_key_name: conceptual_property_key
        unique_key_slots:
        - property_owner_entity_ref
        - name
    rules:
    - preconditions:
        slot_conditions:
          property_kind:
            name: property_kind
            equals_string: identifying
      postconditions:
        slot_conditions:
          is_identifying:
            name: is_identifying
            equals_string: 'true'
      description: identifying property_kind требует is_identifying
  LogicalEntity:
    name: LogicalEntity
    description: Представление бизнес-сущности в доменном контексте и модели конкретного
      решения.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasBusinessClassification
    - HasGovernanceClassification
    - HasPolicyBindings
    - HasDefinition
    slots:
    - context_ref
    - conceptual_entity_refs
    - solution_ref
    - solution_data_role
    - attributes
    - key_attribute_refs
    - invariant_refs
    - identity_rule
    - business_key_kind
    - conceptual_alignment_status
    - alignment_rationale
    - isolation_rationale
  LogicalAttribute:
    name: LogicalAttribute
    description: 'Логический атрибут сущности: идентификация, обязательность, кардинальность
      и ссылки на представление (DataType/ValueDomain) и опционально на ConceptualProperty
      (вариант B, ADR-034).

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    - HasDefinition
    slots:
    - owner_entity_ref
    - concept_ref
    - value_domain_ref
    - data_type_ref
    - critical_data_element
    - required
    - multivalued
    - minimum_cardinality
    - maximum_cardinality
    - default_value
    - derived_expression
    - mapping_coverage_status
    - mapping_rationale
    - currency_attribute_ref
    - timezone_policy
    - temporal_semantics
    slot_usage:
      data_type_ref:
        name: data_type_ref
        description: 'Ссылка на корпоративный DataType. Обязателен data_type_ref и/или
          value_domain_ref (ADR-034 шаг 2 / PR-5).

          '
        required: false
      concept_ref:
        name: concept_ref
        description: 'Опциональная ссылка на ConceptualProperty. Отсутствие не является
          ошибкой и не порождает предупреждение (вариант B).

          '
        required: false
  Relationship:
    name: Relationship
    description: Именованная связь между логическими или концептуальными сущностями.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    slots:
    - source_entity_ref
    - target_entity_ref
    - source_role
    - target_role
    - source_min_cardinality
    - source_max_cardinality
    - target_min_cardinality
    - target_max_cardinality
    - identifying
    - associative
    - relationship_kind
    - cardinality_rationale
    - relation_term_ref
    - term_direction
  RelationTerm:
    name: RelationTerm
    description: 'Governed dictionary term for a conceptual/logical relationship (ADR-026).
      Provides forward and inverse natural-language labels so a single Relationship
      assertion can be read from either side.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasDefinition
    slots:
    - forward_label
    - forward_label_en
    - inverse_label
    - inverse_label_en
    - symmetric
    - default_relationship_kind
    - ontology_property_ref
  ExternalClassRef:
    name: ExternalClassRef
    description: 'Alignment of a ConceptualEntity to an external class or term (ADR-026).
      Canonical store for conceptual↔external links; Mapping(aligns_with) may mirror
      for ExternalTermSelection projections.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    mixins:
    - HasProvenance
    slots:
    - external_class_ref_id
    - target_ref
    - match_kind
    - source_kind
    - external_specification_ref
    - selection_ref
  Mapping:
    name: Mapping
    description: 'Явное соответствие между элементами. Discriminate via mapping_type:
      realizes (solution→enterprise conceptual), entity_physical (DataCarrier↔LogicalEntity),
      field_mapping/mapsTo (SchemaNode↔LogicalAttribute), aligns_with (enterprise↔external
      term). Not used for SpecImpl implements/conforms_to.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasProvenance
    slots:
    - source_refs
    - target_refs
    - mapping_type
    - mapping_cardinality
    - transformation_ref
    - transformation_expression
    - confidence
    - valid_from
    - valid_to
  HasStructure:
    name: HasStructure
    description: 'Mixin структуры данных носителя. structure_ref — ссылка на DataStructure
      (range=DataStructure, ADR-038). Диалект схемы живёт на DataStructure.schema_dialect.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - structure_ref
    - data_format
  HasProtocolBinding:
    name: HasProtocolBinding
    description: Mixin протокола доступа для точки доступа (AccessPoint).
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - protocol
    - protocol_version
    - binding_ref
  Contains:
    name: Contains
    description: 'Mixin контейнерности. child_refs не хранятся: выводятся из parent_ref.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - containment_kind
  HasLocation:
    name: HasLocation
    description: Mixin расположения носителя или точки доступа.
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - location_uri
    - region
  TechnicalAsset:
    name: TechnicalAsset
    id_prefixes:
    - dams
    description: 'Квант данных: адресуемый технический объект управления. Имеет собственный
      идентификатор, систему-владельца, расположение или способ доступа, жизненный
      цикл, владельца, классификацию и роль в lineage. Поля, колонки и узлы схем квантами
      НЕ являются (ADR-C).

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: ModelElement
    abstract: true
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    slots:
    - asset_namespace
    - qualified_name
    - native_name
    - system_ref
    - parent_ref
    - technology
    - asset_kind
    - lineage_role
    - direction
    - solution_ref
    slot_usage:
      description:
        name: description
        required: true
      qualified_name:
        name: qualified_name
        required: true
      system_ref:
        name: system_ref
        required: true
      native_name:
        name: native_name
        required: false
      technology:
        name: technology
        required: false
      direction:
        name: direction
        description: 'Направление относительно решения. Запрещён для DataContainer
          и ExecutionAsset правилом DAMS-валидатора и LinkML rules.

          '
        required: false
    unique_keys:
      technical_asset_key:
        unique_key_name: technical_asset_key
        unique_key_slots:
        - asset_namespace
        - qualified_name
  DataCarrier:
    name: DataCarrier
    description: 'Носитель данных: хранит или передаёт данные (таблица, файл, топик,
      сообщение и т.п.).

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - HasStructure
    - HasLocation
    - Contains
    slots:
    - mapping_coverage_status
    - mapping_rationale
    slot_usage:
      asset_kind:
        name: asset_kind
        range: DataCarrierKindEnum
        required: true
    rules:
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: in_memory
      postconditions:
        slot_conditions:
          location_uri:
            name: location_uri
            value_presence: ABSENT
          region:
            name: region
            value_presence: ABSENT
      description: in_memory носитель не имеет location_uri и region
  AccessPoint:
    name: AccessPoint
    description: 'Точка доступа к данным: интерфейс, операция или канал. Сама данные
      не несёт; указывает на носители через serves_refs.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - HasProtocolBinding
    - HasLocation
    slots:
    - serves_refs
    - interface_ref
    - operation_name
    - http_method
    - path_template
    - message_refs
    slot_usage:
      asset_kind:
        name: asset_kind
        range: AccessPointKindEnum
        required: true
      direction:
        name: direction
        description: Направление протокола AccessPoint (через FlowDirectionEnum).
    rules:
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: operation
      postconditions:
        slot_conditions:
          interface_ref:
            name: interface_ref
            required: true
      description: operation требует interface_ref
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: interface
      postconditions:
        slot_conditions:
          operation_name:
            name: operation_name
            value_presence: ABSENT
          http_method:
            name: http_method
            value_presence: ABSENT
          path_template:
            name: path_template
            value_presence: ABSENT
          message_refs:
            name: message_refs
            value_presence: ABSENT
      description: interface не имеет operation-полей
  DataContainer:
    name: DataContainer
    description: 'Контейнер других активов (database, schema, bucket, broker, directory,
      cluster). Данных не несёт: structure_ref и data_format отсутствуют.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - Contains
    slot_usage:
      asset_kind:
        name: asset_kind
        range: DataContainerKindEnum
        required: true
      direction:
        name: direction
        description: Запрещён для DataContainer (правило валидатора).
        required: false
  ExecutionAsset:
    name: ExecutionAsset
    description: 'Исполняемый актив (pipeline / job) с минимальной lineage-ролью.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    slots:
    - produces_refs
    - consumes_refs
    slot_usage:
      asset_kind:
        name: asset_kind
        range: ExecutionAssetKindEnum
        required: true
      direction:
        name: direction
        description: Запрещён для ExecutionAsset (правило валидатора).
        required: false
  ConceptualDomain:
    name: ConceptualDomain
    description: 'Концептуальный домен значений: набор смыслов (ValueMeaning) или
      ссылка на внешнюю схему понятий. Допустим только в пакетах implementation_scope=enterprise.

      '
    comments:
    - 'ISO/IEC 11179 Conceptual Domain — набор value meanings (смыслов значений).
      IRI ISO 11179 не опубликованы стабильно; соответствие фиксируется в ADR-035.
      SKOS: ConceptScheme (не Collection) — чтобы допускать семантические связи между
      ValueMeaning (skos:Concept).

      '
    from_schema: https://data.moex.com/dams/semantic/v0.1
    close_mappings:
    - skos:ConceptScheme
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasProvenance
    slots:
    - conceptual_domain_kind
    - value_meanings
    - concept_scheme_uri
    - broader_domain_ref
    slot_usage:
      description:
        name: description
        required: true
    class_uri: dams:ConceptualDomain
    rules:
    - preconditions:
        slot_conditions:
          conceptual_domain_kind:
            name: conceptual_domain_kind
            equals_string: described
      postconditions:
        slot_conditions:
          value_meanings:
            name: value_meanings
            value_presence: ABSENT
      description: described-домен не содержит value_meanings
  ValueMeaning:
    name: ValueMeaning
    description: 'Смысл допустимого значения внутри ConceptualDomain (встраиваемый,
      без lifecycle).

      '
    comments:
    - ISO/IEC 11179 Value Meaning; IRI ISO не используются (ADR-035).
    from_schema: https://data.moex.com/dams/semantic/v0.1
    exact_mappings:
    - skos:Concept
    slots:
    - meaning_key
    - meaning_label
    - meaning_definition
    - aliases
    - meaning_term_ref
    - broader_meaning_key
    - meaning_status
    class_uri: dams:ValueMeaning
  DataType:
    name: DataType
    description: 'Корпоративный тип данных: семейство, параметры представления и соответствие
      XSD/LinkML. Допустим только в корпоративном реестре типов.

      '
    comments:
    - ISO/IEC 11179 Datatype; корпоративный реестр логических типов (ADR-036).
    from_schema: https://data.moex.com/dams/datatypes/v0.1
    close_mappings:
    - rdfs:Datatype
    is_a: ModelElement
    slots:
    - type_name
    - type_family
    - precision
    - scale
    - max_length
    - min_length
    - datatype_timezone_policy
    - charset
    - xsd_datatype
    - linkml_type
    - base_type_ref
    slot_usage:
      description:
        name: description
        required: true
    class_uri: dams:DataType
    unique_keys:
      data_type_name_key:
        unique_key_name: data_type_name_key
        unique_key_slots:
        - type_name
    rules:
    - preconditions:
        slot_conditions:
          precision:
            name: precision
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          type_family:
            name: type_family
            equals_string: decimal
      description: precision только для decimal
    - preconditions:
        slot_conditions:
          scale:
            name: scale
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          type_family:
            name: type_family
            equals_string: decimal
      description: scale только для decimal
    - preconditions:
        slot_conditions:
          max_length:
            name: max_length
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          type_family:
            name: type_family
            any_of:
            - equals_string: string
            - equals_string: binary
      description: max_length только для string или binary
    - preconditions:
        slot_conditions:
          min_length:
            name: min_length
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          type_family:
            name: type_family
            any_of:
            - equals_string: string
            - equals_string: binary
      description: min_length только для string или binary
  NativeTypeBinding:
    name: NativeTypeBinding
    description: 'Привязка нативного типа диалекта (SQL, JSON Schema и т.п.) к корпоративному
      DataType с оценкой потери точности.

      '
    from_schema: https://data.moex.com/dams/datatypes/v0.1
    slots:
    - binding_id
    - dialect
    - dialect_native_type
    - data_type_ref
    - lossiness
    - parameter_mapping
    slot_usage:
      data_type_ref:
        name: data_type_ref
        required: true
    class_uri: dams:NativeTypeBinding
    unique_keys:
      native_type_binding_key:
        unique_key_name: native_type_binding_key
        unique_key_slots:
        - dialect
        - dialect_native_type
        - data_type_ref
  ValueDomain:
    name: ValueDomain
    description: 'Представление значений: тип, формат, единица, допустимые значения
      или ссылка на внешний набор. Допустим в пакетах enterprise и solution.

      '
    comments:
    - ISO/IEC 11179 Value Domain — представление допустимых значений (ADR-035).
    from_schema: https://data.moex.com/dams/datatypes/v0.1
    is_a: ModelElement
    slots:
    - value_domain_kind
    - data_type_ref
    - conceptual_domain_ref
    - unit_code
    - format_pattern
    - min_value
    - max_value
    - permissible_values
    - value_set_source
    - dynamic_query
    slot_usage:
      description:
        name: description
        required: true
      data_type_ref:
        name: data_type_ref
        required: true
    class_uri: dams:ValueDomain
    rules:
    - preconditions:
        slot_conditions:
          value_domain_kind:
            name: value_domain_kind
            equals_string: enumerated
      postconditions:
        slot_conditions:
          permissible_values:
            name: permissible_values
            value_presence: PRESENT
      description: enumerated-домен требует permissible_values
    - preconditions:
        slot_conditions:
          value_domain_kind:
            name: value_domain_kind
            equals_string: described
      postconditions:
        slot_conditions:
          permissible_values:
            name: permissible_values
            value_presence: ABSENT
      description: described-домен не содержит permissible_values
    - preconditions:
        slot_conditions:
          value_domain_kind:
            name: value_domain_kind
            equals_string: reference_set
      postconditions:
        slot_conditions:
          permissible_values:
            name: permissible_values
            value_presence: ABSENT
      description: reference_set не содержит permissible_values
  PermissibleValue:
    name: PermissibleValue
    description: Допустимое значение внутри ValueDomain (встраиваемый).
    comments:
    - ISO/IEC 11179 Permissible Value; LinkML enum permissible value (ADR-035).
    from_schema: https://data.moex.com/dams/datatypes/v0.1
    slots:
    - value_code
    - value_label
    - value_definition
    - value_meaning_key
    - meaning_term_ref
    - ordinal
    - value_status
    class_uri: dams:PermissibleValue
  ValueSetQuery:
    name: ValueSetQuery
    description: 'Динамический запрос набора значений по образцу LinkML reachable_from
      (source ontology, узлы, типы связей).

      '
    from_schema: https://data.moex.com/dams/datatypes/v0.1
    slots:
    - value_set_query_id
    - source_ontology
    - source_nodes
    - relationship_types
    - include_self
    class_uri: dams:ValueSetQuery
  EmbeddedElement:
    name: EmbeddedElement
    description: 'Встраиваемый вспомогательный объект без собственного жизненного
      цикла и глобального element_id. Идентичность локальна относительно родителя
      (local_key). Не путать с будущим IdentifiedElement (ADR-038).

      '
    from_schema: https://data.moex.com/dams/structure/v0.1
    abstract: true
    slots:
    - local_key
    - description
    slot_usage:
      description:
        name: description
        required: false
  DataStructure:
    name: DataStructure
    id_prefixes:
    - dams
    description: 'Именованная версия структуры данных: корень дерева SchemaNode с
      форматом и опциональным диалектом (ADR-038). Хранит плоский список узлов (nodes
      + root_local_key).

      '
    from_schema: https://data.moex.com/dams/structure/v0.1
    is_a: ModelElement
    slots:
    - schema_format
    - schema_dialect
    - structure_version
    - root_local_key
    - nodes
    - source_artifact_ref
    - source_pointer
    - content_digest
    - previous_version_ref
    slot_usage:
      description:
        name: description
        required: false
        recommended: true
    unique_keys:
      data_structure_version_key:
        unique_key_name: data_structure_version_key
        unique_key_slots:
        - name
        - structure_version
    rules:
    - preconditions:
        slot_conditions:
          source_pointer:
            name: source_pointer
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          source_artifact_ref:
            name: source_artifact_ref
            value_presence: PRESENT
      description: source_pointer требует source_artifact_ref
    - preconditions:
        slot_conditions:
          schema_dialect:
            name: schema_dialect
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          schema_format:
            name: schema_format
            any_of:
            - equals_string: json_schema
            - equals_string: openapi_schema
      description: schema_dialect только для семейства JSON Schema
  SchemaNode:
    name: SchemaNode
    description: 'Узел дерева структуры. Идентичность (DataStructure.element_id, local_key).
      Рёбра children/item_node — строки local_key (плоская форма, ADR-038). Форма
      и физика в одном узле (как ODCS).

      '
    from_schema: https://data.moex.com/dams/structure/v0.1
    is_a: EmbeddedElement
    slots:
    - native_name
    - node_kind
    - children
    - item_node
    - data_type_ref
    - native_type
    - nullable
    - required
    - min_occurs
    - max_occurs
    - ordinal_position
    - reference_target
    - realizes_attribute_ref
    - constraint_expressions
    - default_value
    - mapping_coverage_status
    - mapping_rationale
    - column_position
    - is_primary_key
    - is_unique
    - foreign_key_target
    slot_usage:
      description:
        name: description
        required: false
      native_name:
        name: native_name
        required: false
      native_type:
        name: native_type
        required: false
      required:
        name: required
        required: false
      local_key:
        name: local_key
        required: true
        pattern: ^[a-z0-9_.-]+$
    rules:
    - preconditions:
        slot_conditions:
          node_kind:
            name: node_kind
            any_of:
            - equals_string: array
            - equals_string: map
      postconditions:
        slot_conditions:
          item_node:
            name: item_node
            value_presence: PRESENT
          children:
            name: children
            value_presence: ABSENT
      description: array|map требуют item_node и запрещают children
    - preconditions:
        slot_conditions:
          node_kind:
            name: node_kind
            any_of:
            - equals_string: scalar
            - equals_string: enum
      postconditions:
        slot_conditions:
          children:
            name: children
            value_presence: ABSENT
          item_node:
            name: item_node
            value_presence: ABSENT
      description: scalar|enum запрещают children и item_node
    - preconditions:
        slot_conditions:
          node_kind:
            name: node_kind
            equals_string: reference
      postconditions:
        slot_conditions:
          reference_target:
            name: reference_target
            value_presence: PRESENT
      description: reference требует reference_target
  Message:
    name: Message
    id_prefixes:
    - dams
    description: 'Элемент интеграционной модели: сообщение с payload/headers структурами.
      Не TechnicalAsset (нет asset_namespace / qualified_name; не carrier_refs). AccessPoint
      (operation|channel) ссылается через message_refs (ADR-040). Класс в moex-structure,
      чтобы ModelPackage и AccessPoint ссылались без цикла core↔integration (ADR-040).

      '
    from_schema: https://data.moex.com/dams/structure/v0.1
    is_a: ModelElement
    slots:
    - payload_structure_ref
    - headers_structure_ref
    - content_type
    - envelope_kind
    - envelope_ref
    - correlation_hint
  DataFlow:
    name: DataFlow
    description: Ссылочная проекция зарегистрированной интеграции; топология и канал
      являются данными Clinkr, а семантика — модели данных.
    from_schema: https://data.moex.com/dams/integration/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasLifecycle
    slots:
    - integration_ref
    - contract_ref
    - source_solution_ref
    - target_solution_ref
    - source_system_ref
    - target_system_ref
    - source_platform_ref
    - target_platform_ref
    - integration_level
    - integration_class
    - integration_channel
    - integration_spec_ref
    - entity_bindings
    slot_usage:
      description:
        name: description
        required: true
  DataFlowEntityBinding:
    name: DataFlowEntityBinding
    description: Связь потока с логическими сущностями, атрибутами и носителями данных
      модели решения.
    from_schema: https://data.moex.com/dams/integration/v0.1
    is_a: ModelElement
    slots:
    - flow_ref
    - source_model_ref
    - logical_entity_ref
    - logical_attribute_refs
    - carrier_refs
    - schema_node_refs
    - transformation_mapping_refs
    - direction
    slot_usage:
      description:
        name: description
        required: true
  DataModelBinding:
    name: DataModelBinding
    description: Дочерняя модельная спецификация дата-контракта, фиксирующая неизменяемую
      ревизию модели и передаваемый срез.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    mixins:
    - HasLifecycle
    - HasOwnership
    slots:
    - specification_version
    - implementation_version
    - contract_ref
    - integration_ref
    - model_package_ref
    - model_version
    - model_revision
    - selections
    - compatibility_mode
    - compatibility_baseline_ref
    - integrity_digest
    - generated_at
    slot_usage:
      description:
        name: description
        required: true
  ModelSelection:
    name: ModelSelection
    description: Переиспользуемый набор выбранных сущностей, атрибутов и физических
      представлений.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - selected_entities
    slot_usage:
      description:
        name: description
        required: true
  SelectedEntity:
    name: SelectedEntity
    description: Выбранная для интеграции логическая сущность.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - logical_entity_ref
    - selected_attributes
    - carrier_refs
    slot_usage:
      description:
        name: description
        required: true
  SelectedAttribute:
    name: SelectedAttribute
    description: Выбранный атрибут и соответствующее физическое поле payload, таблицы
      или сообщения.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - logical_attribute_ref
    - schema_node_refs
    - transformation_mapping_ref
    slot_usage:
      description:
        name: description
        required: true
  Metric:
    name: Metric
    description: Управляемое определение бизнес- или технической метрики; является
      опциональным аналитическим профилем.
    from_schema: https://data.moex.com/dams/analytics/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasPolicyBindings
    slots:
    - metric_expression
    - aggregation_function
    - grain_entity_refs
    - dimension_attribute_refs
    - measure_attribute_refs
    - unit
    - filter_expression
    slot_usage:
      description:
        name: description
        required: true
  Dimension:
    name: Dimension
    description: Переиспользуемое аналитическое измерение, связанное с логическими
      атрибутами.
    from_schema: https://data.moex.com/dams/analytics/v0.1
    is_a: ModelElement
    slots:
    - dimension_attribute_refs
    - grain_entity_refs
    slot_usage:
      description:
        name: description
        required: true
  RequirementApplicability:
    name: RequirementApplicability
    description: 'Область применимости требования (без graph queries): класс цели,
      профиль и уровень модели.

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - applicability_id
    - applies_target_class
    - applies_target_kinds
    - applies_implementation_scope
    - applies_dams_model_level
    - applies_implementation_profile
  FormalCheck:
    name: FormalCheck
    description: Одна машиночитаемая проверка требования. Kind выровнен с LinkML constraints
      и DAMS reference/structural diagnostics. formal_checks — исполняемое подмножество
      нормы; исполняется assess (ADR-013).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - check_id
    - kind
    - target_class
    - target_slot
    - target_slots
    - target_path
    - severity
    - diagnostic_code
    - expression
    - remediation
  SpecificationRequirement:
    name: SpecificationRequirement
    description: Нормативное требование к модели, соответствующей reference specification
      (каталог для уровня ИТ-решения и др.).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    is_a: ModelElement
    slots:
    - code
    - requirement_level
    - requirement_section
    - statement
    - applies_to
    - formal_checks
    - implementation_status
    - superseded_by
    slot_usage:
      description:
        name: description
        required: true
      lifecycle_status:
        name: lifecycle_status
        ifabsent: string(draft)
        range: RequirementLifecycleStatus
        required: true
  RequirementCatalog:
    name: RequirementCatalog
    description: Контейнер инстансов SpecificationRequirement вне ModelPackage.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - catalog_id
    - name
    - requirements
