      reference:
        text: reference
        description: "\u0421\u043F\u0440\u0430\u0432\u043E\u0447\u043D\u0430\u044F\
          \ \u0441\u0443\u0449\u043D\u043E\u0441\u0442\u044C \u0438\u043B\u0438 \u043F\
          \u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u0438\u0435\
