    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: CompatibilityModeEnum
    required: true
  compatibility_baseline_ref:
    name: compatibility_baseline_ref
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: uri
  integrity_digest:
    name: integrity_digest
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: Sha256Digest
    required: true
  generated_at:
    name: generated_at
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: datetime
    required: true
  selected_entities:
    name: selected_entities
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: SelectedEntity
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  selected_attributes:
    name: selected_attributes
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: SelectedAttribute
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  logical_attribute_ref:
    name: logical_attribute_ref
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: LogicalAttribute
    required: true
    inlined: false
  transformation_mapping_ref:
    name: transformation_mapping_ref
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    range: Mapping
    inlined: false
  metric_expression:
    name: metric_expression
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: string
    required: true
  aggregation_function:
    name: aggregation_function
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: string
    required: true
  grain_entity_refs:
    name: grain_entity_refs
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: LogicalEntity
    multivalued: true
    inlined: false
    minimum_cardinality: 1
  dimension_attribute_refs:
    name: dimension_attribute_refs
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: LogicalAttribute
    multivalued: true
    inlined: false
  measure_attribute_refs:
    name: measure_attribute_refs
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: LogicalAttribute
    multivalued: true
    inlined: false
    minimum_cardinality: 1
  unit:
    name: unit
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: string
  filter_expression:
    name: filter_expression
    from_schema: https://data.moex.com/dams/analytics/v0.1
    range: string
  applicability_id:
    name: applicability_id
    description: Stable id for applies_to blocks (e.g. appl:LDM-001).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    identifier: true
    range: string
    required: true
  check_id:
    name: check_id
    from_schema: https://data.moex.com/dams/requirements/v0.1
    identifier: true
    range: string
    required: true
  kind:
    name: kind
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: FormalCheckKindEnum
    required: true
  target_class:
    name: target_class
    description: Имя класса LinkML (например LogicalEntity).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  target_slot:
    name: target_slot
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  target_slots:
    name: target_slots
    description: Список слотов для kind=at_least_one_slots.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
    multivalued: true
  target_path:
    name: target_path
    description: JSON Pointer или path hint в теле ModelPackage.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  severity:
    name: severity
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: CheckSeverityEnum
    required: true
  diagnostic_code:
    name: diagnostic_code
    description: Мост к DAMS-STRUCT-* / DAMS-REF-* / DAMS-REQ-*.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  expression:
    name: expression
    description: 'Имя фиксированного шаблона для conditional_branch / custom (например
      ldm006_alignment, planned_on_active_warning).

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  remediation:
    name: remediation
    description: Actionable remediation text for CI / Cursor / authors.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  code:
    name: code
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
    required: true
    pattern: ^(LDM|PDM|REF|ATR|FLW|CLS|GEN)-[0-9]{3}$
  requirement_level:
    name: requirement_level
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: RequirementLevelEnum
    required: true
  requirement_section:
    name: requirement_section
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: RequirementSectionEnum
    required: true
  statement:
    name: statement
    description: 'Полная нормативная формулировка на русском для человека: без имён
      LinkML-классов, слотов, kinds проверок и сленга метамодели.

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
    required: true
  applies_to:
    name: applies_to
    description: Область применимости требования для formal_checks runner.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: RequirementApplicability
    inlined: true
  applies_target_class:
    name: applies_target_class
    description: Имя класса LinkML, к экземплярам которого применяется требование.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
  applies_target_kinds:
    name: applies_target_kinds
    description: Опциональный allowlist asset_kind / facet (например relational_table,
      stream_topic).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: string
    multivalued: true
  applies_implementation_scope:
    name: applies_implementation_scope
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: ImplementationScopeEnum
  applies_dams_model_level:
    name: applies_dams_model_level
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: DAMSModelLevelEnum
  applies_implementation_profile:
    name: applies_implementation_profile
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: ImplementationProfileEnum
  formal_checks:
    name: formal_checks
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: FormalCheck
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  implementation_status:
    name: implementation_status
    description: 'Статус реализации требования. Осмысленно при lifecycle_status=approved;
      обязательность при approved не проверяется в этой версии схемы.

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: RequirementImplementationStatus
  superseded_by:
    name: superseded_by
    description: 'Ссылка на требование, которым данное заменено (при lifecycle_status=superseded).
      Отличается от deprecated_by_ref (HasLifecycle): deprecated_by_ref означает «устарело
      из-за …» без обязательной замены нормой; superseded_by — «заменено указанным
      требованием». Обязательность при superseded не проверяется здесь.

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: SpecificationRequirement
    inlined: false
  catalog_id:
    name: catalog_id
    from_schema: https://data.moex.com/dams/requirements/v0.1
    identifier: true
    range: uriorcurie
    required: true
  requirements:
    name: requirements
    from_schema: https://data.moex.com/dams/requirements/v0.1
    range: SpecificationRequirement
    multivalued: true
    inlined: true
    inlined_as_list: true
classes:
  MOEXModelRepository:
    name: MOEXModelRepository
    description: Корневой контейнер для проверки набора моделей, ссылочных проекций
      справочников, потоков и контрактных bindings.
    from_schema: https://data.moex.com/dams/v0.1
    slots:
    - repository_id
    - registry_entries
    - model_packages
    - data_flows
    - data_model_bindings
    - metrics
    - dimensions
    - classification_assignments
    - policy_bindings
    tree_root: true
  RegistryEntry:
    name: RegistryEntry
    description: Локальная ссылочная проекция записи внешней мастер-системы; не является
      мастер-копией справочника.
    from_schema: https://data.moex.com/dams/registries/v0.1
    abstract: true
    slots:
    - registry_id
    - registry_name
    - registry_description
    - master_system
    - source_uri
    - registry_status
  ITSystem:
    name: ITSystem
    description: ИТ-система; мастер данных — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  ITSolution:
    name: ITSolution
    description: ИТ-решение, объединяющее одну или несколько ИТ-систем; мастер данных
      — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
    slots:
    - member_system_refs
    - platform_ref
  ITPlatform:
    name: ITPlatform
    description: ИТ-платформа; мастер данных — EAM.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  BusinessDomain:
    name: BusinessDomain
    description: Бизнес-домен или предметная область; мастер определяется архитектурным
      governance
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
    slots:
    - parent_domain_ref
  GlossaryTerm:
    name: GlossaryTerm
    description: Термин корпоративного бизнес-глоссария.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  OrganizationUnit:
    name: OrganizationUnit
    description: Организационное подразделение.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  Role:
    name: Role
    description: Управляемая роль владельца, стюарда, потребителя или согласующего.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  DataClassificationTerm:
    name: DataClassificationTerm
    description: Специальная категория чувствительности или регулирования, например
      ПДн или инсайдерская информация.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  Policy:
    name: Policy
    description: Политика доступа, хранения, качества или архитектурный инвариант.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  BusinessProcess:
    name: BusinessProcess
    description: Ссылка на бизнес-процесс или его шаг в BPMN-репозитории.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  DataContractReference:
    name: DataContractReference
    description: Ссылка на дата-контракт в корпоративном дата-каталоге.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  IntegrationReference:
    name: IntegrationReference
    description: Ссылка на интеграцию в Clinkr.
    from_schema: https://data.moex.com/dams/registries/v0.1
    is_a: RegistryEntry
  ClassificationAssignment:
    name: ClassificationAssignment
    description: Версионируемое назначение категории классификации элементу модели
      с основанием и периодом действия.
    from_schema: https://data.moex.com/dams/governance/v0.1
    slots:
    - assignment_id
    - classified_element_ref
    - classification_term_ref
    - governance_classification
    - classification_source
    - classification_rationale
    - valid_from
    - valid_to
    - approval_status
  PolicyBinding:
    name: PolicyBinding
    description: Применение управляемой политики к элементу модели.
    from_schema: https://data.moex.com/dams/governance/v0.1
    slots:
    - policy_binding_id
    - policy_target_ref
    - policy_ref
    - valid_from
    - valid_to
    - approval_status
  HasLifecycle:
    name: HasLifecycle
    description: 'Mixin жизненного цикла: статус, период действия и ссылка на заменяющий
      элемент.'
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - lifecycle_status
    - valid_from
    - valid_to
    - deprecated_by_ref
  HasOwnership:
    name: HasOwnership
    description: 'Mixin владения: data owner, data steward и организационное подразделение.
      Отсутствие слота означает наследование эффективного значения по containment
      cascade (ADR-023); заданное значение — локальный override.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - data_owner_ref
    - data_steward_ref
    - owning_unit_ref
    - ownership_inheritance_rule
  HasBusinessClassification:
    name: HasBusinessClassification
    description: Классификация роли и бизнес-значимости логической сущности.
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - entity_type
    - data_class
    - business_importance
  HasGovernanceClassification:
    name: HasGovernanceClassification
    description: 'Базовая и специальная классификация чувствительности данных. governance_classification
      участвует в containment cascade (ADR-023): пустой слот наследуется от родителя,
      заданный — override.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - governance_classification
    - security_classification
    - sensitivity_term_refs
    - classification_source
    - classification_rationale
  HasPolicyBindings:
    name: HasPolicyBindings
    description: 'Mixin привязки управляемых политик к элементу модели. policy_refs
      участвует в containment cascade (ADR-023): отсутствие ключа — наследование;
      присутствующий список (в т.ч. пустой) — полная замена.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - policy_refs
  HasProvenance:
    name: HasProvenance
    description: 'Mixin происхождения и согласования: исходный артефакт, evidence,
      статус и согласующий.'
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - source_artifact_ref
    - evidence_refs
    - approval_status
    - approved_by_ref
    - approved_at
  HasDefinition:
    name: HasDefinition
    description: 'Mixin эталонного определения (ADR-025). Слот description остаётся
      skos:definition (own text). Отсутствие description при наличии definition_source_ref
      означает наследование; заданный description — own (опционально adapted from
      source). scoped_definitions — контекстные определения (v1: уровень ITSystem),
      не заменяющие эталон вне scope.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixin: true
    slots:
    - definition_source_ref
    - definition_rationale
    - scoped_definitions
  ScopedDefinition:
    name: ScopedDefinition
    description: 'Контекстное определение элемента модели (ADR-025 / ISO 11179 Context).
      Не является отдельным термином глоссария и не заменяет эталонное определение
      вне указанного scope.

      '
    from_schema: https://data.moex.com/dams/governance/v0.1
    mixins:
    - HasProvenance
    slots:
    - scoped_definition_id
    - scope_kind
    - scope_ref
    - text
    - relation_to_reference
    - rationale
  ModelElement:
    name: ModelElement
    description: 'Абстрактный корень иерархии элементов модели: общая идентичность
      (element_id), имя, описание и жизненный цикл.'
    from_schema: https://data.moex.com/dams/core/v0.1
    abstract: true
    mixins:
    - HasLifecycle
    slots:
    - element_id
    - name
    - title
    - description
    - aliases
    - glossary_term_refs
    - tags
  ModelPackage:
    name: ModelPackage
    description: 'Версионируемый артефакт модели данных: либо корпоративная conceptual
      модель (enterprise), либо модель конкретного ИТ-решения (solution). Package-level
      DAMS layer is dams_model_level on the SpecImpl envelope (ADR-021); implementation_scope
      here mirrors that body-level semantics.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    slots:
    - api_version
    - model_version
    - implementation_scope
    - conceptual_implementation_ref
    - solution_ref
    - domain_refs
    - imports_refs
    - conceptual_entities
    - domain_contexts
    - logical_entities
    - relationships
    - relation_terms
    - mappings
  DomainContext:
    name: DomainContext
    description: Ограниченный логический контекст с собственной терминологией и областью
      ответственности.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    slots:
    - domain_ref
    - solution_ref
    - namespace
    - business_process_refs
  ConceptualEntity:
    name: ConceptualEntity
    description: Корпоративное бизнес-понятие верхнего уровня, независимое от конкретной
      реализации.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasBusinessClassification
    - HasDefinition
    slots:
    - parent_concept_ref
    - key_attribute_refs
    - entity_tier
    - dependency_kind
    - depends_on_refs
    - genesis_kind
    - external_class_refs
    slot_usage:
      description:
        name: description
        description: 'Reference definition (skos:definition). Absent means inherit
          via definition_source_ref (ontology class or GlossaryTerm) per ADR-025.

          '
        required: false
  LogicalEntity:
    name: LogicalEntity
    description: Представление бизнес-сущности в доменном контексте и модели конкретного
      решения.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasBusinessClassification
    - HasGovernanceClassification
    - HasPolicyBindings
    - HasDefinition
    slots:
    - context_ref
    - conceptual_entity_refs
    - solution_ref
    - solution_data_role
    - attributes
    - key_attribute_refs
    - invariant_refs
    - identity_rule
    - business_key_kind
    - conceptual_alignment_status
    - alignment_rationale
    - isolation_rationale
    slot_usage:
      description:
        name: description
        description: 'Reference definition (skos:definition). Absent means inherit
          from conceptual_entity_refs or definition_source_ref per ADR-025.

          '
        required: false
  LogicalAttribute:
    name: LogicalAttribute
    description: Логический атрибут сущности с бизнес-смыслом, типом, обязательностью
      и классификацией.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    - HasDefinition
    slots:
    - owner_entity_ref
    - logical_type
    - required
    - multivalued
    - minimum_cardinality
    - maximum_cardinality
    - value_set_ref
    - format_pattern
    - default_value
    - derived_expression
    - mapping_coverage_status
    - mapping_rationale
    - unit_code
    - currency_attribute_ref
    - timezone_policy
    - temporal_semantics
    slot_usage:
      description:
        name: description
        description: 'Reference definition (skos:definition). v1 attributes are own-only;
          inheritance from conceptual attributes is out of scope (ADR-025).

          '
        required: false
  Relationship:
    name: Relationship
    description: Именованная связь между логическими или концептуальными сущностями.
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    slots:
    - source_entity_ref
    - target_entity_ref
    - source_role
    - target_role
    - source_min_cardinality
    - source_max_cardinality
    - target_min_cardinality
    - target_max_cardinality
    - identifying
    - associative
    - relationship_kind
    - cardinality_rationale
    - relation_term_ref
    - term_direction
  RelationTerm:
    name: RelationTerm
    description: 'Governed dictionary term for a conceptual/logical relationship (ADR-026).
      Provides forward and inverse natural-language labels so a single Relationship
      assertion can be read from either side.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasDefinition
    slots:
    - forward_label
    - forward_label_en
    - inverse_label
    - inverse_label_en
    - symmetric
    - default_relationship_kind
    - ontology_property_ref
    slot_usage:
      description:
        name: description
        description: 'Reference definition of the relation term (skos:definition).
          Absent means inherit via definition_source_ref per ADR-025.

          '
        required: false
  ExternalClassRef:
    name: ExternalClassRef
    description: 'Alignment of a ConceptualEntity to an external class or term (ADR-026).
      Canonical store for conceptual↔external links; Mapping(aligns_with) may mirror
      for ExternalTermSelection projections.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    mixins:
    - HasProvenance
    slots:
    - external_class_ref_id
    - target_ref
    - match_kind
    - source_kind
    - external_specification_ref
    - selection_ref
  PhysicalField:
    name: PhysicalField
    description: 'Поле носителя данных (DataCarrier); семантика задаётся Mapping к
      LogicalAttribute. Ссылка на носителя — carrier_ref (см. moex-technical).

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    slots:
    - native_name
    - native_type
    - required
    - ordinal_position
    - schema_path
    - mapping_coverage_status
    - mapping_rationale
  Mapping:
    name: Mapping
    description: 'Явное соответствие между элементами. Discriminate via mapping_type:
      realizes (solution→enterprise conceptual), entity_physical (DataCarrier↔LogicalEntity),
      field_mapping/mapsTo (PhysicalField↔LogicalAttribute), aligns_with (enterprise↔external
      term). Not used for SpecImpl implements/conforms_to.

      '
    from_schema: https://data.moex.com/dams/core/v0.1
    is_a: ModelElement
    mixins:
    - HasProvenance
    slots:
    - source_refs
    - target_refs
    - mapping_type
    - mapping_cardinality
    - transformation_ref
    - transformation_expression
    - confidence
    - valid_from
    - valid_to
  HasStructure:
    name: HasStructure
    description: 'Mixin структуры данных носителя. structure_ref — временная ссылка
      (uriorcurie); в будущем заменяется классом DataStructure (ADR-C).

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - structure_ref
    - schema_dialect
    - data_format
  HasProtocolBinding:
    name: HasProtocolBinding
    description: Mixin протокола доступа для точки доступа (AccessPoint).
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - protocol
    - protocol_version
    - binding_ref
  Contains:
    name: Contains
    description: 'Mixin контейнерности. child_refs не хранятся: выводятся из parent_ref.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - containment_kind
  HasLocation:
    name: HasLocation
    description: Mixin расположения носителя или точки доступа.
    from_schema: https://data.moex.com/dams/technical/v0.1
    mixin: true
    slots:
    - location_uri
    - region
  TechnicalAsset:
    name: TechnicalAsset
    id_prefixes:
    - dams
    description: 'Квант данных: адресуемый технический объект управления. Имеет собственный
      идентификатор, систему-владельца, расположение или способ доступа, жизненный
      цикл, владельца, классификацию и роль в lineage. Поля, колонки и узлы схем квантами
      НЕ являются (ADR-C).

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: ModelElement
    abstract: true
    mixins:
    - HasOwnership
    - HasGovernanceClassification
    - HasPolicyBindings
    slots:
    - asset_namespace
    - qualified_name
    - native_name
    - system_ref
    - parent_ref
    - technology
    - asset_kind
    - lineage_role
    - direction
    - solution_ref
    slot_usage:
      description:
        name: description
        required: true
      qualified_name:
        name: qualified_name
        required: true
      system_ref:
        name: system_ref
        required: true
      native_name:
        name: native_name
        required: false
      technology:
        name: technology
        required: false
      direction:
        name: direction
        description: 'Направление относительно решения. Запрещён для DataContainer
          и ExecutionAsset правилом DAMS-валидатора и LinkML rules.

          '
        required: false
    unique_keys:
      technical_asset_key:
        unique_key_name: technical_asset_key
        unique_key_slots:
        - asset_namespace
        - qualified_name
  DataCarrier:
    name: DataCarrier
    description: 'Носитель данных: хранит или передаёт данные (таблица, файл, топик,
      сообщение и т.п.).

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - HasStructure
    - HasLocation
    - Contains
    slots:
    - physical_fields
    - mapping_coverage_status
    - mapping_rationale
    slot_usage:
      asset_kind:
        name: asset_kind
        range: DataCarrierKindEnum
        required: true
    rules:
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: in_memory
      postconditions:
        slot_conditions:
          location_uri:
            name: location_uri
            value_presence: ABSENT
          region:
            name: region
            value_presence: ABSENT
      description: in_memory носитель не имеет location_uri и region
  AccessPoint:
    name: AccessPoint
    description: 'Точка доступа к данным: интерфейс, операция или канал. Сама данные
      не несёт; указывает на носители через serves_refs.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - HasProtocolBinding
    - HasLocation
    slots:
    - serves_refs
    - interface_ref
    - operation_name
    - http_method
    - path_template
    slot_usage:
      asset_kind:
        name: asset_kind
        range: AccessPointKindEnum
        required: true
      direction:
        name: direction
        description: Направление протокола AccessPoint (через FlowDirectionEnum).
    rules:
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: operation
      postconditions:
        slot_conditions:
          interface_ref:
            name: interface_ref
            required: true
      description: operation требует interface_ref
    - preconditions:
        slot_conditions:
          asset_kind:
            name: asset_kind
            equals_string: interface
      postconditions:
        slot_conditions:
          operation_name:
            name: operation_name
            value_presence: ABSENT
          http_method:
            name: http_method
            value_presence: ABSENT
          path_template:
            name: path_template
            value_presence: ABSENT
      description: interface не имеет operation-полей
  DataContainer:
    name: DataContainer
    description: 'Контейнер других активов (database, schema, bucket, broker, directory,
      cluster). Данных не несёт: structure_ref и data_format отсутствуют.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    mixins:
    - Contains
    slot_usage:
      asset_kind:
        name: asset_kind
        range: DataContainerKindEnum
        required: true
      direction:
        name: direction
        description: Запрещён для DataContainer (правило валидатора).
        required: false
  ExecutionAsset:
    name: ExecutionAsset
    description: 'Исполняемый актив (pipeline / job) с минимальной lineage-ролью.

      '
    from_schema: https://data.moex.com/dams/technical/v0.1
    is_a: TechnicalAsset
    slots:
    - produces_refs
    - consumes_refs
    slot_usage:
      asset_kind:
        name: asset_kind
        range: ExecutionAssetKindEnum
        required: true
      direction:
        name: direction
        description: Запрещён для ExecutionAsset (правило валидатора).
        required: false
  DataFlow:
    name: DataFlow
    description: Ссылочная проекция зарегистрированной интеграции; топология и канал
      являются данными Clinkr, а семантика — модели данных.
    from_schema: https://data.moex.com/dams/integration/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasLifecycle
    slots:
    - integration_ref
    - contract_ref
    - source_solution_ref
    - target_solution_ref
    - source_system_ref
    - target_system_ref
    - source_platform_ref
    - target_platform_ref
    - integration_level
    - integration_class
    - integration_channel
    - integration_spec_ref
    - entity_bindings
  DataFlowEntityBinding:
    name: DataFlowEntityBinding
    description: Связь потока с логическими сущностями, атрибутами и носителями данных
      модели решения.
    from_schema: https://data.moex.com/dams/integration/v0.1
    is_a: ModelElement
    slots:
    - flow_ref
    - source_model_ref
    - logical_entity_ref
    - logical_attribute_refs
    - carrier_refs
    - physical_field_refs
    - transformation_mapping_refs
    - direction
  DataModelBinding:
    name: DataModelBinding
    description: Дочерняя модельная спецификация дата-контракта, фиксирующая неизменяемую
      ревизию модели и передаваемый срез.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    mixins:
    - HasLifecycle
    - HasOwnership
    slots:
    - specification_version
    - implementation_version
    - contract_ref
    - integration_ref
    - model_package_ref
    - model_version
    - model_revision
    - selections
    - compatibility_mode
    - compatibility_baseline_ref
    - integrity_digest
    - generated_at
  ModelSelection:
    name: ModelSelection
    description: Переиспользуемый набор выбранных сущностей, атрибутов и физических
      представлений.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - selected_entities
  SelectedEntity:
    name: SelectedEntity
    description: Выбранная для интеграции логическая сущность.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - logical_entity_ref
    - selected_attributes
    - carrier_refs
  SelectedAttribute:
    name: SelectedAttribute
    description: Выбранный атрибут и соответствующее физическое поле payload, таблицы
      или сообщения.
    from_schema: https://data.moex.com/dams/contract-binding/v0.1
    is_a: ModelElement
    slots:
    - logical_attribute_ref
    - physical_field_refs
    - transformation_mapping_ref
  Metric:
    name: Metric
    description: Управляемое определение бизнес- или технической метрики; является
      опциональным аналитическим профилем.
    from_schema: https://data.moex.com/dams/analytics/v0.1
    is_a: ModelElement
    mixins:
    - HasOwnership
    - HasPolicyBindings
    slots:
    - metric_expression
    - aggregation_function
    - grain_entity_refs
    - dimension_attribute_refs
    - measure_attribute_refs
    - unit
    - filter_expression
  Dimension:
    name: Dimension
    description: Переиспользуемое аналитическое измерение, связанное с логическими
      атрибутами.
    from_schema: https://data.moex.com/dams/analytics/v0.1
    is_a: ModelElement
    slots:
    - dimension_attribute_refs
    - grain_entity_refs
  RequirementApplicability:
    name: RequirementApplicability
    description: 'Область применимости требования (без graph queries): класс цели,
      профиль и уровень модели.

      '
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - applicability_id
    - applies_target_class
    - applies_target_kinds
    - applies_implementation_scope
    - applies_dams_model_level
    - applies_implementation_profile
  FormalCheck:
    name: FormalCheck
    description: Одна машиночитаемая проверка требования. Kind выровнен с LinkML constraints
      и DAMS reference/structural diagnostics. formal_checks — исполняемое подмножество
      нормы; исполняется assess (ADR-013).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - check_id
    - kind
    - target_class
    - target_slot
    - target_slots
    - target_path
    - severity
    - diagnostic_code
    - expression
    - remediation
  SpecificationRequirement:
    name: SpecificationRequirement
    description: Нормативное требование к модели, соответствующей reference specification
      (каталог для уровня ИТ-решения и др.).
    from_schema: https://data.moex.com/dams/requirements/v0.1
    is_a: ModelElement
    slots:
    - code
    - requirement_level
    - requirement_section
    - statement
    - applies_to
    - formal_checks
    - implementation_status
    - superseded_by
    slot_usage:
      lifecycle_status:
        name: lifecycle_status
        ifabsent: string(draft)
        range: RequirementLifecycleStatus
        required: true
  RequirementCatalog:
    name: RequirementCatalog
    description: Контейнер инстансов SpecificationRequirement вне ModelPackage.
    from_schema: https://data.moex.com/dams/requirements/v0.1
    slots:
    - catalog_id
    - name
    - requirements
