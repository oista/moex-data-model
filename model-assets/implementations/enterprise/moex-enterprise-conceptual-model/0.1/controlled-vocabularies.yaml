# MOEX-local controlled vocabularies for Party & Trading Participation.
# These are NOT FIBO terms. Provenance: moex-local managed vocabulary.
vocabularies:
  - id: moex:cv/TradingParticipationStatus
    name: TradingParticipationStatus
    title: Статус участия в торгах
    title_en: Trading participation status
    definition: Lifecycle status of a TradingParticipation instance.
    provenance: moex-local
    lifecycle_status: active
    values:
      - id: moex:cv/TradingParticipationStatus/pending
        code: pending
        label_ru: Ожидает
        label_en: Pending
        definition: Участие запрошено или ожидает активации.
      - id: moex:cv/TradingParticipationStatus/active
        code: active
        label_ru: Активно
        label_en: Active
        definition: Участие действует.
      - id: moex:cv/TradingParticipationStatus/suspended
        code: suspended
        label_ru: Приостановлено
        label_en: Suspended
        definition: Участие временно приостановлено.
      - id: moex:cv/TradingParticipationStatus/terminated
        code: terminated
        label_ru: Прекращено
        label_en: Terminated
        definition: Участие прекращено.
      - id: moex:cv/TradingParticipationStatus/expired
        code: expired
        label_ru: Истекло
        label_en: Expired
        definition: Срок действия участия истёк.

