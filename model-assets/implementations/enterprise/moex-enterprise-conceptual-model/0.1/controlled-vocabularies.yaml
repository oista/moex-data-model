        code: registration
        label_ru: Регистрация
        label_en: Registration
        definition: Первичная регистрация.
      - id: moex:cv/RegistrationActionType/change
        code: change
        label_ru: Изменение
        label_en: Change
        definition: Изменение сведений.
      - id: moex:cv/RegistrationActionType/renewal
        code: renewal
        label_ru: Продление
        label_en: Renewal
        definition: Продление допуска/статуса.
      - id: moex:cv/RegistrationActionType/suspension
        code: suspension
        label_ru: Приостановление
