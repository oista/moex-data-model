      - id: moex:cv/RegistrationActionType/termination
        code: termination
        label_ru: Прекращение
        label_en: Termination
        definition: Прекращение.
      - id: moex:cv/RegistrationActionType/withdrawal
        code: withdrawal
        label_ru: Отзыв заявления
        label_en: Withdrawal
        definition: Отзыв заявления.

