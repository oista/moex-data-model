        code: requested
        label_ru: Запрошен
        label_en: Requested
        definition: Допуск запрошен.
      - id: moex:cv/AdmissionStatus/under-review
        code: under-review
        label_ru: На рассмотрении
        label_en: Under review
        definition: Допуск на рассмотрении.
      - id: moex:cv/AdmissionStatus/granted
        code: granted
        label_ru: Предоставлен
        label_en: Granted
        definition: Допуск предоставлен.
      - id: moex:cv/AdmissionStatus/suspended
        code: suspended
        label_ru: Приостановлен
        label_en: Suspended
        definition: Допуск приостановлен.
      - id: moex:cv/AdmissionStatus/revoked
        code: revoked
        label_ru: Отозван
        label_en: Revoked
        definition: Допуск отозван.
      - id: moex:cv/AdmissionStatus/expired
        code: expired
        label_ru: Истёк
        label_en: Expired
        definition: Срок допуска истёк.
      - id: moex:cv/AdmissionStatus/rejected
        code: rejected
        label_ru: Отклонён
        label_en: Rejected
        definition: Допуск отклонён.

