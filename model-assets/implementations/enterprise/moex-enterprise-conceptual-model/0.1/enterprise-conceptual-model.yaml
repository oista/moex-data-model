    target_entity_ref: dams:concept/OrganizationIdentifier
    source_role: identified
    target_role: identifier
    source_min_cardinality: 0
    target_min_cardinality: 1
    target_max_cardinality: 999

  - element_id: dams:rel/LegalEntity/hasTradingParticipation
    name: hasTradingParticipation
    title: hasTradingParticipation
