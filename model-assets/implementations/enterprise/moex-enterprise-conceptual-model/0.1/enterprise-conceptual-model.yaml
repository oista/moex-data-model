element_id: dams:model/enterprise-conceptual/0.1
name: moex_enterprise_conceptual_model
title: moex.concept-data-model
description: >
  Единая корпоративная концептуальная модель MOEX (Party + trading/TKS + commercial/HR + ABS/IT remainder).
  Полное покрытие таблиц CModel_content04.drawio на концептуальном уровне (ADR-029).
  Reified roles не подклассы. Без PK/FK-атрибутов. Physical layer запрещён.
  ExternalTermSelection выравнивается сюда. Tier / genesis / relation terms — ADR-026.
lifecycle_status: draft
api_version: dams.moex/v0.1
model_version: 0.1.0
implementation_scope: enterprise

conceptual_entities:
  - element_id: dams:concept/Organization
    name: Organization
    title: Организация
    description: >
      Организация как бизнес-актор (включая юридические лица и иные
      организационные формы в корпоративном контексте МОЕХ).
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: high
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/LegalEntity
    name: LegalEntity
    title: Юридическое лицо
    description: >
      Юридическое лицо / формальная организация, субъект прав и обязанностей
      в регуляторном и биржевом контексте.
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: high
    parent_concept_ref: dams:concept/Organization
    entity_tier: primary
    genesis_kind: external
    external_class_refs:
      - external_class_ref_id: dams:extref/LegalEntity/fibo-LegalPerson
        target_ref: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/LegalPerson
        match_kind: close
        source_kind: ontology
        approval_status: proposed

  - element_id: dams:concept/CorporateGroup
    name: CorporateGroup
    title: Группа компаний
    description: Группа компаний / холдинговая структура для членства LegalEntity.
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: medium
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/OrganizationIdentifier
    name: OrganizationIdentifier
    title: Идентификатор организации
    description: >
      Идентификатор организации (LEI, ИНН, ОГРН, внутренний код участника и др.).
      Значения типов — MOEX-local controlled vocabulary, не FIBO terms.
    lifecycle_status: active
    entity_type: core
    data_class: reference_data
    business_importance: high
    entity_tier: dependent
    dependency_kind: characteristic
    depends_on_refs:
      - dams:concept/LegalEntity
    genesis_kind: native

  - element_id: dams:concept/TradingParticipation
    name: TradingParticipation
    title: Участие в торгах
    description: >
      Reified отношение: LegalEntity участвует в торгах на площадке/секции
      с собственным статусом, допуском, договором, счетами и документами.
      Не моделируется как подкласс LegalEntity (одна организация — много участий).
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: high
    entity_tier: dependent
    dependency_kind: characteristic
    depends_on_refs:
      - dams:concept/LegalEntity
    genesis_kind: native

  - element_id: dams:concept/TradingVenue
    name: TradingVenue
    title: Торговая площадка
    description: >
      Торговая площадка / рынок, к которому относится допуск.
      Принадлежит торговой системе (TradingSystem); не путать с режимом торгов
      (TradingMode) и секцией (TradingSection).
    lifecycle_status: active
    entity_type: reference
    data_class: reference_data
    business_importance: high
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/TradingSection
    name: TradingSection
    title: Торговая секция
    description: Торговая секция / сегмент площадки (MOEX-local extension concept).
    lifecycle_status: active
    entity_type: reference
    data_class: reference_data
    business_importance: high
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/Admission
    name: Admission
    title: Допуск к торгам
    description: >
      Решение/факт допуска LegalEntity к площадке или секции с lifecycle-статусом.
      MOEX-local extension concept (no-mapping к FIBO по умолчанию).
    lifecycle_status: active
    entity_type: core
    data_class: transactional_data
    business_importance: high
    entity_tier: dependent
    dependency_kind: characteristic
    depends_on_refs:
      - dams:concept/LegalEntity
    genesis_kind: native

  - element_id: dams:concept/Agreement
    name: Agreement
    title: Соглашение
    description: Договор или соглашение, регулирующее участие / допуск.
    lifecycle_status: active
    entity_type: core
    data_class: transactional_data
    business_importance: high
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/AccountRelationship
    name: AccountRelationship
    title: Счётное отношение
    description: >
      Учётное/счётное отношение организации или участия (trading, clearing,
      settlement и др.). MOEX-local extension concept.
    lifecycle_status: active
    entity_type: core
    data_class: master_data
    business_importance: high
    entity_tier: dependent
    dependency_kind: characteristic
    depends_on_refs:
      - dams:concept/LegalEntity
    genesis_kind: native

  - element_id: dams:concept/RegistrationAction
    name: RegistrationAction
    title: Регистрационное действие
    description: >
      Действие, меняющее lifecycle организации или допуска (registration,
      suspension, termination, …). MOEX-local extension concept.
    lifecycle_status: active
    entity_type: core
    data_class: transactional_data
    business_importance: high
    entity_tier: primary
    genesis_kind: native

  - element_id: dams:concept/SupportingDocument
    name: SupportingDocument
    title: Подтверждающий документ
    description: Документ/запись, подтверждающая допуск, действие или соглашение.
    lifecycle_status: active
    entity_type: core
    data_class: transactional_data
    business_importance: medium
    entity_tier: primary
    genesis_kind: native

  # --- Party hub + trading/TKS slice (ADR-029; from CModel_content04 green + party) ---

  - element_id: dams:concept/Person
