mappings:
  - element_id: dams:mapping/align/LegalEntity-placeholder
    name: align_LegalEntity_fibo
    description: >
      Candidate alignsWith to FIBO LegalPerson — governed in ExternalTermSelection
      moex-trading-participant-core; recorded here as enterprise alignment stub.
    lifecycle_status: draft
    source_refs:
      - dams:concept/LegalEntity
    target_refs:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/LegalPerson
    mapping_type: aligns_with
    mapping_cardinality: one_to_one
    approval_status: proposed
