relation_terms:
  - element_id: dams:relterm/memberOf
    name: memberOf
    title: входит в / включает
    description: Членство сущности в группе или совокупности.
    lifecycle_status: active
    forward_label: входит в
    forward_label_en: member of
    inverse_label: включает
    inverse_label_en: has member
    symmetric: false
    default_relationship_kind: association

  - element_id: dams:relterm/identifiedBy
    name: identifiedBy
    title: идентифицируется / идентифицирует
    description: Связь сущности с её идентификатором.
