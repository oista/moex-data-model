source_id: fibo
kind: ontology
adapter: fibo
title: FIBO modular extract (MOEX)
description: >
  Seeded ROBOT extracts of EDM Council FIBO modules used by MOEX mappings.
  Do not vendor the full FIBO release into git (ADR-017).
  Governance version pin: versions/2026Q2/ (ADR-020).
  Scopes/selections live under model-assets/external-scopes and external-selections.
  Test upstream is packages/external-sources mini_ontology (LegalPerson + BusinessDay).
upstream_url: ../../../packages/external-sources/tests/fixtures/mini_ontology
default_ref: fixture-mini-2026Q2
default_seed: seeds/moex-core.txt
extraction_method: BOT
robot_version: "1.9.5"
release_cadence: quarterly
license: https://opensource.org/license/mit
extra:
  input_ontology: LegalPersons.ttl
  # Production: set upstream_url to a local FIBO release checkout and
  # input_ontology to the relevant Master/merged OWL file.
