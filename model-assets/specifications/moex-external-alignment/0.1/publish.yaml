# External Alignment metamodel publication (ADR-020)
module_id: moex:module:external-alignment
kind: publication_module
version: "1"
order: 225
icon: "📐"
title: moex.external-alignment
description: >
  Governance metamodel for ExternalSpecificationScope and ExternalTermSelection.
profile: linkml-specification
sections:
  - id: overview
    title: Overview
    type: markdown-doc
    kind: overview
    source:
      format: markdown
      path: README.md

  - id: explorer
    title: Classes
    description: LinkML classes for scope and term selection
    type: explorer
    kind: classes
    source:
      format: linkml-yaml
      path: schemas/moex-external-alignment.yaml
      select: classes
    groupby: schema

  - id: glossary
    title: Glossary
    description: >
      Class and enum terms of the external-alignment metamodel (generated
      from SchemaView at build; stub JSON is not the source of truth).
    type: glossary
    kind: glossary
    source:
      format: json
      path: publications/external_alignment_glossary.json
    key_column: id
    columns:
      - id
      - title
      - description
      - kind
    filterable:
      - kind
      - origin

  - id: schema-files
    title: Schema source
    type: entity-table
    kind: schema-files
    source:
      format: yaml
      path: publications/schema-files.yaml
      select: files
    key_column: id
    columns:
      - id
      - title
      - path
