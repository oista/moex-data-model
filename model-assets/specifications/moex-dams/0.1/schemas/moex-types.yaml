id: https://data.moex.com/dams/types/v0.1
name: moex_types
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
default_prefix: dams
default_range: string

types:
  SemVer:
    typeof: string
    uri: xsd:string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
  Sha256Digest:
    typeof: string
    uri: xsd:string
    pattern: '^sha256:[a-fA-F0-9]{64}$'

enums:
  LifecycleStatusEnum:
    permissible_values:
      draft:
      active:
      deprecated:
      retired:
  ApprovalStatusEnum:
    permissible_values:
      proposed:
      approved:
      rejected:
      superseded:
  ModelLevelEnum:
    permissible_values:
      conceptual:
      logical:
      physical:
  EntityTypeEnum:
    description: Роль логической сущности в модели решения.
    permissible_values:
      core:
        description: Базовая сущность, создаваемая и управляемая решением.
      derived:
        description: >
          Результат вычисления, агрегации, трансформации или правила;
          обязательны derivation rule и sources (Wave 2).
      reference:
        description: Справочная сущность или представление управляемого справочника.
      projection:
        description: >
          Представление существующей сущности или набора сущностей
          для конкретного use case (API DTO, read model, витрина).
      technical:
        description: Не имеет самостоятельного бизнес-смысла вне технической реализации.
  DataClassEnum:
    description: Класс данных для наследования модельной спецификацией дата-контракта; не совпадает с entity_type.
    permissible_values:
      reference_data:
        description: Нормативно-справочная информация (НСИ).
      master_data:
        description: Мастер-данные.
      transactional_data:
        description: Транзакционные данные.
      analytical_data:
        description: Аналитические или производные наборы данных.
      metadata:
        description: Метаданные.
      operational_data:
        description: >
          Операционные данные — данные для непосредственного выполнения
          операций решения, не являющиеся master/reference, transactional
          событием, analytical результатом или metadata.
  BusinessImportanceEnum:
    description: Важность сущности в модели решения (не criticality бизнес-процесса).
    permissible_values:
      critical:
      high:
      medium:
      low:
  BusinessKeyKindEnum:
    description: Характер бизнес-ключа логической сущности.
    permissible_values:
      natural:
        description: Устойчивый бизнес-идентификатор, независимый от технической реализации.
      composite:
        description: Комбинация нескольких бизнес-атрибутов, уникальная в контексте.
      external:
        description: Идентификатор внешней системы, реестра или контрагента.
      local:
        description: Идентификатор, уникальный только в границе ИТ-решения или контекста.
      surrogate:
        description: Технический ключ реализации; не заменяет identity_rule.
      derived:
        description: Идентификатор, вычисляемый из других атрибутов по документированному правилу.
  ConceptualAlignmentStatusEnum:
    description: Статус выравнивания логической сущности с корпоративным концептуальным уровнем.
    permissible_values:
      aligned:
        description: Есть ссылка на одну или несколько концептуальных сущностей.
      pending:
        description: Связь должна быть установлена, но пока не утверждена; rationale обязателен.
      local-only:
        description: >
          Бизнес-смысл только в контексте данного решения; корпоративный аналог
          сейчас не требуется; rationale обязателен.
      not-applicable:
        description: >
          Сущность техническая/служебная и не относится к conceptual layer;
          допустимо только при entity_type technical.
  DefinitionScopeKindEnum:
    description: >
      Kind of scope for a ScopedDefinition (ADR-025). v1 supports system only;
      enum is intentionally extensible.
    permissible_values:
      system:
        description: Definition applies within one ITSystem of the solution.
  ScopedDefinitionRelationEnum:
    description: >
      How a scoped definition relates to the element's reference definition
      (ADR-025).
    permissible_values:
      refines:
        description: Clarifies the reference definition without changing extension.
      narrows:
        description: Restricts the meaning to a subset in this scope.
      alternative:
        description: Parallel wording for the same concept in this scope.
      replaces:
        description: Scope-local replacement; does not change the reference outside scope.
  EntityTierEnum:
    description: >
      Structural independence of a ConceptualEntity (ADR-026). Orthogonal to
      entity_type, data_class, and business_importance.
    permissible_values:
      primary:
        description: >
          Existence does not depend on other conceptual entities (FK presence
          alone does not make an entity dependent).
      dependent:
        description: >
          Cannot exist without owner entity/entities listed in depends_on_refs.
  DependencyKindEnum:
    description: >
      Kind of structural dependency for a dependent ConceptualEntity (ADR-026).
    permissible_values:
      characteristic:
        description: Part or detail of an owning entity (owner key in identity).
      associative:
        description: Resolves an M:N association between owner entities.
  GenesisKindEnum:
    description: >
      Whether a ConceptualEntity is aligned to an external class/term or is
      native to MOEX (ADR-026).
    permissible_values:
      external:
        description: >
          Aligns to one or more ontology classes or external-specification
          terms (corporate architecture, business models, API/data standards).
      native:
        description: Modelled in MOEX without external parent classes.
  ExternalMatchKindEnum:
    description: >
      Strength of ConceptualEntity ↔ external class alignment (ADR-026).
      Mirrors SKOS mapping relations plus owl:equivalentClass; used for
      definition inheritance (exact/equivalent only).
    permissible_values:
      exact:
        description: skos:exactMatch — substitutable; definition may inherit.
      equivalent:
        description: owl:equivalentClass — substitutable; definition may inherit.
      close:
        description: skos:closeMatch — not substitutable; own description required.
      broad:
        description: skos:broadMatch — external is broader; own description required.
      narrow:
        description: skos:narrowMatch — external is narrower; own description required.
  ExternalSourceKindEnum:
    description: >
      Kind of external source for a ConceptualEntity alignment (ADR-026).
      Aligned with ExternalSpecificationKind where values overlap.
    permissible_values:
      ontology:
      corporate-architecture:
      business-model:
      api-spec:
      other:
  TermDirectionEnum:
    description: >
      Which side of a RelationTerm a Relationship assertion uses (ADR-026).
    permissible_values:
      forward:
        description: Assertion reads with forward_label (source → target).
      inverse:
        description: Assertion reads with inverse_label (source → target uses inverse wording).
  MappingCoverageStatusEnum:
    description: >
      Статус покрытия элемента mapping’ом на соседнем уровне модели
      (logical ↔ physical). Не статус самой логической модели.
    permissible_values:
      mapped:
        description: Есть формальное mapping.
      derived:
        description: Значение выводится из источников по documented expression.
      planned:
        description: >
          Физическая реализация или mapping ещё не введены.
          Требует mapping_rationale; не постоянный обход для active артефактов.
      inherited:
        description: Mapping наследуется/делегируется из родительского элемента.
      technical-only:
        description: Поле/объект имеет только техническое назначение.
      not-applicable:
        description: Mapping неприменим по характеру элемента.
  RelationshipKindEnum:
    description: Тип логической связи (Wave 2).
    permissible_values:
      association:
      composition:
      aggregation:
      specialization:
      reference:
      derivation:
      realization:
      lineage:
      event_participation:
  SecurityClassificationEnum:
    description: Режим защиты данных (Wave 2); ортогонален governance_classification.
    permissible_values:
      internal:
      confidential:
      restricted:
  GovernanceClassificationEnum:
    description: Базовая шкала ограничения доступа; специальные виды тайны задаются отдельными терминами классификации.
    permissible_values:
      public:
      internal:
      confidential:
      restricted:
  LogicalDataTypeEnum:
    permissible_values:
      string:
      integer:
      decimal:
      boolean:
      date:
      datetime:
      time:
      binary:
      identifier:
      uri:
      object:
  PhysicalObjectKindEnum:
    permissible_values:
      database:
      schema:
      table:
      view:
      column:
      api:
      endpoint:
      payload:
      topic:
      queue:
      message:
      file:
      dataset:
      pipeline:
  FlowDirectionEnum:
    permissible_values:
      inbound:
      outbound:
      internal:
      bidirectional:
  SolutionDataRoleEnum:
    permissible_values:
      producer:
      consumer:
      intermediary:
  IntegrationChannelEnum:
    permissible_values:
      api:
      queue:
      database:
      file:
      other:
  IntegrationClassEnum:
    permissible_values:
      EAP:
      EDA:
  IntegrationLevelEnum:
    permissible_values:
      intraplatform:
      interplatform:
  MappingTypeEnum:
    description: >
      Kind of Mapping assertion. realizes = solution element → enterprise
      conceptual; entity_physical = PhysicalObject ↔ LogicalEntity;
      field_mapping = mapsTo (physical field ↔ logical attribute); aligns_with =
      enterprise conceptual ↔ external term. Do not use Mapping for SpecImpl
      implements (that is conforms_to / publication implements).
    permissible_values:
      semantic_equivalence:
      specialization:
      implementation:
      entity_physical:
        description: >
          Explicit entity-level link between PhysicalObject and LogicalEntity
          (PDM-003). Do not infer from field_mapping alone.
      field_mapping:
        description: Technical/structural mapsTo between physical and logical.
      transformation:
      aggregation:
      derivation:
      realizes:
        description: Solution logical/concept realizes an enterprise conceptual entity.
      aligns_with:
        description: Enterprise conceptual aligns with an external reference term.

  ImplementationProfileEnum:
    description: >
      DAMS-side mirror of kernel ImplementationProfile for ModelPackage metadata.
      Package-level dams_model_level applies only to dams-data-model.
    permissible_values:
      dams-data-model:
        description: MOEX DAMS corporate data-model implementation.
      ontology-application:
        description: Not a DAMS model Impl — ontology application profile.
      api-specification:
      data-contract:
      other:

  DAMSModelLevelEnum:
    description: >
      Package-level DAMS model layer (ADR-021). Distinct from ModelLevelEnum
      (element conceptual/logical/physical). No domain-logical value.
    permissible_values:
      enterprise-conceptual:
        description: Enterprise corporate conceptual model (solution-independent).
      solution:
        description: IT-solution model with local logical/physical facets.

  ImplementationScopeEnum:
    permissible_values:
      enterprise:
        description: Enterprise-wide scope (no solution_ref).
      solution:
        description: Scoped to a specific IT solution.

  MappingCardinalityEnum:
    permissible_values:
      one_to_one:
      one_to_many:
      many_to_one:
      many_to_many:
  CompatibilityModeEnum:
    permissible_values:
      backward:
      forward:
      full:
      none:
  SpecificationKindEnum:
    permissible_values:
      integration:
      data_model:
      data_quality:
  EnforcementResultEnum:
    permissible_values:
      pass:
      warn:
      fail:
      not_applicable:
  RequirementLevelEnum:
    description: Уровень применения требования к спецификации.
    permissible_values:
      conceptual_model:
        description: Концептуальная модель
      it_solution:
        description: ИТ-решение
      it_system:
        description: ИТ-система
  RequirementSectionEnum:
    description: Раздел каталога требований (трёхбуквенный код в code).
    permissible_values:
      LDM:
        description: Логическая модель
      PDM:
        description: Физическая модель
      REF:
        description: Связи сущностей
      ATR:
        description: Атрибуты
      FLW:
        description: Потоки данных
      CLS:
        description: Классификация данных
      GEN:
        description: Общие требования
  FormalCheckKindEnum:
    description: Вид формальной проверки в нотации, близкой к LinkML constraints.
    permissible_values:
      slot_required:
      slot_min_cardinality:
      ref_resolves:
      key_subset:
      at_least_one_slots:
        description: Хотя бы один из target_slots заполнен (override обоих допустим).
      definition_resolvable:
        description: >
          Effective definition must resolve (ADR-025): own description,
          definition_source_ref, or single conceptual_entity_refs inheritance.
      conditional_branch:
        description: >
          Фиксированный шаблон (имя в expression): status→slots, allowlist kinds,
          planned guard, semantic inclusion и т.п. Без произвольного mini-language.
      custom:
  CheckSeverityEnum:
    permissible_values:
      error:
      warning:
