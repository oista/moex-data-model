id: https://data.moex.com/dams/requirements/v0.1
name: moex_requirements
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
  - moex-types
  - moex-core
default_prefix: dams
default_range: string

classes:
  RequirementApplicability:
    description: >
      Область применимости требования (без graph queries): класс цели,
      профиль и уровень модели.
    slots:
      - applies_target_class
      - applies_target_kinds
      - applies_implementation_scope
      - applies_dams_model_level
      - applies_implementation_profile

  FormalCheck:
    description: >-
      Одна машиночитаемая проверка требования. Kind выровнен с LinkML
      constraints и DAMS reference/structural diagnostics. formal_checks —
      исполняемое подмножество нормы; исполняется assess (ADR-013).
    slots:
      - check_id
      - kind
      - target_class
      - target_slot
      - target_slots
      - target_path
      - severity
      - diagnostic_code
      - expression
      - remediation

  SpecificationRequirement:
    is_a: ModelElement
    description: >-
      Нормативное требование к модели, соответствующей reference specification
      (каталог для уровня ИТ-решения и др.).
    slots:
      - code
      - requirement_level
      - requirement_section
      - statement
      - applies_to
      - formal_checks

  RequirementCatalog:
    description: Контейнер инстансов SpecificationRequirement вне ModelPackage.
    slots:
      - catalog_id
      - name
      - requirements

slots:
  check_id:
    identifier: true
    range: string
    required: true
  kind:
    range: FormalCheckKindEnum
    required: true
  target_class:
    range: string
    description: Имя класса LinkML (например LogicalEntity).
  target_slot:
    range: string
  target_slots:
    range: string
    multivalued: true
    description: Список слотов для kind=at_least_one_slots.
  target_path:
    range: string
    description: JSON Pointer или path hint в теле ModelPackage.
  severity:
    range: CheckSeverityEnum
    required: true
  diagnostic_code:
    range: string
    description: Мост к DAMS-STRUCT-* / DAMS-REF-* / DAMS-REQ-*.
  expression:
    range: string
    description: >
      Имя фиксированного шаблона для conditional_branch / custom
      (например ldm006_alignment, planned_on_active_warning).
  remediation:
    range: string
    description: Actionable remediation text for CI / Cursor / authors.
  code:
    range: string
    required: true
    pattern: '^(LDM|PDM|REF|ATR|FLW|CLS|GEN)-[0-9]{3}$'
  requirement_level:
    range: RequirementLevelEnum
    required: true
  requirement_section:
    range: RequirementSectionEnum
    required: true
  statement:
    range: string
    required: true
    description: >
      Полная нормативная формулировка на русском для человека: без имён
      LinkML-классов, слотов, kinds проверок и сленга метамодели.
  applies_to:
    range: RequirementApplicability
    inlined: true
    description: Область применимости требования для formal_checks runner.
  applies_target_class:
    range: string
    description: Имя класса LinkML, к экземплярам которого применяется требование.
  applies_target_kinds:
    range: string
    multivalued: true
    description: Опциональный allowlist object_kind / facet (например table, topic).
  applies_implementation_scope:
    range: ImplementationScopeEnum
  applies_dams_model_level:
    range: DAMSModelLevelEnum
  applies_implementation_profile:
    range: ImplementationProfileEnum
  formal_checks:
    range: FormalCheck
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  catalog_id:
    identifier: true
    range: uriorcurie
    required: true
  requirements:
    range: SpecificationRequirement
    multivalued: true
    inlined: true
    inlined_as_list: true
