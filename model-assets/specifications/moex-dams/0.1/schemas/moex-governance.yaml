id: https://data.moex.com/dams/governance/v0.1
name: moex_governance
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
  - moex-types
  - moex-registries
  - moex-base
default_prefix: dams
default_range: string

classes:
  GovernanceAssignment:
    abstract: true
    description: >
      Authored authoritative governance fact for a target element (ADR-049).
      Overrides inline authored defaults (ADR-023 cascade) for the validity
      window and assignment_scope. Effective values are not stored on this
      class; they appear only in EffectiveGovernanceView.
    mixins:
      - HasAssertionMetadata
    slots:
      - assignment_id
      - target_element_ref
      - assignment_scope

  ClassificationAssignment:
    is_a: GovernanceAssignment
    description: >
      Версионируемое назначение категории классификации элементу модели
      с основанием и периодом действия (ADR-049 authoritative layer).
    slots:
      - classification_term_ref
      - governance_classification
      - classification_source
      - classification_rationale

  PolicyBinding:
    is_a: GovernanceAssignment
    description: >
      Применение управляемой политики к элементу модели
      (ADR-049 authoritative layer).
    slots:
      - policy_ref
      - binding_effect

  OwnershipAssignment:
    is_a: GovernanceAssignment
    description: >
      Версионируемое назначение data owner / steward / owning unit
      элементу модели (ADR-049 authoritative layer).
    slots:
      - data_owner_ref
      - data_steward_ref
      - owning_unit_ref

  HasLifecycle:
    mixin: true
    description: "Mixin жизненного цикла: статус, период действия и ссылка на заменяющий элемент."
    mixins:
      - HasValidity
    slots:
      - lifecycle_status
      - deprecated_by_ref

  HasOwnership:
    mixin: true
    description: >
      Mixin владения: data owner, data steward и организационное подразделение.
      Authored default (ADR-023 cascade: absent key inherits; present = override).
      Overridden by OwnershipAssignment when approved and in force (ADR-049).
      Effective ownership is not stored on the element.
    slots:
      - data_owner_ref
      - data_steward_ref
      - owning_unit_ref
      - ownership_inheritance_rule

  HasBusinessClassification:
    mixin: true
    description: Классификация роли и бизнес-значимости логической сущности.
    slots:
      - entity_type
      - data_class
      - business_importance

  HasGovernanceClassification:
    mixin: true
    description: >
      Базовая и специальная классификация чувствительности данных.
      Authored default: governance_classification участвует в containment
      cascade (ADR-023). Overridden by ClassificationAssignment when approved
      and in force (ADR-049). Effective classification is not stored here.
    slots:
      - governance_classification
      - security_classification
      - sensitivity_term_refs
      - classification_source
      - classification_rationale

  HasPolicyBindings:
    mixin: true
    description: >
      Mixin привязки управляемых политик к элементу модели.
      Authored default: policy_refs участвует в containment cascade (ADR-023);
      absent key inherits; present list (including empty) is full replace.
      Overridden by PolicyBinding when approved and in force (ADR-049).
      Effective policy set is not stored here.
    slots:
      - policy_refs

  HasProvenance:
    mixin: true
    description: "Mixin происхождения и согласования: исходный артефакт, evidence, статус и согласующий."
    slots:
      - source_artifact_ref
      - evidence_refs
      - approval_status
      - approved_by_ref
      - approved_at

  HasAssertionMetadata:
    mixin: true
    mixins:
      - HasValidity
      - HasProvenance
    description: >
      Qualified assertion metadata (ADR-053): validity window, provenance /
      approval, and optional confidence. Applied to Mapping, ExternalClassRef,
      ScopedDefinition, and GovernanceAssignment. Does not introduce an
      Assertion / QualifiedRelation class in the is_a backbone (ADR-044).
    slots:
      - confidence

  HasDefinition:
    mixin: true
    mixins:
      - DescribedElement
    description: >
      Mixin эталонного определения (ADR-025 / ADR-044). Слот description
      индуцируется через DescribedElement; exact_mappings указывает
      skos:definition (slot_uri не меняется — предикат dams:description).
      Отсутствие description при наличии definition_source_ref означает
      наследование; заданный description — own (опционально adapted from
      source). scoped_definitions — контекстные определения (v1: уровень
      ITSystem), не заменяющие эталон вне scope.
    slots:
      - definition_source_ref
      - definition_rationale
      - scoped_definitions
    slot_usage:
      description:
        required: false
        exact_mappings:
          - skos:definition
        description: >
          Reference definition (skos:definition via exact_mappings; RDF
          predicate remains dams:description per ADR-044). Absent means
          inherit via definition_source_ref (ontology class or GlossaryTerm)
          per ADR-025. Prefer definition cascade over copying text from
          related ConceptualProperty / LogicalAttribute.

  ScopedDefinition:
    mixins:
      - HasAssertionMetadata
    description: >
      Контекстное определение элемента модели (ADR-025 / ISO 11179 Context).
      Не является отдельным термином глоссария и не заменяет эталонное
      определение вне указанного scope.
    slots:
      - scoped_definition_id
      - scope_kind
      - scope_ref
      - text
      - relation_to_reference
      - rationale

slots:
  assignment_id:
    identifier: true
    range: uriorcurie
    required: true
  target_element_ref:
    range: uriorcurie
    required: true
    description: >
      Element covered by this assignment (element_id) (ADR-049).
  assignment_scope:
    range: AssignmentScopeEnum
    required: true
    description: >
      element = target only; subtree = target and descendants in the
      containment cascade (ADR-023 / ADR-049).
  classification_term_ref:
    range: DataClassificationTerm
    inlined: false
  policy_ref:
    range: Policy
    inlined: false
    required: true
  binding_effect:
    range: BindingEffectEnum
    description: >
      How this PolicyBinding combines with lower layers (ADR-049).
      Default replace = list-replace like ADR-023; add = union onto cascade.
  lifecycle_status:
    range: LifecycleStatusEnum
    required: true
  deprecated_by_ref:
    range: uriorcurie
  data_owner_ref:
    range: Role
    inlined: false
  data_steward_ref:
    range: Role
    inlined: false
  owning_unit_ref:
    range: OrganizationUnit
    inlined: false
  ownership_inheritance_rule:
    range: string
    description: >
      Deprecated as source of truth (ADR-023). Human-readable rationale for
      ownership inheritance/override only; does not substitute data_owner_ref.
      Effective ownership is resolved by the containment cascade.
  entity_type:
    range: EntityTypeEnum
  data_class:
    range: DataClassEnum
  business_importance:
    range: BusinessImportanceEnum
  governance_classification:
    range: GovernanceClassificationEnum
  security_classification:
    range: SecurityClassificationEnum
    description: Режим защиты (Wave 2); ортогонален governance_classification.
  sensitivity_term_refs:
    range: DataClassificationTerm
    multivalued: true
    inlined: false
  classification_source:
    range: string
  classification_rationale:
    range: string
  policy_refs:
    range: Policy
    multivalued: true
    inlined: false
  source_artifact_ref:
    range: uri
  evidence_refs:
    range: uri
    multivalued: true
  approval_status:
    range: ApprovalStatusEnum
  approved_by_ref:
    range: Role
    inlined: false
  approved_at:
    range: datetime
  confidence:
    range: decimal
    minimum_value: 0
    maximum_value: 1
    description: >
      Optional assertion confidence in [0, 1] (ADR-053 HasAssertionMetadata).
      Shared by Mapping, ExternalClassRef, ScopedDefinition, GovernanceAssignment.
  definition_source_ref:
    range: uriorcurie
    description: >
      Reference to the element or external term whose definition is inherited
      or adapted (ADR-025). Orthogonal to glossary_term_refs (term assignment).
  definition_rationale:
    range: string
    description: >
      Human rationale for declaring an own definition when a source is also
      cited, or for overriding an inherited definition.
  scoped_definitions:
    range: ScopedDefinition
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Context-scoped definitions (ADR-025); v1 scope_kind = system.
  scoped_definition_id:
    identifier: true
    range: uriorcurie
    required: true
  scope_kind:
    range: DefinitionScopeKindEnum
    required: true
  scope_ref:
    range: uriorcurie
    required: true
    description: >
      Target of the scope (e.g. ITSystem registry id). For scope_kind=system
      must be a member of the solution's ITSolution.member_system_refs.
  text:
    range: string
    required: true
    description: Scoped definition text (skos:definition in this context).
  relation_to_reference:
    range: ScopedDefinitionRelationEnum
    required: true
  rationale:
    range: string
    description: Why this scoped wording differs from the reference definition.
