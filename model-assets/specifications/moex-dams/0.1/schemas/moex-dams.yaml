id: https://data.moex.com/dams/v0.1
name: moex_dams
version: 1.0.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dams: https://data.moex.com/dams/
  moex: https://data.moex.com/
imports:
  - linkml:types
  - moex-types
  - moex-registries
  - moex-governance
  - moex-core
  - moex-technical
  - moex-semantic
  - moex-datatypes
  - moex-integration
  - moex-contract-binding
  - moex-analytics
  - moex-requirements
default_prefix: dams
default_range: string

classes:
  MOEXModelRepository:
    tree_root: true
    description: Корневой контейнер для проверки набора моделей, ссылочных проекций справочников, потоков и контрактных bindings.
    slots:
      - repository_id
      - registry_entries
      - model_packages
      - data_flows
      - data_model_bindings
      - metrics
      - dimensions
      - classification_assignments
      - policy_bindings

slots:
  repository_id:
    identifier: true
    range: uriorcurie
    required: true
  registry_entries:
    range: RegistryEntry
    multivalued: true
    inlined: true
    inlined_as_list: true
  model_packages:
    range: ModelPackage
    multivalued: true
    inlined: true
    inlined_as_list: true
  data_flows:
    range: DataFlow
    multivalued: true
    inlined: true
    inlined_as_list: true
  data_model_bindings:
    range: DataModelBinding
    multivalued: true
    inlined: true
    inlined_as_list: true
  metrics:
    range: Metric
    multivalued: true
    inlined: true
    inlined_as_list: true
  dimensions:
    range: Dimension
    multivalued: true
    inlined: true
    inlined_as_list: true
  classification_assignments:
    range: ClassificationAssignment
    multivalued: true
    inlined: true
    inlined_as_list: true
  policy_bindings:
    range: PolicyBinding
    multivalued: true
    inlined: true
    inlined_as_list: true
