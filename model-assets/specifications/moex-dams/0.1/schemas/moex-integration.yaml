id: https://data.moex.com/dams/integration/v0.1
name: moex_integration
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
  - moex-types
  - moex-registries
  - moex-governance
  - moex-core
  - moex-technical
default_prefix: dams
default_range: string

classes:
  DataFlow:
    is_a: ModelElement
    mixins:
      - HasOwnership
    description: >
      Ссылочная проекция зарегистрированной интеграции; топология и канал являются
      данными Clinkr и читаются из TopologyView, а семантика — модели данных (ADR-048).
    slots:
      - integration_ref
      - contract_ref
      - bound_catalog_revision
      - entity_bindings
    slot_usage:
      description:
        required: true

  DataFlowEntityBinding:
    is_a: ModelElement
    description: Связь потока с логическими сущностями, атрибутами и носителями данных модели решения.
    slots:
      - flow_ref
      - source_model_ref
      - logical_entity_ref
      - logical_attribute_refs
      - carrier_refs
      - schema_node_refs
      - transformation_mapping_refs
      - direction
      - catalog_operation_ref
      - catalog_participant_ref
    slot_usage:
      description:
        required: true

slots:
  integration_ref:
    range: IntegrationReference
    inlined: false
    required: true
  contract_ref:
    range: DataContractReference
    inlined: false
  bound_catalog_revision:
    range: string
    description: >
      Ревизия файл-снимка каталога, на которой подтверждена привязка flow (ADR-048).
      Источник stale_revision в drift-отчёте.
  entity_bindings:
    range: DataFlowEntityBinding
    multivalued: true
    inlined: true
    inlined_as_list: true
  flow_ref:
    range: DataFlow
    inlined: false
    required: true
  source_model_ref:
    range: uri
    required: true
  logical_entity_ref:
    range: LogicalEntity
    inlined: false
    required: true
  logical_attribute_refs:
    range: LogicalAttribute
    multivalued: true
    inlined: false
    minimum_cardinality: 1
  carrier_refs:
    range: DataCarrier
    multivalued: true
    inlined: false
    minimum_cardinality: 1
    description: Носители данных, участвующие в binding (не контейнеры).
  schema_node_refs:
    range: uriorcurie
    multivalued: true
    inlined: false
    description: Ссылки на узлы схемы (SchemaNode) в DataStructure.
  transformation_mapping_refs:
    range: Mapping
    multivalued: true
    inlined: false
  catalog_operation_ref:
    range: string
    description: >
      Идентификатор операции или канала в каталоге интеграций (ADR-048),
      к которому привязан этот entity binding.
  catalog_participant_ref:
    range: uriorcurie
    description: >
      Внешний участник каталога (система/решение), чью роль в обмене занимает
      source_model_ref; роль producer/consumer выражена слотом direction (ADR-048).
