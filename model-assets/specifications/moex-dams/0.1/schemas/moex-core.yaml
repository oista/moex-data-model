id: https://data.moex.com/dams/core/v0.1
name: moex_core
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
  - moex-types
  - moex-registries
  - moex-base
  - moex-governance
  - moex-technical
  - moex-semantic
  - moex-datatypes
  - moex-structure
default_prefix: dams
default_range: string

classes:
  ModelElement:
    abstract: true
    description: >
      Абстрактный корень именованных элементов модели: IdentifiedElement +
      NamedElement + DescribedElement + HasLifecycle + HasSemanticAnnotations
      (ADR-044).
    is_a: IdentifiedElement
    mixins:
      - NamedElement
      - DescribedElement
      - HasLifecycle
      - HasSemanticAnnotations

  ModelPackage:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasGovernanceClassification
      - HasPolicyBindings
    description: >
      Версионируемый артефакт модели данных: либо корпоративная conceptual
      модель (enterprise), либо модель конкретного ИТ-решения (solution).
      Package-level DAMS layer is dams_model_level on the SpecImpl envelope
      (ADR-021); implementation_scope here mirrors that body-level semantics.
    slots:
      - api_version
      - model_version
      - implementation_scope
      - conceptual_implementation_ref
      - solution_ref
      - domain_refs
      - imports_refs
      - conceptual_entities
      - domain_contexts
      - logical_entities
      - relationships
      - relation_terms
      - data_carriers
      - access_points
      - data_containers
      - execution_assets
      - mappings
      - conceptual_properties
      - conceptual_domains
      - value_domains
      - data_types
      - native_type_bindings
      - data_structures
      - messages
    slot_usage:
      description:
        required: true

  DomainContext:
    is_a: ModelElement
    mixins:
      - HasOwnership
    description: Ограниченный логический контекст с собственной терминологией и областью ответственности.
    slots:
      - domain_ref
      - solution_ref
      - namespace
      - business_process_refs
    slot_usage:
      description:
        required: true

  ConceptualEntity:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasBusinessClassification
      - HasDefinition
    description: Корпоративное бизнес-понятие верхнего уровня, независимое от конкретной реализации.
    slots:
      - parent_concept_ref
      - key_attribute_refs
      - entity_tier
      - dependency_kind
      - depends_on_refs
      - genesis_kind
      - external_class_refs

  ConceptualProperty:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasDefinition
      - HasProvenance
      - HasPolicyBindings
    class_uri: dams:ConceptualProperty
    close_mappings:
      - rdf:Property
    comments:
      - >
        ISO/IEC 11179 Property (close). Облегчённый концептуальный слой — только
        для значимых атрибутов (вариант B, ADR-034). IRI ISO 11179 не используются.
    description: >
      Значимое концептуальное свойство сущности КМД. Создаётся только при наличии
      significance_basis; не обязательно для каждого LogicalAttribute.
    slots:
      - property_owner_entity_ref
      - significance_basis
      - significance_rationale
      - property_kind
      - conceptual_domain_ref
      - is_identifying
      - genesis_kind
    unique_keys:
      conceptual_property_key:
        unique_key_slots:
          - property_owner_entity_ref
          - name
    slot_usage:
      genesis_kind:
        required: true
    rules:
      - description: 'INV-001: identifying property_kind требует is_identifying'
        preconditions:
          slot_conditions:
            property_kind:
              equals_string: identifying
        postconditions:
          slot_conditions:
            is_identifying:
              equals_string: "true"

  LogicalEntity:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasBusinessClassification
      - HasGovernanceClassification
      - HasPolicyBindings
      - HasDefinition
    description: Представление бизнес-сущности в доменном контексте и модели конкретного решения.
    slots:
      - context_ref
      - conceptual_entity_refs
      - solution_ref
      - solution_data_role
      - attributes
      - key_attribute_refs
      - invariant_refs
      - identity_rule
      - business_key_kind
      - conceptual_alignment_status
      - alignment_rationale
      - isolation_rationale

  LogicalAttribute:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasGovernanceClassification
      - HasPolicyBindings
      - HasDefinition
    description: >
      Логический атрибут сущности: идентификация, обязательность, кардинальность
      и ссылки на представление (DataType/ValueDomain) и опционально на
      ConceptualProperty (вариант B, ADR-034).
    slots:
      - owner_entity_ref
      - concept_ref
      - value_domain_ref
      - data_type_ref
      - critical_data_element
      - required
      - multivalued
      - minimum_cardinality
      - maximum_cardinality
      - default_value
      - derived_expression
      - mapping_coverage_status
      - mapping_rationale
      - currency_attribute_ref
      - timezone_policy
      - temporal_semantics
    slot_usage:
      data_type_ref:
        required: false
        description: >
          Ссылка на корпоративный DataType. Обязателен data_type_ref и/или
          value_domain_ref (ADR-034 шаг 2 / PR-5).
      concept_ref:
        required: false
        description: >
          Опциональная ссылка на ConceptualProperty. Отсутствие не является
          ошибкой и не порождает предупреждение (вариант B).

  Relationship:
    is_a: ModelElement
    description: Именованная связь между логическими или концептуальными сущностями.
    slots:
      - source_entity_ref
      - target_entity_ref
      - source_role
      - target_role
      - source_min_cardinality
      - source_max_cardinality
      - target_min_cardinality
      - target_max_cardinality
      - identifying
      - associative
      - relationship_kind
      - cardinality_rationale
      - relation_term_ref
      - term_direction

  RelationTerm:
    is_a: ModelElement
    mixins:
      - HasDefinition
    description: >
      Governed dictionary term for a conceptual/logical relationship (ADR-026).
      Provides forward and inverse natural-language labels so a single Relationship
      assertion can be read from either side.
    slots:
      - forward_label
      - forward_label_en
      - inverse_label
      - inverse_label_en
      - symmetric
      - default_relationship_kind
      - ontology_property_ref

  ExternalClassRef:
    mixins:
      - HasProvenance
    description: >
      Alignment of a ConceptualEntity to an external class or term (ADR-026).
      Canonical store for conceptual↔external links; Mapping(aligns_with) may
      mirror for ExternalTermSelection projections.
    slots:
      - external_class_ref_id
      - target_ref
      - match_kind
      - source_kind
      - external_specification_ref
      - selection_ref

  Mapping:
    is_a: IdentifiedElement
    mixins:
      - DescribedElement
      - HasLifecycle
      - HasProvenance
    description: >
      Явное соответствие между элементами. Discriminate via mapping_type:
      realizes (solution→enterprise conceptual), entity_physical
      (DataCarrier↔LogicalEntity), field_mapping/mapsTo
      (SchemaNode↔LogicalAttribute), aligns_with (enterprise↔external term).
      Not used for SpecImpl implements/conforms_to.
      Identity slots name/title/aliases/glossary_term_refs/tags removed in
      DAMS 3.0.0 (ADR-044); display label = source_refs -> target_refs
      [mapping_type].
    slots:
      - source_refs
      - target_refs
      - mapping_type
      - mapping_cardinality
      - transformation_ref
      - transformation_expression
      - confidence
    slot_usage:
      description:
        required: false

slots:
  api_version:
    range: string
    required: true
  model_version:
    is_a: artifact_version
    required: true
  implementation_scope:
    range: ImplementationScopeEnum
    description: >
      Body-level scope: enterprise (no solution_ref) or solution.
      Must align with envelope dams_model_level when profile is dams-data-model.
  conceptual_implementation_ref:
    range: uriorcurie
    description: >
      Required for solution packages: reference to the enterprise-conceptual
      SpecImpl / ModelPackage id (e.g. moex-enterprise-conceptual-model).
  solution_ref:
    range: ITSolution
    inlined: false
  domain_refs:
    range: BusinessDomain
    multivalued: true
    inlined: false
  imports_refs:
    range: uri
    multivalued: true
  conceptual_entities:
    range: ConceptualEntity
    multivalued: true
    inlined: true
    inlined_as_list: true
  domain_contexts:
    range: DomainContext
    multivalued: true
    inlined: true
    inlined_as_list: true
  logical_entities:
    range: LogicalEntity
    multivalued: true
    inlined: true
    inlined_as_list: true
  relationships:
    range: Relationship
    multivalued: true
    inlined: true
    inlined_as_list: true
  mappings:
    range: Mapping
    multivalued: true
    inlined: true
    inlined_as_list: true
  data_carriers:
    range: DataCarrier
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция носителей данных пакета (Variant B, ADR-031).
  access_points:
    range: AccessPoint
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция точек доступа пакета (Variant B, ADR-031).
  data_containers:
    range: DataContainer
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция контейнеров пакета (Variant B, ADR-031).
  execution_assets:
    range: ExecutionAsset
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция исполняемых активов пакета (Variant B, ADR-031).
  conceptual_properties:
    range: ConceptualProperty
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Значимые концептуальные свойства (только enterprise-пакеты).
  conceptual_domains:
    range: ConceptualDomain
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Концептуальные домены смыслов (только enterprise-пакеты).
  value_domains:
    range: ValueDomain
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Домены представления значений (enterprise или solution).
  data_types:
    range: DataType
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Корпоративный реестр типов данных.
  native_type_bindings:
    range: NativeTypeBinding
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Привязки нативных типов диалектов к DataType.
  domain_ref:
    range: BusinessDomain
    inlined: false
    required: true
  namespace:
    range: uri
    required: true
  business_process_refs:
    range: BusinessProcess
    multivalued: true
    inlined: false
  parent_concept_ref:
    range: ConceptualEntity
    inlined: false
  key_attribute_refs:
    range: uriorcurie
    multivalued: true
  entity_tier:
    range: EntityTierEnum
    description: >
      Structural independence of the conceptual entity (ADR-026). primary =
      independent existence; dependent = requires depends_on_refs.
  dependency_kind:
    range: DependencyKindEnum
    description: >
      Required when entity_tier=dependent. characteristic = part/detail of an
      owner; associative = M:N resolver between owners (ADR-026).
  depends_on_refs:
    range: ConceptualEntity
    multivalued: true
    inlined: false
    description: >
      Owner conceptual entities this dependent entity requires. Empty for
      primary; at least one for dependent (ADR-026).
  genesis_kind:
    range: GenesisKindEnum
    description: >
      external = aligns to ontology/external class(es); native = modelled
      without external parents (ADR-026).
  external_class_refs:
    range: ExternalClassRef
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: >
      Canonical ConceptualEntity → external class/term alignments with
      match_kind (ADR-026). Non-empty iff genesis_kind=external.
  relation_terms:
    range: RelationTerm
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Governed relation-term dictionary for the package (ADR-026).
  context_ref:
    range: DomainContext
    inlined: false
    required: true
  conceptual_entity_refs:
    range: ConceptualEntity
    multivalued: true
    inlined: false
  solution_data_role:
    range: SolutionDataRoleEnum
    required: true
  attributes:
    range: LogicalAttribute
    multivalued: true
    inlined: true
    inlined_as_list: true
  invariant_refs:
    range: Policy
    multivalued: true
    inlined: false
  owner_entity_ref:
    range: LogicalEntity
    inlined: false
    required: true
    description: >
      Structural parent LogicalEntity of this attribute (containment), not the
      data owner role. Data ownership uses data_owner_ref via HasOwnership /
      ADR-023 cascade.
  property_owner_entity_ref:
    range: ConceptualEntity
    inlined: false
    required: true
    description: >
      ConceptualEntity-владелец ConceptualProperty (концептуальный containment).
  concept_ref:
    range: ConceptualProperty
    inlined: false
    description: >
      Опциональная ссылка LogicalAttribute → ConceptualProperty. Никогда не
      обязательна (вариант B, ADR-034).
  value_domain_ref:
    range: ValueDomain
    inlined: false
    description: Ссылка на домен представления значений.
  critical_data_element:
    range: boolean
    description: >
      Признак критичного элемента данных (CDE). Единственный источник правды
      для critical_data; термин CDE в ClassificationAssignment не вводится (ADR-034).
  significance_basis:
    range: SignificanceBasisEnum
    multivalued: true
    required: true
    description: Основания существования ConceptualProperty (минимум одно).
  significance_rationale:
    range: string
    description: >
      Обязательное обоснование, если significance_basis содержит explicit_decision.
  property_kind:
    range: PropertyKindEnum
    required: true
    description: Вид концептуального свойства.
  is_identifying:
    range: boolean
    description: Является ли свойство идентифицирующим (бизнес-ключ).
  required:
    range: boolean
    required: true
  multivalued:
    range: boolean
    required: true
  minimum_cardinality:
    range: integer
    minimum_value: 0
  maximum_cardinality:
    range: integer
    minimum_value: 1
  default_value:
    range: string
  derived_expression:
    range: string
  identity_rule:
    range: string
    description: >
      Деловое правило идентичности экземпляров сущности в контексте ИТ-решения.
  business_key_kind:
    range: BusinessKeyKindEnum
  conceptual_alignment_status:
    range: ConceptualAlignmentStatusEnum
  alignment_rationale:
    range: string
    description: Обоснование статуса выравнивания с концептуальным уровнем.
  isolation_rationale:
    range: string
    description: Обоснование семантической изоляции сущности (LDM-007).
  mapping_coverage_status:
    range: MappingCoverageStatusEnum
    description: >
      Статус покрытия элемента mapping’ом на соседнем уровне модели
      (logical ↔ physical).
  mapping_rationale:
    range: string
    description: Обоснование для planned / technical-only / not-applicable / inherited.
  currency_attribute_ref:
    range: uriorcurie
    description: Ссылка на атрибут валюты для денежной величины (Wave 2 soft).
  timezone_policy:
    range: string
    description: Политика часового пояса для timestamp (Wave 2 soft).
  temporal_semantics:
    range: string
    description: Семантика даты/времени (Wave 2 soft).
  relationship_kind:
    range: RelationshipKindEnum
    description: Тип логической связи (Wave 2).
  cardinality_rationale:
    range: string
    description: Обоснование отсутствия кардинальности для draft/imported связей.
  relation_term_ref:
    range: RelationTerm
    inlined: false
    description: >
      Reference to a governed RelationTerm providing forward/inverse labels
      (ADR-026). One Relationship record per pair; labels are derived.
  term_direction:
    range: TermDirectionEnum
    description: >
      Whether this Relationship assertion uses the forward or inverse wording
      of relation_term_ref (ADR-026). Default forward when omitted.
  forward_label:
    range: string
    required: true
    description: Natural-language label source → target (ADR-026).
  forward_label_en:
    range: string
    description: English forward label (ADR-026).
  inverse_label:
    range: string
    description: >
      Natural-language label target → source. Required unless symmetric
      (ADR-026).
  inverse_label_en:
    range: string
    description: English inverse label (ADR-026).
  symmetric:
    range: boolean
    description: >
      When true, forward and inverse labels are the same; inverse_label may
      be omitted (ADR-026).
  default_relationship_kind:
    range: RelationshipKindEnum
    description: Optional default relationship_kind when this term is used.
  ontology_property_ref:
    range: uriorcurie
    description: >
      Optional owl:ObjectProperty IRI. Reserve for future property import;
      not required in v1 (ADR-026 / ADR-024 §7).
  external_class_ref_id:
    identifier: true
    range: uriorcurie
    required: true
  target_ref:
    range: uriorcurie
    required: true
    description: IRI/CURIE of the external class or term (ADR-026).
  match_kind:
    range: ExternalMatchKindEnum
    required: true
    description: >
      Alignment strength. exact/equivalent allow definition inheritance
      (ADR-025 / ADR-026); close/broad/narrow do not.
  source_kind:
    range: ExternalSourceKindEnum
    required: true
    description: Kind of external source (ontology, corp architecture, …).
  external_specification_ref:
    range: uriorcurie
    description: Optional ExternalSpecification / version pin (ADR-020).
  selection_ref:
    range: uriorcurie
    description: Optional ExternalTermSelection id (ADR-020).
  source_entity_ref:
    range: uriorcurie
    required: true
  target_entity_ref:
    range: uriorcurie
    required: true
  source_role:
    range: string
  target_role:
    range: string
  source_min_cardinality:
    range: integer
    minimum_value: 0
  source_max_cardinality:
    range: integer
    minimum_value: 1
  target_min_cardinality:
    range: integer
    minimum_value: 0
  target_max_cardinality:
    range: integer
    minimum_value: 1
  identifying:
    range: boolean
  associative:
    range: boolean
  system_ref:
    range: ITSystem
    inlined: false
    required: true
  qualified_name:
    range: string
    required: true
  technology:
    range: string
  direction:
    range: FlowDirectionEnum
  native_name:
    range: string
    required: true
  native_type:
    range: string
    required: true
  ordinal_position:
    range: integer
    minimum_value: 1
  source_refs:
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  target_refs:
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  mapping_type:
    range: MappingTypeEnum
    required: true
  mapping_cardinality:
    range: MappingCardinalityEnum
    required: true
  transformation_ref:
    range: uri
  transformation_expression:
    range: string
  confidence:
    range: decimal
    minimum_value: 0
    maximum_value: 1
