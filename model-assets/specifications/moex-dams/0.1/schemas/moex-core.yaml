id: https://data.moex.com/dams/core/v0.1
name: moex_core
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
  - moex-types
  - moex-registries
  - moex-governance
  - moex-technical
default_prefix: dams
default_range: string

classes:
  ModelElement:
    abstract: true
    description: "Абстрактный корень иерархии элементов модели: общая идентичность (element_id), имя, описание и жизненный цикл."
    mixins:
      - HasLifecycle
    slots:
      - element_id
      - name
      - title
      - description
      - aliases
      - glossary_term_refs
      - tags

  ModelPackage:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasGovernanceClassification
      - HasPolicyBindings
    description: >
      Версионируемый артефакт модели данных: либо корпоративная conceptual
      модель (enterprise), либо модель конкретного ИТ-решения (solution).
      Package-level DAMS layer is dams_model_level on the SpecImpl envelope
      (ADR-021); implementation_scope here mirrors that body-level semantics.
    slots:
      - api_version
      - model_version
      - implementation_scope
      - conceptual_implementation_ref
      - solution_ref
      - domain_refs
      - imports_refs
      - conceptual_entities
      - domain_contexts
      - logical_entities
      - relationships
      - relation_terms
      - data_carriers
      - access_points
      - data_containers
      - execution_assets
      - mappings

  DomainContext:
    is_a: ModelElement
    mixins:
      - HasOwnership
    description: Ограниченный логический контекст с собственной терминологией и областью ответственности.
    slots:
      - domain_ref
      - solution_ref
      - namespace
      - business_process_refs

  ConceptualEntity:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasBusinessClassification
      - HasDefinition
    description: Корпоративное бизнес-понятие верхнего уровня, независимое от конкретной реализации.
    slots:
      - parent_concept_ref
      - key_attribute_refs
      - entity_tier
      - dependency_kind
      - depends_on_refs
      - genesis_kind
      - external_class_refs
    slot_usage:
      description:
        required: false
        description: >
          Reference definition (skos:definition). Absent means inherit via
          definition_source_ref (ontology class or GlossaryTerm) per ADR-025.

  LogicalEntity:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasBusinessClassification
      - HasGovernanceClassification
      - HasPolicyBindings
      - HasDefinition
    description: Представление бизнес-сущности в доменном контексте и модели конкретного решения.
    slots:
      - context_ref
      - conceptual_entity_refs
      - solution_ref
      - solution_data_role
      - attributes
      - key_attribute_refs
      - invariant_refs
      - identity_rule
      - business_key_kind
      - conceptual_alignment_status
      - alignment_rationale
      - isolation_rationale
    slot_usage:
      description:
        required: false
        description: >
          Reference definition (skos:definition). Absent means inherit from
          conceptual_entity_refs or definition_source_ref per ADR-025.

  LogicalAttribute:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasGovernanceClassification
      - HasPolicyBindings
      - HasDefinition
    description: Логический атрибут сущности с бизнес-смыслом, типом, обязательностью и классификацией.
    slots:
      - owner_entity_ref
      - logical_type
      - required
      - multivalued
      - minimum_cardinality
      - maximum_cardinality
      - value_set_ref
      - format_pattern
      - default_value
      - derived_expression
      - mapping_coverage_status
      - mapping_rationale
      - unit_code
      - currency_attribute_ref
      - timezone_policy
      - temporal_semantics
    slot_usage:
      description:
        required: false
        description: >
          Reference definition (skos:definition). v1 attributes are own-only;
          inheritance from conceptual attributes is out of scope (ADR-025).

  Relationship:
    is_a: ModelElement
    description: Именованная связь между логическими или концептуальными сущностями.
    slots:
      - source_entity_ref
      - target_entity_ref
      - source_role
      - target_role
      - source_min_cardinality
      - source_max_cardinality
      - target_min_cardinality
      - target_max_cardinality
      - identifying
      - associative
      - relationship_kind
      - cardinality_rationale
      - relation_term_ref
      - term_direction

  RelationTerm:
    is_a: ModelElement
    mixins:
      - HasDefinition
    description: >
      Governed dictionary term for a conceptual/logical relationship (ADR-026).
      Provides forward and inverse natural-language labels so a single Relationship
      assertion can be read from either side.
    slots:
      - forward_label
      - forward_label_en
      - inverse_label
      - inverse_label_en
      - symmetric
      - default_relationship_kind
      - ontology_property_ref
    slot_usage:
      description:
        required: false
        description: >
          Reference definition of the relation term (skos:definition). Absent
          means inherit via definition_source_ref per ADR-025.

  ExternalClassRef:
    mixins:
      - HasProvenance
    description: >
      Alignment of a ConceptualEntity to an external class or term (ADR-026).
      Canonical store for conceptual↔external links; Mapping(aligns_with) may
      mirror for ExternalTermSelection projections.
    slots:
      - external_class_ref_id
      - target_ref
      - match_kind
      - source_kind
      - external_specification_ref
      - selection_ref

  PhysicalField:
    is_a: ModelElement
    mixins:
      - HasOwnership
      - HasGovernanceClassification
      - HasPolicyBindings
    description: >
      Поле носителя данных (DataCarrier); семантика задаётся Mapping к
      LogicalAttribute.
    slots:
      - carrier_ref
      - native_name
      - native_type
      - required
      - ordinal_position
      - schema_path
      - mapping_coverage_status
      - mapping_rationale

  Mapping:
    is_a: ModelElement
    mixins:
      - HasProvenance
    description: >
      Явное соответствие между элементами. Discriminate via mapping_type:
      realizes (solution→enterprise conceptual), entity_physical
      (DataCarrier↔LogicalEntity), field_mapping/mapsTo
      (PhysicalField↔LogicalAttribute), aligns_with (enterprise↔external term).
      Not used for SpecImpl implements/conforms_to.
    slots:
      - source_refs
      - target_refs
      - mapping_type
      - mapping_cardinality
      - transformation_ref
      - transformation_expression
      - confidence
      - valid_from
      - valid_to

slots:
  element_id:
    identifier: true
    range: uriorcurie
    required: true
  name:
    range: string
    required: true
  title:
    range: string
  description:
    range: string
    required: true
  aliases:
    range: string
    multivalued: true
  glossary_term_refs:
    range: GlossaryTerm
    multivalued: true
    inlined: false
  tags:
    range: string
    multivalued: true
  api_version:
    range: string
    required: true
  model_version:
    range: SemVer
    required: true
  implementation_scope:
    range: ImplementationScopeEnum
    description: >
      Body-level scope: enterprise (no solution_ref) or solution.
      Must align with envelope dams_model_level when profile is dams-data-model.
  conceptual_implementation_ref:
    range: uriorcurie
    description: >
      Required for solution packages: reference to the enterprise-conceptual
      SpecImpl / ModelPackage id (e.g. moex-enterprise-conceptual-model).
  solution_ref:
    range: ITSolution
    inlined: false
  domain_refs:
    range: BusinessDomain
    multivalued: true
    inlined: false
  imports_refs:
    range: uri
    multivalued: true
  conceptual_entities:
    range: ConceptualEntity
    multivalued: true
    inlined: true
    inlined_as_list: true
  domain_contexts:
    range: DomainContext
    multivalued: true
    inlined: true
    inlined_as_list: true
  logical_entities:
    range: LogicalEntity
    multivalued: true
    inlined: true
    inlined_as_list: true
  relationships:
    range: Relationship
    multivalued: true
    inlined: true
    inlined_as_list: true
  mappings:
    range: Mapping
    multivalued: true
    inlined: true
    inlined_as_list: true
  data_carriers:
    range: DataCarrier
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция носителей данных пакета (Variant B, ADR-031).
  access_points:
    range: AccessPoint
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция точек доступа пакета (Variant B, ADR-031).
  data_containers:
    range: DataContainer
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция контейнеров пакета (Variant B, ADR-031).
  execution_assets:
    range: ExecutionAsset
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Коллекция исполняемых активов пакета (Variant B, ADR-031).
  carrier_ref:
    range: DataCarrier
    inlined: false
    required: true
    description: Носитель данных, которому принадлежит поле.
  domain_ref:
    range: BusinessDomain
    inlined: false
    required: true
  namespace:
    range: uri
    required: true
  business_process_refs:
    range: BusinessProcess
    multivalued: true
    inlined: false
  parent_concept_ref:
    range: ConceptualEntity
    inlined: false
  key_attribute_refs:
    range: uriorcurie
    multivalued: true
  entity_tier:
    range: EntityTierEnum
    description: >
      Structural independence of the conceptual entity (ADR-026). primary =
      independent existence; dependent = requires depends_on_refs.
  dependency_kind:
    range: DependencyKindEnum
    description: >
      Required when entity_tier=dependent. characteristic = part/detail of an
      owner; associative = M:N resolver between owners (ADR-026).
  depends_on_refs:
    range: ConceptualEntity
    multivalued: true
    inlined: false
    description: >
      Owner conceptual entities this dependent entity requires. Empty for
      primary; at least one for dependent (ADR-026).
  genesis_kind:
    range: GenesisKindEnum
    description: >
      external = aligns to ontology/external class(es); native = modelled
      without external parents (ADR-026).
  external_class_refs:
    range: ExternalClassRef
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: >
      Canonical ConceptualEntity → external class/term alignments with
      match_kind (ADR-026). Non-empty iff genesis_kind=external.
  relation_terms:
    range: RelationTerm
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Governed relation-term dictionary for the package (ADR-026).
  context_ref:
    range: DomainContext
    inlined: false
    required: true
  conceptual_entity_refs:
    range: ConceptualEntity
    multivalued: true
    inlined: false
  solution_data_role:
    range: SolutionDataRoleEnum
    required: true
  attributes:
    range: LogicalAttribute
    multivalued: true
    inlined: true
    inlined_as_list: true
  invariant_refs:
    range: Policy
    multivalued: true
    inlined: false
  owner_entity_ref:
    range: LogicalEntity
    inlined: false
    required: true
    description: >
      Structural parent LogicalEntity of this attribute (containment), not the
      data owner role. Data ownership uses data_owner_ref via HasOwnership /
      ADR-023 cascade.
  logical_type:
    range: LogicalDataTypeEnum
    required: true
  required:
    range: boolean
    required: true
  multivalued:
    range: boolean
    required: true
  minimum_cardinality:
    range: integer
    minimum_value: 0
  maximum_cardinality:
    range: integer
    minimum_value: 1
  value_set_ref:
    range: uri
  format_pattern:
    range: string
  default_value:
    range: string
  derived_expression:
    range: string
  identity_rule:
    range: string
    description: >
      Деловое правило идентичности экземпляров сущности в контексте ИТ-решения.
  business_key_kind:
    range: BusinessKeyKindEnum
  conceptual_alignment_status:
    range: ConceptualAlignmentStatusEnum
  alignment_rationale:
    range: string
    description: Обоснование статуса выравнивания с концептуальным уровнем.
  isolation_rationale:
    range: string
    description: Обоснование семантической изоляции сущности (LDM-007).
  mapping_coverage_status:
    range: MappingCoverageStatusEnum
    description: >
      Статус покрытия элемента mapping’ом на соседнем уровне модели
      (logical ↔ physical).
  mapping_rationale:
    range: string
    description: Обоснование для planned / technical-only / not-applicable / inherited.
  unit_code:
    range: string
    description: Код единицы измерения (Wave 2 soft).
  currency_attribute_ref:
    range: uriorcurie
    description: Ссылка на атрибут валюты для денежной величины (Wave 2 soft).
  timezone_policy:
    range: string
    description: Политика часового пояса для timestamp (Wave 2 soft).
  temporal_semantics:
    range: string
    description: Семантика даты/времени (Wave 2 soft).
  relationship_kind:
    range: RelationshipKindEnum
    description: Тип логической связи (Wave 2).
  cardinality_rationale:
    range: string
    description: Обоснование отсутствия кардинальности для draft/imported связей.
  relation_term_ref:
    range: RelationTerm
    inlined: false
    description: >
      Reference to a governed RelationTerm providing forward/inverse labels
      (ADR-026). One Relationship record per pair; labels are derived.
  term_direction:
    range: TermDirectionEnum
    description: >
      Whether this Relationship assertion uses the forward or inverse wording
      of relation_term_ref (ADR-026). Default forward when omitted.
  forward_label:
    range: string
    required: true
    description: Natural-language label source → target (ADR-026).
  forward_label_en:
    range: string
    description: English forward label (ADR-026).
  inverse_label:
    range: string
    description: >
      Natural-language label target → source. Required unless symmetric
      (ADR-026).
  inverse_label_en:
    range: string
    description: English inverse label (ADR-026).
  symmetric:
    range: boolean
    description: >
      When true, forward and inverse labels are the same; inverse_label may
      be omitted (ADR-026).
  default_relationship_kind:
    range: RelationshipKindEnum
    description: Optional default relationship_kind when this term is used.
  ontology_property_ref:
    range: uriorcurie
    description: >
      Optional owl:ObjectProperty IRI. Reserve for future property import;
      not required in v1 (ADR-026 / ADR-024 §7).
  external_class_ref_id:
    identifier: true
    range: uriorcurie
    required: true
  target_ref:
    range: uriorcurie
    required: true
    description: IRI/CURIE of the external class or term (ADR-026).
  match_kind:
    range: ExternalMatchKindEnum
    required: true
    description: >
      Alignment strength. exact/equivalent allow definition inheritance
      (ADR-025 / ADR-026); close/broad/narrow do not.
  source_kind:
    range: ExternalSourceKindEnum
    required: true
    description: Kind of external source (ontology, corp architecture, …).
  external_specification_ref:
    range: uriorcurie
    description: Optional ExternalSpecification / version pin (ADR-020).
  selection_ref:
    range: uriorcurie
    description: Optional ExternalTermSelection id (ADR-020).
  source_entity_ref:
    range: uriorcurie
    required: true
  target_entity_ref:
    range: uriorcurie
    required: true
  source_role:
    range: string
  target_role:
    range: string
  source_min_cardinality:
    range: integer
    minimum_value: 0
  source_max_cardinality:
    range: integer
    minimum_value: 1
  target_min_cardinality:
    range: integer
    minimum_value: 0
  target_max_cardinality:
    range: integer
    minimum_value: 1
  identifying:
    range: boolean
  associative:
    range: boolean
  system_ref:
    range: ITSystem
    inlined: false
    required: true
  qualified_name:
    range: string
    required: true
  technology:
    range: string
  direction:
    range: FlowDirectionEnum
  physical_fields:
    range: PhysicalField
    multivalued: true
    inlined: true
    inlined_as_list: true
  native_name:
    range: string
    required: true
  native_type:
    range: string
    required: true
  ordinal_position:
    range: integer
    minimum_value: 1
  schema_path:
    range: string
  source_refs:
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  target_refs:
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  mapping_type:
    range: MappingTypeEnum
    required: true
  mapping_cardinality:
    range: MappingCardinalityEnum
    required: true
  transformation_ref:
    range: uri
  transformation_expression:
    range: string
  confidence:
    range: decimal
    minimum_value: 0
    maximum_value: 1
