id: https://data.moex.com/dams/constraint-matrix/v0.1
name: moex_constraint_matrix
title: DAMS executable constraint matrix schema
version: 0.1.0
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dams: https://data.moex.com/dams/
imports:
  - linkml:types
default_prefix: dams
default_range: string

classes:
  ConstraintMatrix:
    tree_root: true
    description: >-
      Реестр исполняемых инвариантов модели (ADR-045). Текст инварианта
      хранится здесь; схемы и документы ссылаются на INV-NNN.
    slots:
      - matrix_id
      - title
      - description
      - baseline
      - invariant_id_registry
      - invariants

  ConstraintBaseline:
    description: >-
      Точный перечень LinkML rules на момент инвентаризации (файл, класс,
      индекс), привязанный к SHA коммита и sha256 канонического списка.
    slots:
      - baseline_commit
      - rules_sha256
      - rules

  BaselineRuleRef:
    description: Одна запись baseline — позиция rules[] в схеме.
    slots:
      - schema_file
      - class_name
      - rule_index
      - inv_id

  Invariant:
    description: Одна запись матрицы инвариантов.
    slots:
      - id
      - title
      - statement
      - source
      - source_status
      - scope
      - levels
      - severity
      - status
      - level_status
      - waiver_reason
      - adr_ref
      - requirement_refs
      - notes
      - implementation
      - tests

  LevelStatusMap:
    description: >-
      Статус по каждому уровню. Общий status вычисляется из level_status
      (PR-C3b); ручное расхождение — ошибка checker.
    slots:
      - L1
      - L2
      - L3

  InvariantImplementation:
    description: Указатели на реализацию по уровням (пути/коды; без дублирования текста).
    slots:
      - linkml_rule
      - dams_validator
      - shacl

  LinkmlRuleRef:
    description: Ссылка на существующий блок rules в схеме DAMS.
    slots:
      - schema_file
      - class_name
      - rule_index

  InvariantTests:
    description: Пути к valid/invalid примерам по уровням (заполняются с PR-C2).
    slots:
      - l1_positive
      - l1_valid
      - l1_invalid
      - l2_valid
      - l2_invalid
      - l3_valid
      - l3_invalid

enums:
  InvariantStatusEnum:
    permissible_values:
      planned:
        description: Ещё не написано в схеме/коде.
      implemented-untested:
        description: Реализация есть, негативного теста нет.
      implemented:
        description: Реализация и негативный тест на каждом заявленном уровне.
      waived:
        description: Сознательно не проверяется; обязателен waiver_reason и adr_ref.
      not-applicable:
        description: Уровень не заявлен в levels (только в level_status).

  InvariantLevelEnum:
    permissible_values:
      L1:
        description: LinkML rules
      L2:
        description: DAMS Python validators
      L3:
        description: SHACL

  InvariantSeverityEnum:
    permissible_values:
      error:
      warning:

  SourceStatusEnum:
    permissible_values:
      aligned:
        description: Правило совпадает с цитируемым источником.
      partial:
        description: Источник тоньше правила или только description слота.
      divergent:
        description: Источник и правило расходятся.

  L1PositiveStatusEnum:
    permissible_values:
      ok:
        description: Положительный L1-пример удовлетворим и принимается.
      not_satisfiable:
        description: Положительный L1-пример невозможен из-за дефекта генератора/правила.

  InvariantScopeEnum:
    permissible_values:
      moex-dams:
        description: Схемы DAMS (основной охват матрицы).
      moex-dsp:
        description: DSP (вне текущего охвата реализации).
      moex-external-alignment:
        description: External alignment (вне текущего охвата реализации).
      repository:
        description: >
          Cross-document / manifest-scoped checks (e.g. global element_id
          uniqueness across indexed packages).

slots:
  matrix_id:
    identifier: true
    range: uriorcurie
    required: true
  title:
    range: string
    required: true
  description:
    range: string
  baseline:
    range: ConstraintBaseline
    required: false
    inlined: true
    description: >-
      Deprecated after PR-C5; INV-prefix check replaces baseline pin.
      Kept optional for historical matrices.
  invariant_id_registry:
    range: string
    multivalued: true
    required: true
    description: >-
      Append-only list of INV-NNN ever published. Removal requires moving the
      id to a waived/retired note with adr_ref (checker enforces subset).
  invariants:
    range: Invariant
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: true
  baseline_commit:
    range: string
    required: true
    description: Полный SHA коммита, на котором зафиксирован перечень rules.
  rules_sha256:
    range: string
    required: true
    pattern: '^[0-9a-f]{64}$'
    description: sha256 канонического списка schema_file|class_name|rule_index (LF).
  rules:
    range: BaselineRuleRef
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: true
  schema_file:
    range: string
    required: true
  class_name:
    range: string
    required: true
  rule_index:
    range: integer
    required: true
    minimum_value: 0
  inv_id:
    range: string
    required: true
    pattern: '^INV-[0-9]{3}$'
  id:
    identifier: true
    range: string
    required: true
    pattern: '^INV-[0-9]{3}$'
  statement:
    range: string
    required: true
  source:
    range: string
    required: true
    description: Ссылка на ADR, раздел или description (не полный текст инварианта).
  source_status:
    range: SourceStatusEnum
    required: true
  scope:
    range: InvariantScopeEnum
    required: true
  levels:
    range: InvariantLevelEnum
    multivalued: true
    required: true
  severity:
    range: InvariantSeverityEnum
    required: true
    ifabsent: string(error)
  status:
    range: InvariantStatusEnum
    required: true
    description: >-
      Агрегат по level_status. Должен совпадать с compute_overall_status().
  level_status:
    range: LevelStatusMap
    inlined: true
    required: true
  L1:
    range: InvariantStatusEnum
    required: true
  L2:
    range: InvariantStatusEnum
    required: true
  L3:
    range: InvariantStatusEnum
    required: true
  waiver_reason:
    range: string
  adr_ref:
    range: string
    description: Ссылка на ADR при status/level_status waived (обязательна для waived).
  requirement_refs:
    range: string
    multivalued: true
    description: Коды DAMS-REQ-* / PDM-* из каталога ADR-013, если есть.
  notes:
    range: string
  implementation:
    range: InvariantImplementation
    inlined: true
  linkml_rule:
    range: LinkmlRuleRef
    inlined: true
  dams_validator:
    range: string
    description: Модуль:символ или путь к L2-проверке.
  shacl:
    range: string
    description: Путь к ручной SHACL-форме (PR-C4).
  tests:
    range: InvariantTests
    inlined: true
  l1_positive:
    range: L1PositiveStatusEnum
    description: >-
      Статус положительного L1-примера. not_satisfiable — правило в схеме есть,
      но валидный экземпляр, удовлетворяющий postcondition, JSON Schema отклоняет
      (дефект генератора; см. INV-001).
  l1_valid:
    range: string
    multivalued: true
  l1_invalid:
    range: string
    multivalued: true
  l2_valid:
    range: string
    multivalued: true
  l2_invalid:
    range: string
    multivalued: true
  l3_valid:
    range: string
    multivalued: true
  l3_invalid:
    range: string
    multivalued: true
