invariants:
  - id: INV-001
    title: ConceptualProperty identifying → is_identifying
    statement: Если property_kind = identifying, то is_identifying должен быть задан
      как true.
    source: ADR-034:58; slot is_identifying
    source_status: aligned
    scope: moex-dams
    levels: [L2, L3]
    severity: error
    status: implemented-untested
    notes: 'В схеме есть L1 rule, но equals_string на boolean дефектен в JSON Schema
      (см. linkml-rules-support §3.1); целевые уровни L2+L3. PR-C2: valid fixture
      uses base instance (satisfy unsatisfiable due to boolean equals_string). l1_positive=not_satisfiable;
      не чинить L1 (остаётся L2+L3); дефект генератора — отдельный issue. PR-C3: L2
      DAMS-INV-001 в check_identifying_requires_is_identifying; unit-тесты в
      test_invariant_l2.py. L3 — PR-C4.'
    implementation:
      linkml_rule:
        schema_file: moex-core.yaml
        class_name: ConceptualProperty
        rule_index: 0
      dams_validator: moex_dams.rules.semantic_layer.check_identifying_requires_is_identifying
    tests:
      l1_valid: [model-assets/specifications/moex-dams/0.1/examples/invariants/INV-001.valid.yaml]
      l1_invalid: [
            model-assets/specifications/moex-dams/0.1/examples/invariants/INV-001.invalid.yaml]
      l1_positive: not_satisfiable
      l2_valid: [packages/specification-dams/tests/test_invariant_l2.py]
      l2_invalid: [packages/specification-dams/tests/test_invariant_l2.py]
