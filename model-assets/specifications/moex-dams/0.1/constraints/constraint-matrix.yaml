  scope: moex-dams
  levels: [L1, L2, L3]
  severity: error
  status: implemented
  notes: 'PR-C4a: schema_format other allowed with schema_dialect (AsyncAPI Multi Format Schema / ADR-038).
    L1+L2 widened together.'
