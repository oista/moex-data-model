matrix_id: dams:constraint-matrix/0.1
title: MOEX DAMS executable constraint matrix
description: Реестр инвариантов ADR-045. Тексты только здесь; схемы и документы ссылаются на INV-NNN.
invariants:
- id: INV-001
  title: ConceptualProperty identifying → is_identifying
  statement: Если property_kind = identifying, то is_identifying должен быть задан как true.
  source: ADR-034:58; slot is_identifying
  source_status: aligned
  scope: moex-dams
  levels:
  - L1
  - L2
  - L3
  severity: error
  status: implemented
  notes: 'L1 waived (boolean equals_string defect). L2 DAMS-INV-001 + fixtures; L3 — PR-C4b.'
  implementation:
    linkml_rule:
      schema_file: moex-core.yaml
      class_name: ConceptualProperty
      rule_index: 0
    dams_validator: moex_dams.rules.semantic_layer.check_identifying_requires_is_identifying
    shacl: model-assets/specifications/moex-dams/0.1/constraints/shacl/manual/invariants.ttl
  tests:
    l1_valid: [model-assets/specifications/moex-dams/0.1/examples/invariants/INV-001.valid.yaml]
    l1_invalid: [model-assets/specifications/moex-dams/0.1/examples/invariants/INV-001.invalid.yaml]
    l1_positive: not_satisfiable
    l2_valid:
    - model-assets/specifications/moex-dams/0.1/examples/invariants/l2/INV-001.valid.yaml
    l2_invalid:
    - model-assets/specifications/moex-dams/0.1/examples/invariants/l2/INV-001.invalid.yaml
    l3_valid:
    - model-assets/specifications/moex-dams/0.1/examples/invariants/l3/INV-001.valid.ttl
    l3_invalid:
    - model-assets/specifications/moex-dams/0.1/examples/invariants/l3/INV-001.invalid.ttl
  level_status:
    L1: waived
    L2: implemented
    L3: implemented
  waiver_reason: L1 LinkML rule uses equals_string on boolean is_identifying; JSON Schema emits const:"true"
    and rejects valid instances (linkml-rules-support §3.1). Covered by L2/L3.
  adr_ref: ADR-045
