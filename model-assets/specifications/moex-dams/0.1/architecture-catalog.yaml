# Architecture navigation catalog for Publication Viewer.
# Roles: reference_specification | specification_implementation
# ModelingStandard is intentionally omitted from the tree (label only via expressed_in).
kind: architecture_catalog
version: "1"
nodes:
  - id: moex-dams
    role: reference_specification
    title: moex.dams
    version: "0.1"
    expressed_in: LinkML
    module_id: moex:module:dams
    order: 100
    description: >
      MOEX DAMS 0.1 reference specification (LinkML) - publication projection
      of the schema body (TSpecBody).

  - id: moex-dsp
    role: specification_implementation
    title: moex.dsp
    version: "0.1"
    conforms_to: moex-dams
    module_id: moex:module:dsp
    order: 105
    contract_exempt: true
    description: >
      Metamodel of Data Specification Player (publication projection).
      Not a DAMS logical-model Impl — publication profile is linkml-specification.

  - id: trading-solution
    role: specification_implementation
