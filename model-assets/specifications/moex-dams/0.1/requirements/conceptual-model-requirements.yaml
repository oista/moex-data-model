catalog_id: dams:req-catalog/conceptual-model/0.1
name: conceptual_model_requirements
requirements:
  - element_id: dams:req/CM-GEN-001
    name: conceptual_package_identity
    title: Идентичность пакета концептуальной модели
    description: Обязательные поля корня ModelPackage для enterprise-conceptual.
    lifecycle_status: draft
    code: CM-GEN-001
    requirement_level: conceptual_model
    requirement_section: GEN
    statement: >-
      У каждой корпоративной концептуальной модели должен быть стабильный
      идентификатор пакета, человекочитаемое имя, краткое описание, статус
      жизненного цикла, версия API схемы и семантическая версия модели.
      Без этих полей пакет не принимается валидатором.
    formal_checks:
      - check_id: CM-GEN-001.c1
        kind: slot_required
        target_class: ModelPackage
        target_slot: element_id
        severity: error
        diagnostic_code: DAMS-STRUCT-001
      - check_id: CM-GEN-001.c2
        kind: slot_required
        target_class: ModelPackage
        target_slot: name
        severity: error
        diagnostic_code: DAMS-STRUCT-002
      - check_id: CM-GEN-001.c3
        kind: slot_required
        target_class: ModelPackage
        target_slot: description
        severity: error
      - check_id: CM-GEN-001.c4
        kind: slot_required
        target_class: ModelPackage
        target_slot: lifecycle_status
        severity: error
      - check_id: CM-GEN-001.c5
        kind: slot_required
        target_class: ModelPackage
        target_slot: api_version
        severity: error
      - check_id: CM-GEN-001.c6
        kind: slot_required
        target_class: ModelPackage
        target_slot: model_version
        severity: error

  - element_id: dams:req/CM-GEN-002
    name: conceptual_implementation_scope
    title: Область enterprise-conceptual
    description: >
      Пакет концептуальной модели должен иметь implementation_scope: enterprise
      и не ссылаться на конкретное ИТ-решение.
    lifecycle_status: proposed
    code: CM-GEN-002
    requirement_level: conceptual_model
    requirement_section: GEN
    statement: >-
      Корпоративная концептуальная модель (ADR-021) объявляет
      implementation_scope = enterprise. Поле solution_ref должно отсутствовать:
      модель не привязана к конкретному ИТ-решению.
    formal_checks:
      - check_id: CM-GEN-002.c1
        kind: slot_required
        target_class: ModelPackage
        target_slot: implementation_scope
        severity: error
        diagnostic_code: DAMS-LEVEL-002

  - element_id: dams:req/CM-CON-001
    name: conceptual_entity_core
    title: Концептуальная сущность
    description: Обязательные поля ConceptualEntity.
    lifecycle_status: approved
    code: CM-CON-001
    requirement_level: conceptual_model
    requirement_section: GEN
    statement: >-
      Каждая концептуальная сущность должна иметь стабильный element_id,
      имя, описание и статус жизненного цикла. Концептуальный уровень —
      source of truth для корпоративных бизнес-понятий (не таблиц решения).
    formal_checks:
      - check_id: CM-CON-001.c1
        kind: slot_required
        target_class: ConceptualEntity
        target_slot: element_id
        severity: error
      - check_id: CM-CON-001.c2
        kind: slot_required
        target_class: ConceptualEntity
        target_slot: name
        severity: error
      - check_id: CM-CON-001.c3
        kind: slot_required
        target_class: ConceptualEntity
        target_slot: description
        severity: error
      - check_id: CM-CON-001.c4
        kind: slot_required
        target_class: ConceptualEntity
        target_slot: lifecycle_status
        severity: error

  - element_id: dams:req/CM-REF-001
    name: conceptual_relationship_endpoints
    title: Концы связей концептуальных сущностей
    description: Обязательные концы Relationship на концептуальном уровне.
    lifecycle_status: draft
    code: CM-REF-001
    requirement_level: conceptual_model
    requirement_section: REF
    statement: >-
      Именованная связь между концептуальными сущностями должна явно указывать
      исходную и целевую сущность. Обе ссылки должны указывать на элементы,
      присутствующие в том же пакете модели.
    formal_checks:
      - check_id: CM-REF-001.c1
        kind: slot_required
        target_class: Relationship
        target_slot: source_entity_ref
        severity: error
        diagnostic_code: DAMS-REF-005
      - check_id: CM-REF-001.c2
        kind: slot_required
        target_class: Relationship
        target_slot: target_entity_ref
        severity: error
        diagnostic_code: DAMS-REF-006
      - check_id: CM-REF-001.c3
        kind: ref_resolves
        target_class: Relationship
        target_slot: source_entity_ref
        severity: error
        diagnostic_code: DAMS-REF-005
      - check_id: CM-REF-001.c4
        kind: ref_resolves
        target_class: Relationship
        target_slot: target_entity_ref
        severity: error
        diagnostic_code: DAMS-REF-006

  - element_id: dams:req/CM-CON-002
    name: conceptual_entity_tier
    title: Уровень концептуальной сущности (primary/dependent)
    description: >
      Structural independence of ConceptualEntity (ADR-026). Implemented by
      check_conceptual_entities (warning during transitional period when tier
      is omitted; errors when tier is declared inconsistently).
    lifecycle_status: proposed
    code: CM-CON-002
    requirement_level: conceptual_model
    requirement_section: GEN
    statement: >-
      Каждая концептуальная сущность должна иметь entity_tier: primary
      (независимое существование) или dependent (не существует без владельцев
      в depends_on_refs). Для dependent обязателен dependency_kind
      (characteristic | associative). Граф depends_on ацикличен. Наличие FK
      в ER-схеме само по себе не делает сущность dependent.
    formal_checks:
      - check_id: CM-CON-002.c1
        kind: custom
        target_class: ConceptualEntity
        target_slot: entity_tier
        severity: warning
        diagnostic_code: DAMS-CM-TIER
        description: >
          Validated by check_conceptual_entities (ADR-026). Transitional:
          missing entity_tier is tolerated; inconsistent declarations error.

  - element_id: dams:req/CM-CON-003
    name: conceptual_entity_genesis
    title: Генезис концептуальной сущности (external/native)
    description: >
      Genesis and external_class_refs (ADR-026). external ⇔ ≥1
      external_class_refs; native ⇔ empty. match_kind drives ADR-025 exactness.
    lifecycle_status: approved
    code: CM-CON-003
    requirement_level: conceptual_model
    requirement_section: GEN
    statement: >-
      Концептуальная сущность либо выравнивается на внешний класс/термин
      (genesis_kind=external с external_class_refs и match_kind), либо является
      собственной моделью MOEX (genesis_kind=native без внешних ссылок).
      Каноническое хранение выравнивания — external_class_refs; Mapping
      aligns_with может дублировать для ExternalTermSelection.
    formal_checks:
      - check_id: CM-CON-003.c1
        kind: custom
        target_class: ConceptualEntity
        target_slot: genesis_kind
        severity: warning
        diagnostic_code: DAMS-CM-GENESIS
        description: >
          Validated by check_conceptual_entities (ADR-026). Transitional:
          missing genesis_kind with no external refs is tolerated as native.

  - element_id: dams:req/CM-REF-002
    name: conceptual_relation_term
    title: Термин связи концептуальных сущностей
    description: >
      RelationTerm dictionary with forward/inverse labels (ADR-026). One
      Relationship record per pair; labels derived from the term.
    lifecycle_status: approved
    code: CM-REF-002
    requirement_level: conceptual_model
    requirement_section: REF
    statement: >-
      Именованная связь на концептуальном уровне ссылается на термин из
      справочника RelationTerm с прямой и обратной формулировкой
      (forward_label / inverse_label). Одна запись Relationship на пару;
      подписи с обеих сторон вычисляются. Для active связей enterprise-модели
      отсутствие relation_term_ref — предупреждение на переходный период.
    formal_checks:
      - check_id: CM-REF-002.c1
        kind: custom
        target_class: Relationship
        target_slot: relation_term_ref
        severity: warning
        diagnostic_code: DAMS-CM-RELTERM
        description: >
          Validated by check_relation_terms (ADR-026). Transitional warning
          when active enterprise relationships lack relation_term_ref.

  - element_id: dams:req/CM-PDM-000
    name: conceptual_no_physical
    title: Запрет технического слоя
    description: >
      Enterprise-conceptual пакет не содержит коллекций TechnicalAsset (data_carriers / access_points /
      data_containers / execution_assets) (ADR-021 / ADR-031).
    lifecycle_status: approved
    code: CM-PDM-000
    requirement_level: conceptual_model
    requirement_section: PDM
    statement: >-
      В корпоративной концептуальной модели технические активы (носители данных,
      точки доступа, контейнеры, исполняемые активы) запрещены. Технический слой
      описывается только в solution-реализациях, которые realize концептуальные сущности.
    formal_checks:
      - check_id: CM-PDM-000.c1
        kind: custom
        target_class: ModelPackage
        target_slot: data_carriers
        severity: error
        diagnostic_code: DAMS-LEVEL-003
        description: >
          technical-asset collections
          (data_carriers, access_points, data_containers, execution_assets)
          must be absent or empty for implementation_scope: enterprise.

  - element_id: dams:req/CM-PROP-001
    name: conceptual_property_enterprise_only
    title: ConceptualProperty только в enterprise
    description: >
      Реализовано в semantic_layer (DAMS-SEM-PROP-SCOPE). Значимые свойства КМД
      не размещаются в solution-пакетах (ADR-034).
    lifecycle_status: approved
    code: CM-PROP-001
    requirement_level: conceptual_model
    requirement_section: LDM
    statement: >
      ConceptualProperty и ConceptualDomain допустимы только в пакетах
      implementation_scope=enterprise. У ConceptualProperty обязательны
      significance_basis и property_owner_entity_ref.
    formal_checks:
      - check_id: CM-PROP-001.c1
        kind: custom
        target_class: ConceptualProperty
        severity: error
        diagnostic_code: DAMS-SEM-PROP-SCOPE
        description: Validated by check_semantic_layer (ADR-034).
