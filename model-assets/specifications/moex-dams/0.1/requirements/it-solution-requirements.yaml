catalog_id: dams:req-catalog/it-solution/0.1
name: it_solution_requirements
requirements:
- element_id: dams:req/LDM-101
  name: conceptual_alignment
  title: Связь с корпоративными понятиями
  description: >
    Local extension (ADR-013 `{SECTION}-1NN`). Same checks as former LDM-006;
    diagnostic DAMS-REQ-LDM-006.c1 stays stable.
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-101
  obligation: mandatory
  responsible_role: data_architecture
  requirement_level: it_solution
  requirement_section: LDM
  statement: 'Логическая сущность должна быть прослеживаемо связана с корпоративным понятием либо иметь допустимый статус
    выравнивания с обоснованием: «ожидает решения», «только локальный смысл» или «не применимо» (только для технических сущностей).
    Ссылка на корпоративное понятие и пояснение характера реализации могут присутствовать одновременно.'
  applies_to:
    applicability_id: appl:LDM-101
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-101.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm006_alignment
    severity: error
    diagnostic_code: DAMS-REQ-LDM-006.c1
    remediation: Укажите conceptual_entity_refs (aligned) либо conceptual_alignment_status с alignment_rationale (pending/local-only;
      not-applicable только для technical).
- element_id: dams:req/REF-002
  name: relationship_cardinality
  title: Кардинальность связи
  description: Four cardinality slots when active.
  lifecycle_status: approved
  code: REF-002
  obligation: recommended
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: REF
  statement: У активной логической связи должны быть заданы минимальная и максимальная кардинальность с обеих сторон. Для
    черновика допускается незаполненность только при соответствующем статусе жизненного цикла и кратком обосновании.
  applies_to:
    applicability_id: appl:REF-002
    applies_target_class: Relationship
  formal_checks:
  - check_id: REF-002.c1
    kind: conditional_branch
    target_class: Relationship
    expression: ref002_cardinality
    severity: warning
    diagnostic_code: DAMS-REQ-REF-002.c1
    remediation: Задайте source/target min и max cardinality либо для draft укажите cardinality_rationale.
- element_id: dams:req/LDM-01
  name: logical_model_at_it_solution
  title: ЛМД на уровне ИТ-решения
  description: >
    ADR-056 backbone LDM-01. GEN-002 scope plus ≥1 LogicalEntity (PR-10c).
    Physical-only packages do not satisfy the logical-model floor.
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-01
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: Логическая модель данных (ЛМД) определена на уровне ИТ-решения
  applies_to:
    applicability_id: appl:LDM-01
    applies_target_class: ModelPackage
  formal_checks:
  - check_id: LDM-01.c1
    kind: slot_required
    target_class: ModelPackage
    target_slot: solution_ref
    severity: error
    diagnostic_code: DAMS-REQ-GEN-002.c1
    remediation: Укажите solution_ref на ИТ-решение из EAM.
  - check_id: LDM-01.c2
    kind: conditional_branch
    target_class: ModelPackage
    expression: implementation_scope_solution
    severity: error
    diagnostic_code: DAMS-REQ-GEN-002.c2
    remediation: Установите implementation_scope в значение solution.
  - check_id: LDM-01.c3
    kind: conditional_branch
    target_class: ModelPackage
    expression: ldm01_has_logical_entity
    severity: error
    diagnostic_code: DAMS-REQ-LDM-01.c3
    remediation: Добавьте хотя бы одну логическую сущность.
- element_id: dams:req/LDM-02
  name: logical_model_spec_version
  title: Соответствие спецификации и версия
  description: >
    ADR-056 backbone LDM-02. Checks deferred to PR-5 (from GEN-001.c5).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-02
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    ЛМД соответствует актуальной версии принятой спецификации. Версия спецификации
    указана в описании модели
  applies_to:
    applicability_id: appl:LDM-02
    applies_target_class: ModelPackage
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-02.c1
    kind: slot_required
    target_class: ModelPackage
    target_slot: api_version
    severity: error
    remediation: Укажите api_version схемы.
    diagnostic_code: DAMS-REQ-GEN-001.c5
- element_id: dams:req/LDM-03
  name: model_registered_in_data_catalog
  title: Регистрация модели в Дата-каталоге
  description: >
    ADR-056 backbone LDM-03. Manual by decision (PR-7): no catalog-registration slot in the schema;
    registration in the Data Catalog is an organisational fact outside the model.
  lifecycle_status: approved
  implementation_status: not_started
  code: LDM-03
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: Модель ИТ-решения зарегистрирована в Дата-каталоге
  applies_to:
    applicability_id: appl:LDM-03
    applies_target_class: ModelPackage
    applies_implementation_scope: solution
  formal_checks: []
- element_id: dams:req/LDM-04
  name: logical_entity_business_definition
  title: Определение бизнес-термина сущности ЛМД
  description: >
    ADR-056 backbone LDM-04. «Определение бизнес-термина глоссария» — эффективное
    определение элемента (own description / definition_source_ref / cascade);
    глоссарий — представление, не обязательная соседняя запись термина (ADR-025).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-04
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД должно быть внесено определение бизнес-термина глоссария,
    раскрывающее его смысл, применительно к описываемому ИТ-решению (включая ссылку
    на нормативную документацию, при её наличии)
  applies_to:
    applicability_id: appl:LDM-04
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-04.c1
    kind: definition_resolvable
    target_class: LogicalEntity
    severity: error
    remediation: >
      Задайте description (own), либо definition_source_ref / единственный
      conceptual_entity_refs для наследования эталонного определения (ADR-025).
    diagnostic_code: DAMS-REQ-LDM-002.c3
- element_id: dams:req/LDM-05
  name: logical_entity_attributes_complete
  title: Атрибуты сущности ЛМД
  description: >
    ADR-056 backbone LDM-05. Checks deferred to PR-5 (from LDM-005 floor).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-05
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД описаны атрибуты, необходимые для однозначного представления
    её бизнес-смысла, идентификации, характеристик, состояния и участия в предусмотренных
    бизнес-процессах
  applies_to:
    applicability_id: appl:LDM-05
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-05.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm005_attributes
    severity: error
    diagnostic_code: DAMS-REQ-LDM-005.c1
    remediation: Добавьте хотя бы один атрибут либо для technical укажите isolation_rationale или alignment_rationale.
- element_id: dams:req/LDM-06
  name: logical_entity_unique_identifier
  title: Уникальный идентификатор сущности ЛМД
  description: >
    ADR-056 backbone LDM-06. Identifier is key_attribute_refs (not identity_rule
    prose). Surrogate still needs identity_rule explaining why there is no
    business/natural key. Distinct from Group B LDM-101 (was LDM-006).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-06
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД определен состав атрибутов уникального идентификатора.
    Приоритетный порядок выбора идентификатора – бизнес ключ, натуральный ключ,
    суррогатный ключ (при отсутствии перечисленных выше альтернатив)
  applies_to:
    applicability_id: appl:LDM-06
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-06.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm06_identifier
    severity: error
    diagnostic_code: DAMS-REQ-LDM-06.c1
    remediation: >
      Укажите key_attribute_refs (состав уникального идентификатора).
      Для суррогатного ключа добавьте identity_rule — почему нет бизнес-ключа
      или натурального ключа.
- element_id: dams:req/LDM-07
  name: logical_base_relationship_kinds
  title: Базовые типы связей ЛМД
  description: >
    ADR-056 backbone LDM-07. Checks deferred to PR-5 (from REF-003).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-07
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Полностью описаны существующие базовые типы связей между сущностями —
    «Входит в состав», «Является разновидностью», «Ссылается на справочник»
  applies_to:
    applicability_id: appl:LDM-07
    applies_target_class: Relationship
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-07.c1
    kind: conditional_branch
    target_class: Relationship
    expression: ref003_kind_soft
    severity: error
    diagnostic_code: DAMS-REQ-REF-003.c1
    remediation: Укажите relationship_kind для активной связи (composition / specialization / reference и др. по справочнику).
- element_id: dams:req/LDM-08
  name: logical_other_relationship_kinds
  title: Остальные типы связей ЛМД
  description: >-
    ADR-056 backbone LDM-08. Typing of non-base kinds is covered by LDM-07 relationship_kind once present; no separate executable
    check yet.
  lifecycle_status: approved
  implementation_status: not_started
  code: LDM-08
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    В дополнение к описанию базовых типов связей между сущностями ЛМД, описаны
    остальные типы связей (согласно справочнику типов)
  applies_to:
    applicability_id: appl:LDM-08
    applies_target_class: Relationship
    applies_implementation_scope: solution
  formal_checks: []
- element_id: dams:req/LDM-09
  name: logical_entity_data_class
  title: Класс данных сущности ЛМД
  description: >
    ADR-056 backbone LDM-09. data_class is on the entity or on every attribute
    (inline cascade, PR-7).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-09
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД указан Класс данных. В случае смешанной классификации
    сущности — Класс данных указан для её атрибутов
  applies_to:
    applicability_id: appl:LDM-09
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-09.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm09_data_class
    severity: error
    remediation: >
      Укажите data_class на сущности либо на каждом её атрибуте
      (смешанная классификация).
    diagnostic_code: DAMS-REQ-LDM-003.c2
- element_id: dams:req/LDM-10
  name: logical_entity_confidentiality_class
  title: Класс конфиденциальности сущности ЛМД
  description: >
    ADR-056 backbone LDM-10. Checks deferred to PR-5 (from LDM-003.c4).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-10
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД указан Класс конфиденциальности данных. В случае
    смешанной классификации сущности — Класс конфиденциальности указан для её атрибутов
  applies_to:
    applicability_id: appl:LDM-10
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-10.c1
    kind: slot_required
    target_class: LogicalEntity
    target_slot: governance_classification
    effective: true
    severity: error
    remediation: Укажите governance_classification на сущности либо наследуйте от пакета (ADR-023 containment cascade).
    diagnostic_code: DAMS-REQ-LDM-003.c4
- element_id: dams:req/LDM-11
  name: logical_entity_data_owner
  title: Владелец данных сущности ЛМД
  description: >
    ADR-056 backbone LDM-11. Checks deferred to PR-5 (from GEN-001.c7 / LDM-002.c5).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-11
  obligation: mandatory
  responsible_role: business_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД указан владелец данных. В случае нескольких владельцев —
    владелец указан для атрибутов сущности
  applies_to:
    applicability_id: appl:LDM-11
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-11.c1
    kind: slot_required
    target_class: ModelPackage
    target_slot: data_owner_ref
    severity: error
    diagnostic_code: DAMS-REQ-GEN-001.c7
    remediation: Укажите data_owner_ref на пакете модели (корень containment cascade, ADR-023). ownership_inheritance_rule
      — только пояснение, не замена владельца.
  - check_id: LDM-11.c2
    kind: at_least_one_slots
    target_class: LogicalEntity
    target_slots:
    - data_owner_ref
    - data_steward_ref
    effective: true
    severity: error
    diagnostic_code: DAMS-REQ-LDM-002.c5
    remediation: Укажите data_owner_ref или data_steward_ref на сущности либо наследуйте от пакета (ADR-023 containment cascade).
- element_id: dams:req/LDM-12
  name: logical_entity_source_system
  title: Система-источник сущности ЛМД
  description: >
    ADR-056 backbone LDM-12. source_system_refs is on the entity or on every attribute
    (inline cascade, PR-7).
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-12
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД указана система-источник. При различии источников
    отдельных атрибутов источники указаны на уровне соответствующих атрибутов
  applies_to:
    applicability_id: appl:LDM-12
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-12.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm12_source_system
    severity: error
    remediation: >
      Укажите source_system_refs на сущности либо на каждом её атрибуте
      (разные источники).
    diagnostic_code: DAMS-REQ-LDM-12.c1
- element_id: dams:req/LDM-13
  name: logical_entity_iod_classification
  title: Классификация ИОД сущности ЛМД
  description: >
    ADR-056 backbone LDM-13 (recommended). Maps to sensitivity_term_refs (entity/attribute);
    stays manual until an ИОД vocabulary / severity order exists (P2-BACKLOG F4-1).
  lifecycle_status: approved
  implementation_status: not_started
  code: LDM-13
  obligation: recommended
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: LDM
  statement: >
    Для каждой сущности ЛМД указана Классификация ИОД. В случае смешанной классификации –
    указывается более высокая степень чувствительности, либо размечаются отдельные атрибуты
  applies_to:
    applicability_id: appl:LDM-13
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks: []
- element_id: dams:req/PDM-01
  name: physical_integration_provider_coverage
  title: Покрытие ФМД поставщика в интеграциях
  description: >
    ADR-056 backbone PDM-01. Checks deferred to PR-5 (from FLW-001). Distinct from
    legacy PDM-001 (DataCarrier core slots; Group C).
  lifecycle_status: approved
  implementation_status: implemented
  code: PDM-01
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: PDM
  statement: >
    В ФМД описаны все сущности и атрибуты, через которые ИТ-решение выступает
    поставщиком данных в интеграциях
  applies_to:
    applicability_id: appl:PDM-01
    applies_target_class: ModelPackage
    applies_implementation_scope: solution
  formal_checks:
  - check_id: PDM-01.c1
    kind: conditional_branch
    target_class: ModelPackage
    expression: flw001_soft_presence
    severity: warning
    diagnostic_code: DAMS-REQ-FLW-001.c1
    remediation: При межрешенческих обменах добавьте описание потоков данных; иначе предупреждение можно игнорировать до калибровки.
- element_id: dams:req/PDM-02
  name: physical_to_logical_attribute_link
  title: Связь атрибута ФМД с атрибутом ЛМД
  description: >
    ADR-056 backbone PDM-02. Checks deferred to PR-5 (from PDM-003 / PDM-004).
    Distinct from legacy PDM-002 (SchemaNode core; Group C).
  lifecycle_status: approved
  implementation_status: implemented
  code: PDM-02
  obligation: mandatory
  responsible_role: it_owner
  requirement_level: it_solution
  requirement_section: PDM
  statement: >
    Для каждого атрибута сущности ФМД, несущего бизнес-смысл, указана связь
    с атрибутом сущности ЛМД
  applies_to:
    applicability_id: appl:PDM-02
    applies_target_class: DataCarrier
    applies_target_kinds:
    - relational_table
    - relational_view
    - file
    - dataset
    - stream_topic
    - stream_queue
    - api_resource
    - other
  formal_checks:
  - check_id: PDM-02.c1
    kind: conditional_branch
    target_class: DataCarrier
    expression: pdm003_entity_physical
    severity: error
    diagnostic_code: DAMS-REQ-PDM-003.c1
    remediation: Добавьте Mapping с mapping_type entity_physical между этим носителем и ≥1 логической сущностью, либо technical-only
      + mapping_rationale.
  - check_id: PDM-02.c2
    kind: conditional_branch
    target_class: SchemaNode
    expression: pdm004_field_mapping
    severity: error
    diagnostic_code: DAMS-REQ-PDM-004.c1
    remediation: Добавьте field_mapping (и при необходимости transformation_expression) либо mapping_coverage_status с mapping_rationale.
