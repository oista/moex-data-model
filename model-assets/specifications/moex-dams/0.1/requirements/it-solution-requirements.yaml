catalog_id: dams:req-catalog/it-solution/0.1
name: it_solution_requirements
requirements:
- element_id: dams:req/GEN-001
  name: model_package_identity
  title: Идентичность и ответственность пакета
  description: Identity, version, lifecycle и ownership пакета модели.
  lifecycle_status: approved
  implementation_status: verified
  code: GEN-001
  requirement_level: it_solution
  requirement_section: GEN
  statement: У пакета модели данных ИТ-решения должны быть стабильный идентификатор, понятное название,
    описание, версия и статус жизненного цикла. Должен быть указан ответственный за данные (владелец данных)
    либо явно описано, от какого объекта наследуется эта ответственность (например от ИТ-решения или доменного
    контекста). Локальное уточнение ответственности поверх правила наследования допускается.
  applies_to:
    applicability_id: appl:GEN-001
    applies_target_class: ModelPackage
    applies_implementation_scope: solution
    applies_dams_model_level: solution
  formal_checks:
  - check_id: GEN-001.c1
    kind: slot_required
    target_class: ModelPackage
    target_slot: element_id
    severity: error
    diagnostic_code: DAMS-STRUCT-001
    remediation: Укажите стабильный element_id пакета модели.
  - check_id: GEN-001.c2
    kind: slot_required
    target_class: ModelPackage
    target_slot: name
    severity: error
    diagnostic_code: DAMS-STRUCT-002
    remediation: Укажите техническое имя пакета (name).
  - check_id: GEN-001.c3
    kind: slot_required
    target_class: ModelPackage
    target_slot: description
    severity: error
    remediation: Добавьте краткое описание назначения пакета.
    diagnostic_code: DAMS-REQ-GEN-001.c3
  - check_id: GEN-001.c4
    kind: slot_required
    target_class: ModelPackage
    target_slot: lifecycle_status
    severity: error
    remediation: Укажите lifecycle_status пакета (draft/active/…).
    diagnostic_code: DAMS-REQ-GEN-001.c4
  - check_id: GEN-001.c5
    kind: slot_required
    target_class: ModelPackage
    target_slot: api_version
    severity: error
    remediation: Укажите api_version схемы.
    diagnostic_code: DAMS-REQ-GEN-001.c5
  - check_id: GEN-001.c6
    kind: slot_required
    target_class: ModelPackage
    target_slot: model_version
    severity: error
    remediation: Укажите семантическую версию модели (model_version).
    diagnostic_code: DAMS-REQ-GEN-001.c6
  - check_id: GEN-001.c7
    kind: slot_required
    target_class: ModelPackage
    target_slot: data_owner_ref
    severity: error
    diagnostic_code: DAMS-REQ-GEN-001.c7
    remediation: Укажите data_owner_ref на пакете модели (корень containment cascade, ADR-023).
      ownership_inheritance_rule — только пояснение, не замена владельца.
- element_id: dams:req/GEN-002
  name: solution_binding
  title: Привязка к ИТ-решению
  description: Пакет уровня solution ссылается на ИТ-решение.
  lifecycle_status: approved
  code: GEN-002
  requirement_level: it_solution
  requirement_section: GEN
  statement: Пакет модели конкретного ИТ-решения должен ссылаться на одно ИТ-решение и быть помечен как
    модель уровня решения, а не как общекорпоративная концептуальная модель.
  applies_to:
    applicability_id: appl:GEN-002
    applies_target_class: ModelPackage
  formal_checks:
  - check_id: GEN-002.c1
    kind: slot_required
    target_class: ModelPackage
    target_slot: solution_ref
    severity: error
    diagnostic_code: DAMS-REQ-GEN-002.c1
    remediation: Укажите solution_ref на ИТ-решение из EAM.
  - check_id: GEN-002.c2
    kind: conditional_branch
    target_class: ModelPackage
    expression: implementation_scope_solution
    severity: error
    diagnostic_code: DAMS-REQ-GEN-002.c2
    remediation: Установите implementation_scope в значение solution.
- element_id: dams:req/GEN-003
  name: non_empty_model
  title: Непустой состав модели
  description: Пакет содержит logical или technical facet.
  lifecycle_status: approved
  code: GEN-003
  requirement_level: it_solution
  requirement_section: GEN
  statement: Пакет модели ИТ-решения должен содержать хотя бы одну логическую сущность или хотя бы один
    технический актив (носитель данных, точка доступа, контейнер или исполняемый актив). Пустой пакет не допускается.
  applies_to:
    applicability_id: appl:GEN-003
    applies_target_class: ModelPackage
    applies_implementation_scope: solution
  formal_checks:
  - check_id: GEN-003.c1
    kind: conditional_branch
    target_class: ModelPackage
    expression: non_empty_logical_or_physical
    severity: error
    diagnostic_code: DAMS-REQ-GEN-003.c1
    remediation: Добавьте хотя бы одну логическую сущность или технический актив (DataCarrier и др.).
- element_id: dams:req/GEN-004
  name: data_carrier_semantic_link
  title: Носители данных связаны со смыслом
  description: DataCarrier имеет entity mapping или technical-only.
  lifecycle_status: approved
  code: GEN-004
  requirement_level: it_solution
  requirement_section: GEN
  statement: >-
    Если в пакете описан носитель данных (DataCarrier), который сам несёт или предоставляет данные
    (реляционная таблица/представление, файл, набор данных, API-ресурс, топик/очередь/тип сообщения и т.п.),
    для него должно быть показано соответствие логическому смыслу либо явно указано, что носитель только
    технический/служебный, с кратким обоснованием. Инфраструктурные контейнеры (DataContainer — БД, схема,
    бакет, брокер и т.п.) и точки доступа (AccessPoint) этим требованием не покрываются автоматически.
  applies_to:
    applicability_id: appl:GEN-004
    applies_target_class: DataCarrier
    applies_implementation_scope: solution
    applies_target_kinds:
    - relational_table
    - relational_view
    - file
    - dataset
    - stream_topic
    - stream_queue
    - message_type
    - api_resource
    - other
  formal_checks:
  - check_id: GEN-004.c1
    kind: conditional_branch
    target_class: DataCarrier
    expression: data_carrying_entity_mapping_or_technical
    severity: error
    diagnostic_code: DAMS-REQ-GEN-004.c1
    remediation: 'Добавьте Mapping типа entity_physical на логическую сущность либо укажите mapping_coverage_status:
      technical-only и mapping_rationale.'
- element_id: dams:req/LDM-001
  name: logical_entity_context
  title: Контекст и роль данных
  description: Обязательные context_ref и solution_data_role.
  lifecycle_status: approved
  implementation_status: implemented
  code: LDM-001
  requirement_level: it_solution
  requirement_section: LDM
  statement: Каждая логическая сущность должна быть отнесена к доменному контексту внутри пакета и к роли
    данных решения (создаёт/хранит, потребляет или посредничает).
  applies_to:
    applicability_id: appl:LDM-001
    applies_target_class: LogicalEntity
    applies_implementation_scope: solution
  formal_checks:
  - check_id: LDM-001.c1
    kind: slot_required
    target_class: LogicalEntity
    target_slot: context_ref
    severity: error
    remediation: Укажите context_ref на доменный контекст того же пакета.
    diagnostic_code: DAMS-REQ-LDM-001.c1
  - check_id: LDM-001.c2
    kind: slot_required
    target_class: LogicalEntity
    target_slot: solution_data_role
    severity: error
    remediation: Укажите solution_data_role (producer/consumer/intermediary).
    diagnostic_code: DAMS-REQ-LDM-001.c2
  - check_id: LDM-001.c3
    kind: ref_resolves
    target_class: LogicalEntity
    target_slot: context_ref
    severity: error
    diagnostic_code: DAMS-REF-002
    remediation: Исправьте context_ref — ссылка должна указывать на контекст в пакете.
- element_id: dams:req/LDM-002
  name: logical_entity_identity_ownership
  title: Обозначение и ответственность сущности
  description: title/name/description/lifecycle и ownership.
  lifecycle_status: approved
  code: LDM-002
  requirement_level: it_solution
  requirement_section: LDM
  statement: У логической сущности должны быть русское бизнес-название, техническое имя,
    разрешимое эталонное определение (own description либо наследование по ADR-025),
    статус жизненного цикла и ответственный за данные либо наследование ответственности (ADR-023).
  applies_to:
    applicability_id: appl:LDM-002
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-002.c1
    kind: slot_required
    target_class: LogicalEntity
    target_slot: title
    severity: error
    diagnostic_code: DAMS-REQ-LDM-002.c1
    remediation: Укажите русское бизнес-название (title) в единственном числе.
  - check_id: LDM-002.c2
    kind: slot_required
    target_class: LogicalEntity
    target_slot: name
    severity: error
    remediation: Укажите техническое имя сущности (name).
    diagnostic_code: DAMS-REQ-LDM-002.c2
  - check_id: LDM-002.c3
    kind: definition_resolvable
    target_class: LogicalEntity
    severity: error
    remediation: >
      Задайте description (own), либо definition_source_ref / единственный
      conceptual_entity_refs для наследования эталонного определения (ADR-025).
    diagnostic_code: DAMS-REQ-LDM-002.c3
  - check_id: LDM-002.c4
    kind: slot_required
    target_class: LogicalEntity
    target_slot: lifecycle_status
    severity: error
    remediation: Укажите lifecycle_status сущности.
    diagnostic_code: DAMS-REQ-LDM-002.c4
  - check_id: LDM-002.c5
    kind: at_least_one_slots
    target_class: LogicalEntity
    target_slots:
    - data_owner_ref
    - data_steward_ref
    effective: true
    severity: error
    diagnostic_code: DAMS-REQ-LDM-002.c5
    remediation: Укажите data_owner_ref или data_steward_ref на сущности либо наследуйте
      от пакета (ADR-023 containment cascade).
- element_id: dams:req/LDM-003
  name: logical_entity_classification
  title: Классификация сущности
  description: entity_type, data_class, business_importance, governance.
  lifecycle_status: approved
  code: LDM-003
  requirement_level: it_solution
  requirement_section: LDM
  statement: Для логической сущности должны быть независимо указаны архитектурная роль, природа данных,
    важность для бизнеса и базовая классификация управления доступом/чувствительностью. Эти признаки не
    подменяют друг друга.
  applies_to:
    applicability_id: appl:LDM-003
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-003.c1
    kind: slot_required
    target_class: LogicalEntity
    target_slot: entity_type
    severity: error
    diagnostic_code: DAMS-REQ-LDM-003.c1
    remediation: Укажите архитектурную роль (entity_type).
  - check_id: LDM-003.c2
    kind: slot_required
    target_class: LogicalEntity
    target_slot: data_class
    severity: error
    remediation: Укажите природу данных (data_class).
    diagnostic_code: DAMS-REQ-LDM-003.c2
  - check_id: LDM-003.c3
    kind: slot_required
    target_class: LogicalEntity
    target_slot: business_importance
    severity: error
    remediation: Укажите business_importance сущности.
    diagnostic_code: DAMS-REQ-LDM-003.c3
  - check_id: LDM-003.c4
    kind: slot_required
    target_class: LogicalEntity
    target_slot: governance_classification
    effective: true
    severity: error
    remediation: Укажите governance_classification на сущности либо наследуйте от пакета
      (ADR-023 containment cascade).
    diagnostic_code: DAMS-REQ-LDM-003.c4
- element_id: dams:req/LDM-004
  name: identity_rule_and_key
  title: Правило идентичности
  description: identity_rule и ключ; surrogate alone insufficient.
  lifecycle_status: approved
  code: LDM-004
  requirement_level: it_solution
  requirement_section: LDM
  statement: Для логической сущности должно быть описано, по каким деловым признакам два экземпляра считаются
    одним и тем же объектом, и указан характер ключа (натуральный, составной, внешний, локальный, суррогатный,
    производный) и/или состав ключевых атрибутов. Одного технического суррогатного ключа без делового
    правила для нетехнической сущности недостаточно.
  applies_to:
    applicability_id: appl:LDM-004
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-004.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm004_identity
    severity: error
    diagnostic_code: DAMS-REQ-LDM-004.c1
    remediation: Добавьте identity_rule и business_key_kind и/или key_attribute_refs. Для нетехнической
      сущности одного surrogate недостаточно.
- element_id: dams:req/LDM-005
  name: logical_entity_has_attributes
  title: Наличие характеристик
  description: ≥1 attribute unless technical with rationale.
  lifecycle_status: approved
  code: LDM-005
  requirement_level: it_solution
  requirement_section: LDM
  statement: У логической сущности должен быть хотя бы один логический атрибут. Исключение — техническая
    сущность с письменным обоснованием, почему характеристик нет.
  applies_to:
    applicability_id: appl:LDM-005
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-005.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm005_attributes
    severity: error
    diagnostic_code: DAMS-REQ-LDM-005.c1
    remediation: Добавьте хотя бы один атрибут либо для technical укажите isolation_rationale или alignment_rationale.
- element_id: dams:req/LDM-006
  name: conceptual_alignment
  title: Связь с корпоративными понятиями
  description: Status-driven conceptual alignment.
  lifecycle_status: approved
  code: LDM-006
  requirement_level: it_solution
  requirement_section: LDM
  statement: 'Логическая сущность должна быть прослеживаемо связана с корпоративным понятием либо иметь
    допустимый статус выравнивания с обоснованием: «ожидает решения», «только локальный смысл» или «не
    применимо» (только для технических сущностей). Ссылка на корпоративное понятие и пояснение характера
    реализации могут присутствовать одновременно.'
  applies_to:
    applicability_id: appl:LDM-006
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-006.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm006_alignment
    severity: error
    diagnostic_code: DAMS-REQ-LDM-006.c1
    remediation: Укажите conceptual_entity_refs (aligned) либо conceptual_alignment_status с alignment_rationale
      (pending/local-only; not-applicable только для technical).
- element_id: dams:req/LDM-007
  name: semantic_inclusion
  title: Семантическая включённость
  description: Relationship / conceptual / isolation — не physical mapping alone.
  lifecycle_status: approved
  code: LDM-007
  requirement_level: it_solution
  requirement_section: LDM
  statement: 'Нетехническая логическая сущность не должна быть изолированной: должна быть связь с другой
    логической сущностью, либо выравнивание/реализация корпоративного понятия, либо письменное обоснование
    изоляции. Одного только отображения на таблицу/API недостаточно, чтобы считать сущность включённой
    в смысловую модель.'
  applies_to:
    applicability_id: appl:LDM-007
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-007.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm007_semantic_inclusion
    severity: error
    diagnostic_code: DAMS-REQ-LDM-007.c1
    remediation: Добавьте связь с другой сущностью, conceptual alignment/realizes или isolation_rationale.
      Physical mapping сам по себе не достаточен.
- element_id: dams:req/LDM-008
  name: realization_completeness
  title: Полнота реализации зависимых концептов
  description: >
    Warning when an aligned LogicalEntity realizes a dependent enterprise concept
    without a logical Relationship to a peer that realizes each owner (ADR-029).
  lifecycle_status: approved
  code: LDM-008
  requirement_level: it_solution
  requirement_section: LDM
  statement: >-
    Если логическая сущность выровнена (aligned) с зависимым корпоративным
    понятием (entity_tier=dependent) из пакета, указанного в
    conceptual_implementation_ref, то в том же solution-пакете должна быть
    логическая связь с сущностью, реализующей каждого владельца из
    depends_on_refs. Нарушение — предупреждение (не ошибка): подсказка
    моделисту, не наследование атрибутов и не subclass.
  applies_to:
    applicability_id: appl:LDM-008
    applies_target_class: LogicalEntity
  formal_checks:
  - check_id: LDM-008.c1
    kind: conditional_branch
    target_class: LogicalEntity
    expression: ldm008_realization_completeness
    severity: warning
    diagnostic_code: DAMS-REQ-LDM-008.c1
    remediation: >-
      Добавьте Relationship к логической сущности, которая realizes владельца
      зависимого концепта (depends_on_refs), либо уточните conceptual_entity_refs.
- element_id: dams:req/ATR-001
  name: logical_attribute_core
  title: Основные свойства атрибута
  description: owner, type, required, multivalued.
  lifecycle_status: approved
  code: ATR-001
  requirement_level: it_solution
  requirement_section: ATR
  statement: У логического атрибута должны быть указаны владеющая сущность, логический тип, обязательность
    заполнения и признак множественности.
  applies_to:
    applicability_id: appl:ATR-001
    applies_target_class: LogicalAttribute
  formal_checks:
  - check_id: ATR-001.c1
    kind: slot_required
    target_class: LogicalAttribute
    target_slot: owner_entity_ref
    severity: error
    remediation: Укажите owner_entity_ref родительской сущности.
    diagnostic_code: DAMS-REQ-ATR-001.c1
  - check_id: ATR-001.c2
    kind: slot_required
    target_class: LogicalAttribute
    target_slot: logical_type
    severity: error
    remediation: Укажите logical_type атрибута.
    diagnostic_code: DAMS-REQ-ATR-001.c2
  - check_id: ATR-001.c3
    kind: slot_required
    target_class: LogicalAttribute
    target_slot: required
    severity: error
    remediation: Явно укажите обязательность (required).
    diagnostic_code: DAMS-REQ-ATR-001.c3
  - check_id: ATR-001.c4
    kind: slot_required
    target_class: LogicalAttribute
    target_slot: multivalued
    severity: error
    remediation: Явно укажите признак множественности (multivalued).
    diagnostic_code: DAMS-REQ-ATR-001.c4
- element_id: dams:req/ATR-002
  name: attribute_naming
  title: Именование атрибута
  description: Wave 2 soft — lower_snake_case technical name.
  lifecycle_status: approved
  code: ATR-002
  requirement_level: it_solution
  requirement_section: ATR
  statement: Техническое имя логического атрибута должно быть в стиле нижнего регистра с подчёркиваниями
    между словами. Не включайте в имя тип конкретной базы данных, длину поля или название таблицы.
  applies_to:
    applicability_id: appl:ATR-002
    applies_target_class: LogicalAttribute
  formal_checks:
  - check_id: ATR-002.c1
    kind: conditional_branch
    target_class: LogicalAttribute
    expression: atr002_snake_case
    severity: warning
    diagnostic_code: DAMS-REQ-ATR-002.c1
    remediation: Переименуйте name в lower_snake_case (например party_id).
- element_id: dams:req/ATR-005
  name: attribute_physical_coverage
  title: Отображение атрибута на реализацию
  description: Mapping coverage for applicable attributes.
  lifecycle_status: approved
  code: ATR-005
  requirement_level: it_solution
  requirement_section: ATR
  statement: Для логического атрибута, который считается подлежащим физической реализации в этом пакете
    (не помечен как планируемый, производный, унаследованный, неприменимый или только технический), должно
    быть задано соответствие физическому полю и/или правило вычисления, либо письменное обоснование отсутствия.
    Поле и правило вычисления могут быть указаны вместе. Статус «планируется» требует обоснования и не
    должен быть постоянным обходом для уже активных элементов.
  applies_to:
    applicability_id: appl:ATR-005
    applies_target_class: LogicalAttribute
  formal_checks:
  - check_id: ATR-005.c1
    kind: conditional_branch
    target_class: LogicalAttribute
    expression: atr005_mapping_coverage
    severity: error
    diagnostic_code: DAMS-REQ-ATR-005.c1
