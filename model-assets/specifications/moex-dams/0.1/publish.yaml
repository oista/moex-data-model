module_id: moex:module:dams
kind: publication_module
version: "1"
order: 100
icon: "📐"
title: moex.dams
description: "MOEX DAMS 0.1 reference specification (LinkML) — publication projection of the schema body"
profile: linkml-specification
sections:
  - id: overview
    title: Overview
    description: Package README
    type: markdown-doc
    kind: overview
    source:
      format: markdown
      path: README.md

  - id: explorer
    title: Specification explorer
    description: Schema packages and classes of the DAMS reference specification (TSpecBody projection)
    type: explorer
    kind: classes
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: classes
    groupby: schema

  - id: glossary
    title: Glossary
    description: Key DAMS terms for readers
    type: glossary
    kind: glossary
    source:
      format: json
      path: publications/dams_glossary.json
    key_column: id
    columns:
      - id
      - title
      - description
      - kind
    filterable:
      - kind

  - id: classes
    title: All classes
    description: Flat class table (secondary; primary nav is Specification explorer)
    type: entity-table
    kind: classes
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: classes
    columns:
      - name
      - description
      - is_a
      - abstract
      - mixins
    filterable:
      - is_a
      - abstract
    sort:
      by: name
      order: asc
    default_collapsed: true

  - id: slots
    title: All slots
    description: Flat slot table (secondary)
    type: entity-table
    kind: slots
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: slots
    columns:
      - name
      - description
      - range
      - required
      - multivalued
    filterable:
      - range
      - required
    default_collapsed: true

  - id: enums
    title: All enumerations
    description: Flat enum table (secondary)
    type: enum-table
    kind: enumerations
    source:
      format: linkml-yaml
      path: schemas/moex-dams.yaml
      select: enums
    columns:
      - name
      - description
    default_collapsed: true

  - id: publication-requirements
    title: Требования публикации
    description: >
      PublicationRequirement из publication-requirements.yaml (ADR-019).
      Inherited by Spec implementations via satisfies.
    type: entity-table
    kind: source
    source:
      format: yaml
      path: publication-requirements.yaml
      select: flattened_requirements
    columns:
      - id
      - name
      - description
      - profile
      - required
    filterable:
      - profile
      - required
    sort:
      by: id
      order: asc
    default_collapsed: true
