id: https://data.moex.com/dsp/v0.1
name: moex_dsp
version: 0.1.0
title: moex.dsp
description: >
  Metamodel of Data Specification Player — how specifications, publications,
  and navigation are projected for reading (not the domain data model itself).
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dsp: https://data.moex.com/dsp/
imports:
  - linkml:types
default_prefix: dsp
default_range: string

classes:
  NamedElement:
    abstract: true
    description: >
      Абстрактный именованный элемент метамодели плеера: стабильный идентификатор,
      отображаемое имя и описание для читателя.
    slots:
      - element_id
      - title
      - description

  ArchitectureCatalog:
    is_a: NamedElement
    description: >
      Навигационное дерево головных спецификаций и их реализаций, из которого
      строится боковая панель Data Specification Player.
    slots:
      - catalog_version
      - nodes

  CatalogNode:
    abstract: true
    is_a: NamedElement
    description: >
      Узел архитектурного каталога: либо эталонная спецификация, либо реализация,
      согласованная с эталоном.
    slots:
      - version
      - modeling_language
      - module_id

  ReferenceSpecification:
    is_a: CatalogNode
    description: >
      Головной эталонный пакет (например moex.dams или edmc.fibo): нормативное
      описание, к которому могут относиться реализации.
    slots:
      - implementations

  SpecificationImplementation:
    is_a: CatalogNode
    description: >
      Публикация, которая соответствует (conforms to) эталонной спецификации
      и показывается вложенной под ней в навигации.
    slots:
      - conforms_to

  PublicationModule:
    is_a: NamedElement
    description: >
      Публикуемый модуль контента: набор разделов (Overview, Classes, Glossary и др.),
      собранный из манифеста публикации. Набор module_id открыт.
    slots:
      - version
      - module_id
      - modeling_standard
      - sections

  PublicationSection:
    is_a: NamedElement
    description: >
      Экземпляр раздела модуля публикации: семантическая роль (section_role)
      и вид представления (section_kind) ортогональны.
    slots:
      - section_role
      - section_kind
      - items

  PublicationItem:
    is_a: NamedElement
    description: >
      Элемент содержимого раздела: класс, термин глоссария, узел дерева или
      иной читаемый объект внутри раздела.
    slots:
      - children

  PublicationProfile:
    is_a: NamedElement
    description: >
      Профиль публикации для семьи стандарта моделирования: фиксирует
      обязательные семантические роли разделов (PublicationSectionRole).
      Опциональные роли (requirements, implementations) допускаются сверх минимума.
    slots:
      - standard
      - required_roles

  ModelingStandard:
    is_a: NamedElement
    description: >
      Язык или стандарт моделирования, в котором выражена спецификация
      (версия/ревизия — экземпляры вне закрытого enum семьи). В каталоге
      отображается как метка языка модели; закрытый словарь семей — ModelingStandardFamily.

slots:
  element_id:
    identifier: true
    range: uriorcurie
    required: true
    description: Стабильный идентификатор элемента.
  title:
    range: string
    description: Отображаемое имя для читателя.
  description:
    range: string
    description: Краткое описание смысла элемента.
  catalog_version:
    range: string
    description: Версия схемы архитектурного каталога.
  nodes:
    range: CatalogNode
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Узлы навигационного дерева каталога.
  version:
    range: string
    description: Версия спецификации, реализации или модуля публикации.
  modeling_language:
    range: ModelingStandardFamily
    description: >
      Семья языка моделирования узла каталога (выровнено с kernel StandardFamily).
  module_id:
    range: uriorcurie
    description: Идентификатор связанного модуля публикации.
  modeling_standard:
    range: ModelingStandardFamily
    description: >
      Семья стандарта, по которой выбирается PublicationProfile для модуля.
  implementations:
    range: SpecificationImplementation
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Реализации, относящиеся к этой эталонной спецификации.
  conforms_to:
    range: ReferenceSpecification
    description: Эталонная спецификация, которой соответствует реализация.
  sections:
    range: PublicationSection
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Разделы модуля публикации.
  section_role:
    range: PublicationSectionRole
    description: >
      Семантическая роль раздела (Overview, Classes, Glossary, …) — закрытый словарь.
  section_kind:
    range: SectionKind
    description: Вид представления (render) раздела для читателя — ортогонален роли.
  items:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Элементы содержимого раздела.
  children:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Вложенные элементы (иерархия классов или терминов).
  standard:
    range: ModelingStandardFamily
    required: true
    description: Семья стандарта, для которой задан профиль.
  required_roles:
    range: PublicationSectionRole
    multivalued: true
    required: true
    description: Обязательные семантические роли разделов профиля.

enums:
  ModelingStandardFamily:
    description: >
      Закрытый словарь семей стандартов моделирования (выровнен с kernel StandardFamily).
      Конкретные version/revision — экземпляры ModelingStandard, не значения enum.
    permissible_values:
      linkml:
        description: LinkML schema language.
      openapi:
        description: OpenAPI specification family.
      owl:
        description: OWL / ontology family (в т.ч. FIBO profile).
      json_schema:
        description: JSON Schema family.
      shacl:
        description: SHACL shapes family.
      custom:
        description: Корпоративный или непрофильный формализм.

  PublicationSectionRole:
    description: >
      Семантические роли разделов публикации (закрытый словарь). Не путать с SectionKind (render).
    permissible_values:
      overview:
        description: Вводный обзор пакета (README / markdown Overview).
      classes:
        description: Иерархия классов спецификации или профиля (единое имя UI — «Классы»).
      specification:
        description: Нормативные исходные файлы спецификации (YAML/схемы).
      glossary:
        description: Глоссарий терминов с определениями.
      requirements:
        description: Опционально — каталог нормативных требований.
      implementations:
        description: Опционально — зарегистрированные реализации (conforms_to).

  SectionKind:
    description: >
      Виды представления (render) раздела в Data Specification Player.
      Ортогональны PublicationSectionRole.
    permissible_values:
      explorer:
        description: Иерархический обозреватель классов или структурных групп.
      glossary:
        description: Глоссарий терминов с определениями (render).
      markdown_doc:
        description: Обзорный документ в виде текста.
      entity_table:
        description: Табличный перечень сущностей или атрибутов.
      enum_table:
        description: Табличный перечень перечислений.
      tree:
        description: Дерево отношений (например иерархия классов).
      key_value:
        description: Пары ключ–значение для компактных сведений.
