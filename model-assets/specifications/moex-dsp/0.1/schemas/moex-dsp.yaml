id: https://data.moex.com/dsp/v0.1
name: moex_dsp
version: 0.1.0
title: moex.dsp
description: >
  Metamodel of Data Specification Player — how specifications, publications,
  and navigation are projected for reading (not the domain data model itself).
  See ADR-016 for PublicationSectionKind and publication profiles.
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dsp: https://data.moex.com/dsp/
imports:
  - linkml:types
default_prefix: dsp
default_range: string

classes:
  NamedElement:
    abstract: true
    description: >
      Абстрактный именованный элемент метамодели плеера: стабильный идентификатор,
      отображаемое имя и описание для читателя.
    slots:
      - element_id
      - title
      - description

  ArchitectureCatalog:
    is_a: NamedElement
    description: >
      Навигационное дерево головных спецификаций и их реализаций, из которого
      строится боковая панель Data Specification Player.
    slots:
      - catalog_version
      - nodes

  CatalogNode:
    abstract: true
    is_a: NamedElement
    description: >
      Узел архитектурного каталога: либо эталонная спецификация, либо реализация,
      согласованная с эталоном.
    slots:
      - version
      - modeling_language
      - module_id

  ReferenceSpecification:
    is_a: CatalogNode
    description: >
      Головной эталонный пакет (например moex.dams или edmc.fibo): нормативное
      описание, к которому могут относиться реализации.
    slots:
      - implementations

  SpecificationImplementation:
    is_a: CatalogNode
    description: >
      Публикация, которая соответствует (conforms to) эталонной спецификации
      и показывается вложенной под ней в навигации.
    slots:
      - conforms_to

  PublicationModule:
    is_a: NamedElement
    description: >
      Публикуемый модуль контента: открытый набор экземпляров разделов.
      Список module_id не закрыт enum’ом. Профиль (profile) выбирает ProfileSpec.
    slots:
      - version
      - module_id
      - profile
      - modeling_language
      - sections

  PublicationSection:
    is_a: NamedElement
    description: >
      Экземпляр раздела модуля: семантический kind (PublicationSectionKind)
      и вид представления SectionKind (render/wire) ортогональны (ADR-016).
    slots:
      - publication_section_kind
      - section_kind
      - items

  PublicationItem:
    is_a: NamedElement
    description: >
      Элемент содержимого раздела: класс, термин глоссария, узел дерева или
      иной читаемый объект внутри раздела.
    slots:
      - children

  PublicationProfile:
    is_a: NamedElement
    description: >
      ProfileSpec публикации: required / recommended / forbidden
      PublicationSectionKind для данного PublicationProfileId (ADR-016).
    slots:
      - profile_id
      - required_kinds
      - recommended_kinds
      - forbidden_kinds

  ModelingStandard:
    is_a: NamedElement
    description: >
      Язык или стандарт моделирования (версия/ревизия — экземпляры).
      Закрытый словарь семей — ModelingStandardFamily. Не путать с profile.

slots:
  element_id:
    identifier: true
    range: uriorcurie
    required: true
    description: Стабильный идентификатор элемента.
  title:
    range: string
    description: Отображаемое имя для читателя.
  description:
    range: string
    description: Краткое описание смысла элемента.
  catalog_version:
    range: string
    description: Версия схемы архитектурного каталога.
  nodes:
    range: CatalogNode
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Узлы навигационного дерева каталога.
  version:
    range: string
    description: Версия спецификации, реализации или модуля публикации.
  modeling_language:
    range: ModelingStandardFamily
    description: >
      Семья языка моделирования (метка). Профиль публикации задаётся слотом profile.
  module_id:
    range: uriorcurie
    description: Идентификатор связанного модуля публикации.
  profile:
    range: PublicationProfileId
    description: Профиль публикации (выбирает ProfileSpec / required kinds).
  implementations:
    range: SpecificationImplementation
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Реализации, относящиеся к этой эталонной спецификации.
  conforms_to:
    range: ReferenceSpecification
    description: Эталонная спецификация, которой соответствует реализация.
  sections:
    range: PublicationSection
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Разделы модуля публикации.
  publication_section_kind:
    range: PublicationSectionKind
    description: Семантический вид раздела (ADR-016). Не путать с section_kind (render).
  section_kind:
    range: SectionKind
    description: Вид представления (render/wire) раздела — ортогонален publication_section_kind.
  items:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Элементы содержимого раздела.
  children:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Вложенные элементы (иерархия классов или терминов).
  profile_id:
    range: PublicationProfileId
    required: true
    description: Идентификатор профиля публикации.
  required_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Обязательные семантические виды разделов.
  recommended_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Рекомендуемые виды разделов.
  forbidden_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Запрещённые виды разделов для этого профиля.

enums:
  ModelingStandardFamily:
    description: >
      Закрытый словарь семей стандартов (выровнен с kernel StandardFamily).
      Метка языка; не ключ ProfileSpec.
    permissible_values:
      linkml:
        description: LinkML schema language.
      openapi:
        description: OpenAPI specification family.
      owl:
        description: OWL / ontology family.
      json_schema:
        description: JSON Schema family.
      shacl:
        description: SHACL shapes family.
      custom:
        description: Корпоративный или непрофильный формализм.

  PublicationProfileId:
    description: Идентификаторы профилей публикации (ADR-016).
    permissible_values:
      linkml-specification:
        description: Эталонная LinkML-спецификация (DAMS и аналоги).
      ontology:
        description: Онтологический профиль (FIBO и аналоги); primary nav = taxonomy.
      implementation:
        description: Реализация / conformance-срез относительно эталона.

  PublicationSectionKind:
    description: >
      Семантические виды разделов публикации (закрытый словарь, ADR-016).
      Не путать с SectionKind (render/wire в manifest type).
    permissible_values:
      overview:
        description: Назначение публикации, состав, быстрый старт.
      classes:
        description: >
          Типы/концепции предметной области. Renderer от profile:
          data-structure (LinkML) или ontology-list (OWL).
      slots:
        description: Атрибуты и свойства (LinkML slots, OWL dataProperties).
      enumerations:
        description: Закрытые перечисления допустимых значений.
      schema-files:
        description: Исходные файлы схемы с зависимостями.
      taxonomy:
        description: >
          Иерархия как первоклассный раздел. Только для онтологий, где
          иерархия — главная навигационная ось. Не дублирует classes.
      glossary:
        description: Естественно-языковые термины с определениями.
      identity:
        description: IRI, URI, source namespace.
      bindings:
        description: Привязки реализации к спецификации.
      data-flows:
        description: Потоки данных.
      conformance:
        description: Результаты валидации реализации.
      source:
        description: Исходный код схемы.

  SectionKind:
    description: >
      Виды представления (render/wire) раздела в Data Specification Player.
      Ортогональны PublicationSectionKind. Manifest field: type.
    permissible_values:
      explorer:
        description: Иерархический обозреватель.
      glossary:
        description: Глоссарий терминов (render).
      markdown_doc:
        description: Обзорный документ в виде текста.
      entity_table:
        description: Табличный перечень сущностей или атрибутов.
      enum_table:
        description: Табличный перечень перечислений.
      tree:
        description: Дерево отношений.
      key_value:
        description: Пары ключ–значение.
