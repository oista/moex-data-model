id: https://data.moex.com/dsp/v0.1
name: moex_dsp
version: 0.1.0
title: moex.dsp
description: >
  Metamodel of Data Specification Player — how specifications, publications,
  and navigation are projected for reading (not the domain data model itself).
  See ADR-016 for PublicationSectionKind and publication profiles;
  ADR-019 for publication contract inheritance (PublicationRequirement / satisfies).
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  dsp: https://data.moex.com/dsp/
imports:
  - linkml:types
default_prefix: dsp
default_range: string

classes:
  NamedElement:
    abstract: true
    description: >
      Абстрактный именованный элемент метамодели плеера: стабильный идентификатор,
      отображаемое имя и описание для читателя.
    slots:
      - element_id
      - title
      - description

  ArchitectureCatalog:
    is_a: NamedElement
    description: >
      Навигационное дерево головных спецификаций и их реализаций, из которого
      строится боковая панель Data Specification Player.
    slots:
      - catalog_version
      - nodes

  CatalogNode:
    abstract: true
    is_a: NamedElement
    description: >
      Узел архитектурного каталога: либо эталонная спецификация, либо реализация,
      согласованная с эталоном.
    slots:
      - version
      - modeling_language
      - module_id

  ReferenceSpecification:
    is_a: CatalogNode
    description: >
      Головной эталонный пакет (например moex.dams или edmc.fibo): нормативное
      описание, к которому могут относиться реализации.
    slots:
      - implementations

  SpecificationImplementation:
    is_a: CatalogNode
    description: >
      Публикация, которая соответствует (conforms to) эталонной спецификации
      и показывается вложенной под ней в навигации.
    slots:
      - conforms_to

  PublicationModule:
    is_a: NamedElement
    description: >
      Публикуемый модуль контента: открытый набор экземпляров разделов.
      Список module_id не закрыт enum’ом. Профиль (profile) выбирает ProfileSpec.
    slots:
      - version
      - module_id
      - profile
      - modeling_language
      - sections

  PublicationSection:
    is_a: NamedElement
    description: >
      Экземпляр раздела модуля: семантический kind (PublicationSectionKind)
      и вид представления SectionKind (render/wire) ортогональны (ADR-016).
      satisfies связывает раздел с PublicationRequirement (ADR-019).
    slots:
      - publication_section_kind
      - section_kind
      - satisfies
      - items

  PublicationItem:
    is_a: NamedElement
    description: >
      Элемент содержимого раздела: класс, термин глоссария, узел дерева или
      иной читаемый объект внутри раздела.
    slots:
      - children

  PublicationRequirement:
    is_a: NamedElement
    description: >
      Обязательство publication contract: capability, которую реализация
      должна покрыть секциями через satisfies (ADR-019). Не требует
      одноимённого PublicationModule у эталона.
    slots:
      - requirement_id
      - requirement_kind
      - semantic_capability
      - obligation
      - min_occurs
      - max_occurs
      - accepted_section_kinds
      - accepted_renderers
      - expected_semantic_types
      - applies_when
      - inherited_from
      - applies_to_profile

  PublicationProfile:
    is_a: NamedElement
    description: >
      ProfileSpec публикации: required / recommended / forbidden
      PublicationSectionKind (ADR-016) плюс список PublicationRequirement
      и опциональный parent_profile_ref (ADR-019).
    slots:
      - profile_id
      - applies_to
      - parent_profile_ref
      - required_kinds
      - recommended_kinds
      - forbidden_kinds
      - requirements

  RequirementResult:
    is_a: NamedElement
    description: >
      Результат проверки одного PublicationRequirement в publication-слойном отчёте.
    slots:
      - requirement_ref
      - covered
      - covering_section_ids
      - result_status
      - result_message

  PublicationConformanceReport:
    is_a: NamedElement
    description: >
      Агрегированный отчёт покрытия publication requirements реализацией.
      Не путать с kernel ConformanceReport (семантика тела модели).
    slots:
      - implementation_ref
      - reference_specification_ref
      - profile_ref
      - overall_publication_status
      - requirement_results

  ModelingStandard:
    is_a: NamedElement
    description: >
      Язык или стандарт моделирования (версия/ревизия — экземпляры).
      Закрытый словарь семей — ModelingStandardFamily. Не путать с profile.

slots:
  element_id:
    identifier: true
    range: uriorcurie
    required: true
    description: Стабильный идентификатор элемента.
  title:
    range: string
    description: Отображаемое имя для читателя.
  description:
    range: string
    description: Краткое описание смысла элемента.
  catalog_version:
    range: string
    description: Версия схемы архитектурного каталога.
  nodes:
    range: CatalogNode
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Узлы навигационного дерева каталога.
  version:
    range: string
    description: Версия спецификации, реализации или модуля публикации.
  modeling_language:
    range: ModelingStandardFamily
    description: >
      Семья языка моделирования (метка). Профиль публикации задаётся слотом profile.
  module_id:
    range: uriorcurie
    description: Идентификатор связанного модуля публикации.
  profile:
    range: PublicationProfileId
    description: Профиль публикации (выбирает ProfileSpec / required kinds).
  implementations:
    range: SpecificationImplementation
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Реализации, относящиеся к этой эталонной спецификации.
  conforms_to:
    range: ReferenceSpecification
    description: Эталонная спецификация, которой соответствует реализация.
  sections:
    range: PublicationSection
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Разделы модуля публикации.
  publication_section_kind:
    range: PublicationSectionKind
    description: Семантический вид раздела (ADR-016). Не путать с section_kind (render).
  section_kind:
    range: SectionKind
    description: Вид представления (render/wire) раздела — ортогонален publication_section_kind.
  items:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Элементы содержимого раздела.
  children:
    range: PublicationItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Вложенные элементы (иерархия классов или терминов).
  profile_id:
    range: PublicationProfileId
    required: true
    description: Идентификатор профиля публикации.
  required_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Обязательные семантические виды разделов.
  recommended_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Рекомендуемые виды разделов.
  forbidden_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Запрещённые виды разделов для этого профиля.
  satisfies:
    range: PublicationRequirement
    multivalued: true
    description: >
      PublicationRequirement, которые этот раздел покрывает (ADR-019).
      Допустима агрегация (один section → много requirements).
  requirement_id:
    range: uriorcurie
    description: Стабильный id требования (например dams:logical-entities).
  requirement_kind:
    range: PublicationRequirementKind
    description: Тип проверки требования (section / semantic-content / binding / evidence).
  semantic_capability:
    range: string
    description: Краткий идентификатор capability (overview, logical-entities, …).
  obligation:
    range: PublicationObligation
    description: required | recommended | forbidden.
  min_occurs:
    range: integer
    description: Минимальное число покрывающих секций (по умолчанию 1 для required).
  max_occurs:
    range: integer
    description: Максимум покрывающих секций; отсутствие = без верхней границы.
  accepted_section_kinds:
    range: PublicationSectionKind
    multivalued: true
    description: Допустимые PublicationSectionKind для покрытия.
  accepted_renderers:
    range: string
    multivalued: true
    description: Допустимые renderer / manifest type значения.
  expected_semantic_types:
    range: string
    multivalued: true
    description: Ожидаемые типы сущностей в источнике (LogicalEntity, …).
  applies_when:
    range: string
    description: Условие применимости (свободный текст / выражение для checker).
  inherited_from:
    range: uriorcurie
    description: Id родительского requirement / профиля, от которого унаследовано.
  applies_to_profile:
    range: PublicationProfileId
    description: Базовый PublicationProfileId, к которому применяется требование.
  applies_to:
    range: string
    description: Вид артефакта / SpecificationKind, к которому относится профиль.
  parent_profile_ref:
    range: uriorcurie
    description: Ссылка на родительский PublicationProfile (наследование requirements).
  requirements:
    range: PublicationRequirement
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Список PublicationRequirement профиля.
  requirement_ref:
    range: uriorcurie
    description: Id проверенного PublicationRequirement.
  covered:
    range: boolean
    description: Покрыто ли требование хотя бы одной секцией.
  covering_section_ids:
    range: uriorcurie
    multivalued: true
    description: Id секций, заявивших satisfies на это требование.
  result_status:
    range: PublicationConformanceStatus
    description: Статус по одному требованию.
  result_message:
    range: string
    description: Человекочитаемое пояснение результата.
  implementation_ref:
    range: uriorcurie
    description: Id реализации, для которой собран отчёт.
  reference_specification_ref:
    range: uriorcurie
    description: Id эталонной спецификации.
  profile_ref:
    range: uriorcurie
    description: Id conformance / publication profile, по которому проверяли.
  overall_publication_status:
    range: PublicationConformanceStatus
    description: Итоговый статус publication-слойного отчёта.
  requirement_results:
    range: RequirementResult
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Результаты по каждому требованию.

enums:
  ModelingStandardFamily:
    description: >
      Закрытый словарь семей стандартов (выровнен с kernel StandardFamily).
      Метка языка; не ключ ProfileSpec.
    permissible_values:
      linkml:
        description: LinkML schema language.
      openapi:
        description: OpenAPI specification family.
      owl:
        description: OWL / ontology family.
      json_schema:
        description: JSON Schema family.
      shacl:
        description: SHACL shapes family.
      custom:
        description: Корпоративный или непрофильный формализм.

  PublicationProfileId:
    description: Идентификаторы профилей публикации (ADR-016).
    permissible_values:
      linkml-specification:
        description: Эталонная LinkML-спецификация (DAMS и аналоги).
      ontology:
        description: Онтологический профиль (FIBO и аналоги); primary nav = taxonomy.
      implementation:
        description: Реализация / conformance-срез относительно эталона.

  PublicationSectionKind:
    description: >
      Семантические виды разделов публикации (закрытый словарь, ADR-016).
      Не путать с SectionKind (render/wire в manifest type).
    permissible_values:
      overview:
        description: Назначение публикации, состав, быстрый старт.
      classes:
        description: >
          Типы/концепции предметной области. Renderer от profile:
          data-structure (LinkML) или ontology-list (OWL).
      slots:
        description: Атрибуты и свойства (LinkML slots, OWL dataProperties).
      enumerations:
        description: Закрытые перечисления допустимых значений.
      schema-files:
        description: Исходные файлы схемы с зависимостями.
      taxonomy:
        description: >
          Иерархия как первоклассный раздел. Только для онтологий, где
          иерархия — главная навигационная ось. Не дублирует classes.
      glossary:
        description: Естественно-языковые термины с определениями.
      identity:
        description: IRI, URI, source namespace.
      bindings:
        description: Привязки реализации к спецификации.
      data-flows:
        description: Потоки данных.
      conformance:
        description: Результаты валидации реализации.
      source:
        description: Исходный код схемы.
      external-specification-scope:
        description: >
          Граница поиска/интереса по внешней спецификации (ADR-020).
          Не означает импорт upstream domains.
      competency-questions:
        description: Competency questions, на которых основан term selection (ADR-020).
      term-selection:
        description: Таблица выбранных upstream-терминов и решений (ADR-020).
      mapping-table:
        description: >
          Регистр mappings MOEX ↔ upstream из ExternalTermSelection (ADR-020).
          Не путать с bindings реализации.
      dependency-list:
        description: Зависимости / materialized external modules (ADR-020).
      extraction-provenance:
        description: План и provenance extract (ROBOT и аналоги, ADR-020).

  SectionKind:
    description: >
      Виды представления (render/wire) раздела в Data Specification Player.
      Ортогональны PublicationSectionKind. Manifest field: type.
    permissible_values:
      explorer:
        description: Иерархический обозреватель.
      glossary:
        description: Глоссарий терминов (render).
      markdown_doc:
        description: Обзорный документ в виде текста.
      entity_table:
        description: Табличный перечень сущностей или атрибутов.
      enum_table:
        description: Табличный перечень перечислений.
      tree:
        description: Дерево отношений.
      key_value:
        description: Пары ключ–значение.

  PublicationRequirementKind:
    description: Виды PublicationRequirement (ADR-019).
    permissible_values:
      required-section:
        description: В публикации покрыта обязательная capability (секция с satisfies).
      required-semantic-content:
        description: В источнике есть сущности ожидаемых semantic types.
      required-binding:
        description: Явная связь реализации с эталоном (implements / conforms_to).
      required-evidence:
        description: Доказательство происхождения / соответствия (provenance fields).

  PublicationObligation:
    description: Сила обязательства требования.
    permissible_values:
      required:
        description: Обязательно для conformance.
      recommended:
        description: Рекомендуется; отсутствие — soft warning.
      forbidden:
        description: Не должно присутствовать в публикации данного профиля.

  PublicationConformanceStatus:
    description: >
      Статус publication-слойного conformance (не kernel ConformanceResult).
    permissible_values:
      conformant:
        description: Все mandatory requirements покрыты и опубликованы.
      partially-conformant:
        description: Каркас соблюдён; часть аспектов намеренно отсутствует или N/A.
      draft-conformant:
        description: Структурно покрывает профиль; содержание inferred / не утверждено.
