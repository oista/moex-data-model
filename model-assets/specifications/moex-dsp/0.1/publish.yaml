module_id: moex:module:dsp
kind: publication_module
version: "1"
order: 105
icon: "▶️"
title: moex.dsp
profile: linkml-specification
description: >
  Metamodel of Data Specification Player — how architecture catalog, publication
  modules, sections and items are projected for reading.
sections:
  - id: overview
    title: Overview
    description: What Data Specification Player is and how moex.dsp fits under moex.dams
    kind: overview
    type: markdown-doc
    source:
      format: markdown
      path: README.md

  - id: explorer
    title: Classes
    description: Typed class hierarchy of the player publication metamodel
    kind: classes
    type: explorer
    source:
      format: linkml-yaml
      path: schemas/moex-dsp.yaml
      select: classes
    groupby: schema
    tags:
      - dsp

  - id: glossary
    title: Glossary
    description: >
      Flat A–Z view of DSP metamodel classes/enums (ADR-025). Regenerated from
      SchemaView at viewer build; JSON stub is not authoritative.
    kind: glossary
    type: glossary
    source:
      format: json
      path: publications/dsp_glossary.json
    key_column: id
    columns:
      - id
      - title
      - description
      - kind
    filterable:
      - kind
      - origin
      - defined_in
    tags:
      - dsp
      - glossary
