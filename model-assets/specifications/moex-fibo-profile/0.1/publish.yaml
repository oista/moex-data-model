module_id: moex:module:fibo-profile
kind: publication_module
version: "1"
order: 195
icon: "📘"
title: edmc.fibo
description: >
  Organizational profile of FIBO (domains, modules, ontology headers,
  IRI and annotation conventions) plus OWL class index and glossary
  from the shared release preview (ADR-024).
profile: ontology
sections:
  - id: overview
    title: Overview
    description: Profile README
    type: markdown-doc
    kind: overview
    source:
      format: markdown
      path: README.md

  - id: explorer
    title: Profile explorer
    description: >
      Classes (OWL hierarchy), modules, identity conventions, glossary link,
      and implementations (ADR-024).
    type: explorer
    kind: classes
    source:
      format: json
      path: publications/fibo_profile_explorer.json
    tags:
      - fibo
      - fibo-profile
      - ontology

  - id: glossary
    title: Glossary
    description: >
      Flat alphabetical view of the same OWL classes as the Classes tree
      (shared fibo_glossary.preview.csv).
    type: glossary
    kind: glossary
    source:
      format: csv
      path: ../../../../packages/ontology/publications/fibo_glossary.preview.csv
    key_column: local_name
    columns:
      - local_name
      - label
      - label_ru
      - definition
      - definition_ru
      - parent_local_name
      - source_domain
      - iri
    filterable:
      - source_domain
    tags:
      - fibo
      - glossary
      - ontology
