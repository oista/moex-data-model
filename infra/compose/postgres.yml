services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moex
      POSTGRES_PASSWORD: moex
      POSTGRES_DB: moex
    ports:
      - "5432:5432"
    volumes:
      - moex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moex -d moex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moex_pg_data:
