name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      # pwsh is preinstalled on ubuntu-latest; Makefile selects it via OS!=Windows_NT
      - name: Stage 0 make check
        run: make check

  # Viewer + ontology packages stay outside Stage 0 gate (heavier / separate deps)
  viewer-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Ontology packages pytest
        run: make packages-check

      - name: Viewer pytest + check
        run: make viewer-check

  # Workbench: API (SQLite), web (npm), drawDB adapter round-trip
  workbench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: drawDB adapter pytest
        run: make drawdb-adapter-check

      - name: API pytest
        run: make api-check

      - name: Web test + build
        run: make web-check
