name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install make / pwsh deps
        run: sudo apt-get update && sudo apt-get install -y make

      # Primary entry: scripts/check_all.py (Makefile ``check`` delegates here).
      # pwsh is preinstalled on ubuntu-latest for the underlying .ps1 steps.
      - name: Stage 0 check_all
        run: python scripts/check_all.py

  # Viewer + ontology packages stay outside Stage 0 gate (heavier / separate deps)
  viewer-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Ontology packages pytest
        run: make packages-check

      - name: Stage 8 ontology-check (pySHACL + linkml-owl)
        run: make ontology-check

      - name: Viewer pytest + check
        run: make viewer-check

  # Workbench: API (SQLite), web (npm), drawDB adapter round-trip
  workbench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: drawDB adapter pytest
        run: make drawdb-adapter-check

      - name: API pytest
        run: make api-check

      - name: Web test + build
        run: make web-check

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: drawDB bridge e2e
        run: make web-e2e
        env:
          CI: true
