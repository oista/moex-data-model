server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    # text/html is compressed by default. The publication page is about 9.6 MB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json;
    # Written by 40-moex-auth.sh before nginx starts. Empty when no htpasswd.
    include /etc/nginx/conf.d/auth.inc;

    # The embedded viewer asks these paths. Answer here so they never reach
    # model-api: a 404 from the API makes the viewer claim it is on the wrong server.
    location = /api/capabilities {
        default_type application/json;
        return 200 '{"edit":false}';
    }

    location = /api/layout {
        default_type application/json;
        return 404 '{"detail":"not found"}';
    }

    location /api/ {
        proxy_pass http://model-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Publication runs the constraint matrix against the models volume.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Both come from auth_basic. A client-supplied X-Moex-Actor is replaced.
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Moex-Actor $remote_user;
    }

    location /viewer/ {
        alias /usr/share/nginx/viewer/current/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
